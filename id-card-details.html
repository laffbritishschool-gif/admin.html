<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student ID Card | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css?v=7"><link rel="stylesheet" href="assets/id-card-pages.css?v=7"></head><body data-title="Student ID Card"><div id="page-loader" class="loader active"><div class="loader-box"><span class="spinner"></span><div>Preparing student ID card…</div></div></div><div id="app-shell" data-content=""></div><main id="module-content" class="page-content"></main><div id="toast-host"></div><script type="module">import{requireAdmin,mountShell,pageLoading}from'./assets/app.js?v=7';import{renderIdCardDetailsPage}from'./assets/id-card-pages.js?v=7';const u=await requireAdmin();if(u){mountShell(u);const host=document.querySelector('#module-content');const content=document.querySelector('.main .page-content');if(host&&content)content.appendChild(host);try{await renderIdCardDetailsPage()}catch(e){console.error('ID card details page failed',e);if(host)host.innerHTML='<div class="panel empty-state"><h3>Could not load ID card</h3><p>'+String(e?.message||'Please refresh and try again.').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</p><a class="btn" href="id-cards.html">Back to ID Cards</a></div>'}finally{pageLoading(false)}}else{pageLoading(false)}</script></body></html>
