<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ID Cards | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css?v=6"><link rel="stylesheet" href="assets/id-card-pages.css?v=6"><style>
.id-page{max-width:1280px;margin:0 auto}.id-hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:30px 32px;border-radius:24px;background:linear-gradient(135deg,#123d8f,#0a66c2);color:#fff;box-shadow:0 20px 50px rgba(18,61,143,.18)}.id-hero:before{content:"";position:absolute;width:260px;height:260px;border:38px solid rgba(244,196,0,.14);border-radius:50%;right:-100px;top:-140px}.id-hero>div,.id-hero .id-actions{position:relative;z-index:1}.id-kicker{font-size:10px;font-weight:800;letter-spacing:1.3px;color:#ffdc48}.id-hero h2{margin:6px 0 7px;font-size:28px}.id-hero p{margin:0;color:rgba(255,255,255,.8);font-size:12px}.id-actions{display:flex;gap:9px}.id-actions .btn{background:#fff;color:#123d8f}.id-actions .btn.secondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22)}.id-toolbar{margin-top:18px;padding:14px;display:flex;gap:10px;align-items:center}.id-search{flex:1;border:1px solid #dbe2ec;background:#fbfcff;border-radius:11px;padding:12px 13px;outline:0;font-size:12px}.id-search:focus{background:#fff;border-color:#0a66c2;box-shadow:0 0 0 4px rgba(10,102,194,.08)}.id-filter{border:1px solid #dbe2ec;border-radius:11px;padding:12px 13px;background:#fff;color:#14213d;font-size:11px;outline:0}.id-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.id-summary-card{background:#fff;border:1px solid #e6eaf0;border-radius:16px;padding:17px;box-shadow:0 10px 28px rgba(19,43,88,.06)}.id-summary-card small,.id-summary-card strong,.id-summary-card span{display:block}.id-summary-card small{font-size:9px;color:#667085;text-transform:uppercase;letter-spacing:.5px}.id-summary-card strong{font-size:25px;margin:4px 0}.id-summary-card span{font-size:9px;color:#98a2b3}.id-card-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.id-card-item{background:#fff;border:1px solid #e6eaf0;border-radius:17px;padding:16px;box-shadow:0 10px 28px rgba(19,43,88,.06);transition:.2s}.id-card-item:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(19,43,88,.1)}.id-card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.id-person{display:flex;gap:11px;align-items:center;min-width:0}.id-avatar{width:48px;height:48px;border-radius:14px;background:#eaf1ff;color:#123d8f;display:grid;place-items:center;font-weight:800;flex:0 0 48px}.id-person h3{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.id-person p{margin:4px 0 0;color:#667085;font-size:9px}.id-card-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.id-card-meta div{padding:10px;border:1px solid #edf0f4;border-radius:10px;background:#fbfcff}.id-card-meta small,.id-card-meta strong{display:block}.id-card-meta small{font-size:8px;color:#98a2b3}.id-card-meta strong{font-size:10px;margin-top:3px}.id-card-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px;padding-top:13px;border-top:1px solid #edf0f4}.id-empty{grid-column:1/-1;padding:42px 20px;text-align:center;border:1px dashed #d6deea;border-radius:15px;background:#fbfcff;color:#667085}.id-empty h3{margin:0 0 5px;font-size:14px;color:#14213d}.id-empty p{margin:0;font-size:10px}
@media(max-width:800px){.id-hero{align-items:flex-start;flex-direction:column;padding:24px}.id-hero h2{font-size:23px}.id-actions{width:100%}.id-actions .btn{flex:1;text-align:center}.id-toolbar{flex-direction:column;align-items:stretch}.id-search,.id-filter{width:100%}.id-summary{grid-template-columns:1fr}.id-card-list{grid-template-columns:1fr}}
</style></head><body data-title="ID Cards"><div id="page-loader" class="loader active"><div class="loader-box"><span class="spinner"></span><div>Loading student ID cards…</div></div></div><div id="app-shell" data-content=""></div><main id="module-content" class="page-content"><div class="id-page"><div class="loading-inline">Loading ID cards…</div></div></main><div id="toast-host"></div><script type="module">import{requireAdmin,mountShell,pageLoading}from'./assets/app.js?v=6';import'./assets/id-card-generation.js?v=1';import{renderIdCardsPage}from'./assets/id-card-pages.js?v=6';const u=await requireAdmin();if(u){mountShell(u);const host=document.querySelector('#module-content');const content=document.querySelector('.main .page-content');if(host&&content)content.appendChild(host);try{await renderIdCardsPage()}catch(e){console.error('ID Cards page failed',e);if(host)host.innerHTML='<div class="panel empty-state"><h3>Could not load ID Cards</h3><p>'+String(e?.message||'Please refresh and try again.').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</p></div>'}finally{pageLoading(false)}}else{pageLoading(false)}</script></body></html>
