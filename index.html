<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"></head><body data-title="Dashboard"><div id="page-loader" class="loader active"><div class="loader-box"><span class="spinner"></span><div>Loading dashboard…</div></div></div><div id="app-shell" data-content=""></div><div id="toast-host"></div><script type="module">import {requireAdmin,mountShell,renderStats,supabase,pageLoading,toast,escapeHtml} from './assets/app.js';const user=await requireAdmin();if(user){const shell=document.querySelector('#app-shell');shell.dataset.content=`${renderStats([{label:'Students',value:'—',meta:'Live records',icon:'♙'},{label:'Teachers',value:'—',meta:'Teaching staff',icon:'♟'},{label:'Classes',value:'—',meta:'Active classes',icon:'▤'},{label:'Pending Results',value:'—',meta:'Awaiting action',icon:'✓'}])}<div class="panel"><h2>Welcome back, ${escapeHtml(user.profile?.full_name||'Administrator')}</h2><p>Manage students, staff, academics, attendance, results and school operations from one place.</p><div class="quick-grid"><a class="quick" href="register-student.html"><b>Register a student</b><span>Add a new student record securely.</span></a><a class="quick" href="register-teacher.html"><b>Register a teacher</b><span>Add teaching staff and account access.</span></a><a class="quick" href="results.html"><b>Review results</b><span>Monitor result entry and publication.</span></a></div></div>`;mountShell(user);pageLoading(false);try{const {data}=await supabase.rpc('admin_dashboard_stats');if(data){const cards=document.querySelectorAll('.stat-card strong');const vals=[data.students??data.total_students,data.teachers??data.total_teachers,data.classes??data.total_classes,data.pending_results??data.pending];cards.forEach((x,i)=>{if(vals[i]!=null)x.textContent=vals[i]})}}catch(e){console.info('Dashboard stats unavailable',e)}}</script></body></html>
