<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"></head><body data-title="Dashboard"><div id="page-loader" class="loader active"><div class="loader-box"><span class="spinner"></span><div>Loading dashboard…</div></div></div><div id="app-shell" data-content=""></div><div id="toast-host"></div><script type="module">
import{requireAdmin,mountShell,supabase,pageLoading,toast,escapeHtml}from'./assets/app.js';
const user=await requireAdmin();
if(user){
 const shell=document.querySelector('#app-shell');
 shell.dataset.content=`<div class="dashboard-hero"><div><span class="hero-kicker">ADMINISTRATION OVERVIEW</span><h2>Welcome back, ${escapeHtml(user.profile?.full_name||'Administrator')} 👋</h2><p>Everything you need to manage Laff British Montessori School from one place.</p></div><div class="hero-actions"><a class="btn" href="register-student.html">+ Register student</a><a class="btn secondary" href="announcements.html">New announcement</a></div></div>
 <div id="dashboard-stats" class="stats-grid"><article class="stat-card"><div class="stat-icon">♙</div><div><span>Students</span><strong>—</strong><small>Live records</small></div></article><article class="stat-card"><div class="stat-icon">♟</div><div><span>Teachers</span><strong>—</strong><small>Teaching staff</small></div></article><article class="stat-card"><div class="stat-icon">▤</div><div><span>Classes</span><strong>—</strong><small>Active classes</small></div></article><article class="stat-card"><div class="stat-icon">✓</div><div><span>Pending Results</span><strong>—</strong><small>Awaiting action</small></div></article></div>
 <div class="dashboard-grid"><section class="panel activity-panel"><div class="panel-head"><div><h2>Recent activity</h2><p>Latest activity across the school system.</p></div><button class="btn secondary" id="refresh-dashboard">Refresh</button></div><div id="activity-list" class="activity-list"><div class="loading-inline">Loading activity…</div></div></section><section class="panel"><div class="panel-head"><div><h2>Quick actions</h2><p>Jump straight into common tasks.</p></div></div><div class="action-list"><a href="students.html"><span>♙</span><div><b>Manage students</b><small>Search, edit and review student records</small></div><i>→</i></a><a href="teachers.html"><span>♟</span><div><b>Manage teachers</b><small>Review teaching staff and profiles</small></div><i>→</i></a><a href="results.html"><span>✓</span><div><b>Results</b><small>Enter and review academic results</small></div><i>→</i></a><a href="attendance.html"><span>◷</span><div><b>Attendance</b><small>Monitor daily student attendance</small></div><i>→</i></a><a href="timetable.html"><span>▦</span><div><b>Timetable</b><small>Manage weekly school schedules</small></div><i>→</i></a><a href="fees.html"><span>₦</span><div><b>Fees & payments</b><small>Track fees and payment activity</small></div><i>→</i></a></div></section></div>
 <section class="panel"><div class="panel-head"><div><h2>School operations</h2><p>Access the major areas of administration.</p></div></div><div class="feature-grid"><a href="classes.html"><b>Classes</b><span>Organise class groups</span></a><a href="subjects.html"><b>Subjects</b><span>Manage curriculum</span></a><a href="announcements.html"><b>Announcements</b><span>Share school updates</span></a><a href="id-cards.html"><b>ID Cards</b><span>Manage student cards</span></a><a href="settings.html"><b>Settings</b><span>School configuration</span></a><a href="register-teacher.html"><b>Register Teacher</b><span>Add teaching staff</span></a></div></section>`;
 mountShell(user);pageLoading(false);
 async function stats(){try{const{data,error}=await supabase.rpc('admin_dashboard_stats');if(error)throw error;if(data){const d=Array.isArray(data)?data[0]:data;const vals=[d.students??d.total_students,d.teachers??d.total_teachers,d.classes??d.total_classes,d.pending_results??d.pending];document.querySelectorAll('#dashboard-stats .stat-card strong').forEach((x,i)=>{if(vals[i]!=null)x.textContent=vals[i]})}}catch(e){console.info('Dashboard stats unavailable',e)}}
 async function activity(){const box=document.querySelector('#activity-list');box.innerHTML='<div class="loading-inline">Loading activity…</div>';try{const queries=await Promise.all([supabase.from('students').select('id,first_name,last_name,student_id,created_at').order('created_at',{ascending:false}).limit(4),supabase.from('teachers').select('id,full_name,staff_id,created_at').order('created_at',{ascending:false}).limit(3),supabase.from('announcements').select('id,title,created_at').order('created_at',{ascending:false}).limit(3)]);const items=[];const s=queries[0].data||[],t=queries[1].data||[],a=queries[2].data||[];s.forEach(x=>items.push({date:x.created_at,icon:'♙',title:'New student registered',text:`${x.student_id||''} — ${x.first_name||''} ${x.last_name||''}`.trim()}));t.forEach(x=>items.push({date:x.created_at,icon:'♟',title:'Teacher record added',text:`${x.staff_id||''} — ${x.full_name||''}`.trim()}));a.forEach(x=>items.push({date:x.created_at,icon:'◉',title:'Announcement created',text:x.title||''}));items.sort((a,b)=>new Date(b.date)-new Date(a.date));box.innerHTML=items.length?items.slice(0,7).map(x=>`<div class="activity-item"><span class="activity-icon">${x.icon}</span><div><b>${escapeHtml(x.title)}</b><p>${escapeHtml(x.text)}</p></div><time>${new Date(x.date).toLocaleDateString()}</time></div>`).join(''):'<div class="empty">No recent activity yet.</div>'}catch(e){console.error(e);box.innerHTML='<div class="empty">Recent activity could not be loaded.</div>';toast('Some dashboard data could not be loaded.','error')}}
 document.querySelector('#refresh-dashboard').onclick=async()=>{await stats();await activity();toast('Dashboard refreshed.')};await Promise.all([stats(),activity()]);
}
</script></body></html>
