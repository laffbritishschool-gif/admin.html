<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"></head><body data-title="Dashboard"><div id="page-loader" class="loader active"><div class="loader-box"><span class="spinner"></span><div>Loading dashboard…</div></div></div><div id="app-shell" data-content=""></div><div id="toast-host"></div><script type="module">
import{requireAdmin,mountShell,supabase,pageLoading,toast,escapeHtml}from'./assets/app.js';
const user=await requireAdmin();
if(user){
 const shell=document.querySelector('#app-shell');
 shell.dataset.content=`<div class="dashboard-hero"><div><span class="hero-kicker">ADMINISTRATION OVERVIEW</span><h2>Welcome back, ${escapeHtml(user.profile?.full_name||'Administrator')} 👋</h2><p>Everything you need to manage Laff British Montessori School from one place.</p></div><div class="hero-actions"><a class="btn" href="register-student.html">+ Register student</a><a class="btn secondary" href="announcements.html">New announcement</a></div></div>
 <div id="dashboard-stats" class="dashboard-stat-strip"><article class="dashboard-stat-card" style="animation-delay:0ms"><div class="dashboard-stat-icon">ST</div><span>Students</span><strong>—</strong><small>Live student records</small></article><article class="dashboard-stat-card" style="animation-delay:60ms"><div class="dashboard-stat-icon">TC</div><span>Teachers</span><strong>—</strong><small>Teaching staff</small></article><article class="dashboard-stat-card" style="animation-delay:120ms"><div class="dashboard-stat-icon">CL</div><span>Classes</span><strong>—</strong><small>Active classes</small></article><article class="dashboard-stat-card" style="animation-delay:180ms"><div class="dashboard-stat-icon">RS</div><span>Results</span><strong>—</strong><small>Recorded result entries</small></article></div>
 <div class="dashboard-main-grid"><section class="panel activity-panel"><div class="panel-head dashboard-panel-head"><div><h2>Recent activity</h2><p>Latest activity across the school system.</p></div><button class="btn secondary" id="refresh-dashboard">Refresh</button></div><div id="activity-list" class="dashboard-activity-list"><div class="loading-inline">Loading activity…</div></div></section><section class="panel"><div class="panel-head dashboard-panel-head"><div><h2>Quick actions</h2><p>Jump straight into common tasks.</p></div></div><div class="dashboard-quick-grid"><a class="dashboard-quick-card" href="students.html"><span>👨‍🎓</span><b>Students</b><small>Search and manage records</small></a><a class="dashboard-quick-card" href="teachers.html"><span>👩‍🏫</span><b>Teachers</b><small>Review teaching staff</small></a><a class="dashboard-quick-card" href="results.html"><span>📊</span><b>Results</b><small>Enter and review results</small></a><a class="dashboard-quick-card" href="attendance.html"><span>◷</span><b>Attendance</b><small>Monitor daily attendance</small></a><a class="dashboard-quick-card" href="timetable.html"><span>▦</span><b>Timetable</b><small>Manage school schedules</small></a><a class="dashboard-quick-card" href="fees.html"><span>₦</span><b>Fees & Payments</b><small>Track payment activity</small></a></div><div class="dashboard-health"><div class="dashboard-health-item"><span>Today</span><strong id="dash-today">—</strong></div><div class="dashboard-health-item"><span>Attendance</span><strong id="dash-attendance">—</strong></div><div class="dashboard-health-item"><span>Announcements</span><strong id="dash-announcements">—</strong></div></div></section></div>
 <section class="panel"><div class="panel-head dashboard-panel-head"><div><h2>School operations</h2><p>Access the major areas of administration.</p></div></div><div class="dashboard-ops"><a class="dashboard-op-card" href="classes.html"><b>Classes</b><span>Organise class groups</span></a><a class="dashboard-op-card" href="subjects.html"><b>Subjects</b><span>Manage curriculum</span></a><a class="dashboard-op-card" href="announcements.html"><b>Announcements</b><span>Share school updates</span></a><a class="dashboard-op-card" href="id-cards.html"><b>ID Cards</b><span>Manage student cards</span></a><a class="dashboard-op-card" href="settings.html"><b>Settings</b><span>School configuration</span></a><a class="dashboard-op-card" href="register-teacher.html"><b>Register Teacher</b><span>Add teaching staff</span></a></div></section>`;
 mountShell(user);pageLoading(false);
 async function stats(){try{const results=await Promise.all([supabase.from('students').select('id',{count:'exact',head:true}),supabase.from('teachers').select('id',{count:'exact',head:true}),supabase.from('classes').select('id',{count:'exact',head:true}),supabase.from('results').select('id',{count:'exact',head:true}),supabase.from('attendance').select('id',{count:'exact',head:true}).eq('attendance_date',new Date().toISOString().slice(0,10)),supabase.from('announcements').select('id',{count:'exact',head:true})]);const vals=[...results.slice(0,4).map(x=>x.count??0)];document.querySelectorAll('#dashboard-stats .dashboard-stat-card strong').forEach((x,i)=>x.textContent=vals[i]??0);const today=document.querySelector('#dash-today');const att=document.querySelector('#dash-attendance');const ann=document.querySelector('#dash-announcements');if(today)today.textContent=new Date().toLocaleDateString('en-NG',{weekday:'short',day:'2-digit',month:'short'});if(att)att.textContent=results[4].count??0;if(ann)ann.textContent=results[5].count??0}catch(e){console.info('Dashboard stats unavailable',e)}}
 async function activity(){const box=document.querySelector('#activity-list');box.innerHTML='<div class="loading-inline">Loading activity…</div>';try{const queries=await Promise.all([supabase.from('students').select('id,first_name,last_name,student_id,created_at').order('created_at',{ascending:false}).limit(4),supabase.from('teachers').select('id,full_name,staff_id,created_at').order('created_at',{ascending:false}).limit(3),supabase.from('announcements').select('id,title,created_at').order('created_at',{ascending:false}).limit(3)]);const items=[];const s=queries[0].data||[],t=queries[1].data||[],a=queries[2].data||[];s.forEach(x=>items.push({date:x.created_at,icon:'♙',title:'New student registered',text:`${x.student_id||''} — ${x.first_name||''} ${x.last_name||''}`.trim()}));t.forEach(x=>items.push({date:x.created_at,icon:'♟',title:'Teacher record added',text:`${x.staff_id||''} — ${x.full_name||''}`.trim()}));a.forEach(x=>items.push({date:x.created_at,icon:'◉',title:'Announcement created',text:x.title||''}));items.sort((a,b)=>new Date(b.date)-new Date(a.date));box.innerHTML=items.length?items.slice(0,7).map(x=>`<div class="dashboard-activity-item"><span class="dashboard-activity-icon">${x.icon}</span><div><b>${escapeHtml(x.title)}</b><p>${escapeHtml(x.text)}</p></div><time>${new Date(x.date).toLocaleDateString()}</time></div>`).join(''):'<div class="empty">No recent activity yet.</div>'}catch(e){console.error(e);box.innerHTML='<div class="empty">Recent activity could not be loaded.</div>';toast('Some dashboard data could not be loaded.','error')}}
 document.querySelector('#refresh-dashboard').onclick=async()=>{await stats();await activity();toast('Dashboard refreshed.')};await Promise.all([stats(),activity()]);
}
</script></body></html>
