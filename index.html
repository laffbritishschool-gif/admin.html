<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"></head><body data-title="Dashboard"><div id="page-loader" class="loader active"><div class="loader-box"><span class="spinner"></span><div>Loading dashboard…</div></div></div><div id="app-shell" data-content=""></div><div id="toast-host"></div><script type="module">
import{requireAdmin,mountShell,supabase,pageLoading,toast,escapeHtml}from'./assets/app.js';
const user=await requireAdmin();
if(user){
 const shell=document.querySelector('#app-shell');
 shell.dataset.content=`<div class="dashboard-hero live-dashboard-hero"><div class="live-hero-grid"></div><div class="live-hero-orb live-hero-orb-a"></div><div class="live-hero-orb live-hero-orb-b"></div><div class="live-hero-pulse"></div><div class="dashboard-hero-copy"><span class="hero-kicker live-kicker"><i></i> LIVE ADMINISTRATION</span><h2>Welcome back, ${escapeHtml(user.profile?.full_name||'Administrator')} 👋</h2><p>Monitor your school operations, records and daily activity from one live dashboard.</p><div class="live-hero-status"><span class="live-dot"></span> System activity is updating live</div></div><div class="live-hero-visual"><div class="live-visual-card"><div class="live-card-top"><span>Laff British Montessori</span><b>LIVE</b></div><div class="live-wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="live-card-label"><small>School operations</small><strong>Real-time overview</strong></div></div></div><div class="hero-actions live-hero-actions"><a class="btn" href="register-student.html">＋ Register student</a><a class="btn secondary" href="announcements.html">＋ New announcement</a></div></div>
 <div id="dashboard-stats" class="dashboard-stat-strip"><article class="dashboard-stat-card" style="animation-delay:0ms">${icon("students")}<span>Students</span><strong>—</strong><small>Live student records</small></article><article class="dashboard-stat-card" style="animation-delay:60ms">${icon("teachers")}<span>Teachers</span><strong>—</strong><small>Teaching staff</small></article><article class="dashboard-stat-card" style="animation-delay:120ms">${icon("classes")}<span>Classes</span><strong>—</strong><small>Active classes</small></article><article class="dashboard-stat-card" style="animation-delay:180ms">${icon("results")}<span>Results</span><strong>—</strong><small>Recorded result entries</small></article></div>
 <div class="dashboard-main-grid"><section class="panel activity-panel"><div class="panel-head dashboard-panel-head"><div><h2>Recent activity</h2><p>Latest activity across the school system.</p></div><button class="btn secondary" id="refresh-dashboard">Refresh</button></div><div id="activity-list" class="dashboard-activity-list"><div class="loading-inline">Loading activity…</div></div></section><section class="panel"><div class="panel-head dashboard-panel-head"><div><h2>Quick actions</h2><p>Jump straight into common tasks.</p></div></div><div class="dashboard-quick-grid"><a class="dashboard-quick-card" href="students.html"><span class="dashboard-quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><b>Students</b><small>Search and manage records</small></a><a class="dashboard-quick-card" href="teachers.html"><span class="dashboard-quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 8h5M19.5 5.5v5"/></svg></span><b>Teachers</b><small>Review teaching staff</small></a><a class="dashboard-quick-card" href="results.html"><span class="dashboard-quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span><b>Results</b><small>Enter and review results</small></a><a class="dashboard-quick-card" href="attendance.html"><span class="dashboard-quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3v4M18 3v4M3 9h18M5 12h4M5 16h4M15 12h4M15 16h4M7 21h10a4 4 0 0 0 4-4V7a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v10a4 4 0 0 0 4 4z"/></svg></span><b>Attendance</b><small>Monitor daily attendance</small></a><a class="dashboard-quick-card" href="timetable.html"><span class="dashboard-quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"/></svg></span><b>Timetable</b><small>Manage school schedules</small></a><a class="dashboard-quick-card" href="fees.html"><span class="dashboard-quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2v20M17 6.5c0-1.66-2.24-3-5-3S7 4.84 7 6.5 9.24 9.5 12 9.5s5 1.34 5 3-2.24 3-5 3-5-1.34-5-3"/></svg></span><b>Fees & Payments</b><small>Track payment activity</small></a></div><div class="dashboard-health"><div class="dashboard-health-item"><span>Today</span><strong id="dash-today">—</strong></div><div class="dashboard-health-item"><span>Attendance</span><strong id="dash-attendance">—</strong></div><div class="dashboard-health-item"><span>Announcements</span><strong id="dash-announcements">—</strong></div></div></section></div>
 <section class="panel"><div class="panel-head dashboard-panel-head"><div><h2>School operations</h2><p>Access the major areas of administration.</p></div></div><div class="dashboard-ops"><a class="dashboard-op-card" href="classes.html"><span class="dashboard-op-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg></span><b>Classes</b><span>Organise class groups</span></a><a class="dashboard-op-card" href="subjects.html"><span class="dashboard-op-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 4h12a2 2 0 0 1 2 2v14H8a2 2 0 0 0-2 2V4zM6 4a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h14"/></svg></span><b>Subjects</b><span>Manage curriculum</span></a><a class="dashboard-op-card" href="announcements.html"><span class="dashboard-op-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11h4l10-6v14L7 13H3zM7 13l1 6"/></svg></span><b>Announcements</b><span>Share school updates</span></a><a class="dashboard-op-card" href="id-cards.html"><span class="dashboard-op-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h18v12H3zM7 10h4M7 14h8"/></svg></span><b>ID Cards</b><span>Manage student cards</span></a><a class="dashboard-op-card" href="settings.html"><span class="dashboard-op-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5zM19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.42 1.42-.06-.06a1.7 1.7 0 0 0-1.88-.34l-.1.04a1.7 1.7 0 0 0-1.04 1.56V20h-2v-.44a1.7 1.7 0 0 0-1.04-1.56l-.1-.04a1.7 1.7 0 0 0-1.88.34l-.06.06-1.42-1.42.06-.06A1.7 1.7 0 0 0 9.2 15l-.04-.1A1.7 1.7 0 0 0 7.6 13.86H7.16v-2h.44a1.7 1.7 0 0 0 1.56-1.04l.04-.1a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.42-1.42.06.06a1.7 1.7 0 0 0 1.88.34l.1-.04A1.7 1.7 0 0 0 13.3 6.16V5.7h2v.46a1.7 1.7 0 0 0 1.04 1.56l.1.04a1.7 1.7 0 0 0 1.88-.34l.06-.06 1.42 1.42-.06.06A1.7 1.7 0 0 0 19.4 10l.04.1A1.7 1.7 0 0 0 21 11.14h.44v2H21a1.7 1.7 0 0 0-1.56 1.04z"/></svg></span><b>Settings</b><span>School configuration</span></a><a class="dashboard-op-card" href="register-teacher.html"><span class="dashboard-op-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 8h5M19.5 5.5v5"/></svg></span><b>Register Teacher</b><span>Add teaching staff</span></a></div></section>`;
 mountShell(user);pageLoading(false);
 async function stats(){try{const results=await Promise.all([supabase.from('students').select('id',{count:'exact',head:true}),supabase.from('teachers').select('id',{count:'exact',head:true}),supabase.from('classes').select('id',{count:'exact',head:true}),supabase.from('results').select('id',{count:'exact',head:true}),supabase.from('attendance').select('id',{count:'exact',head:true}).eq('attendance_date',new Date().toISOString().slice(0,10)),supabase.from('announcements').select('id',{count:'exact',head:true})]);const vals=[...results.slice(0,4).map(x=>x.count??0)];document.querySelectorAll('#dashboard-stats .dashboard-stat-card strong').forEach((x,i)=>x.textContent=vals[i]??0);const today=document.querySelector('#dash-today');const att=document.querySelector('#dash-attendance');const ann=document.querySelector('#dash-announcements');if(today)today.textContent=new Date().toLocaleDateString('en-NG',{weekday:'short',day:'2-digit',month:'short'});if(att)att.textContent=results[4].count??0;if(ann)ann.textContent=results[5].count??0}catch(e){console.info('Dashboard stats unavailable',e)}}
 async function activity(){const box=document.querySelector('#activity-list');box.innerHTML='<div class="loading-inline">Loading activity…</div>';try{const queries=await Promise.all([supabase.from('students').select('id,first_name,last_name,student_id,created_at').order('created_at',{ascending:false}).limit(4),supabase.from('teachers').select('id,full_name,staff_id,created_at').order('created_at',{ascending:false}).limit(3),supabase.from('announcements').select('id,title,created_at').order('created_at',{ascending:false}).limit(3)]);const items=[];const s=queries[0].data||[],t=queries[1].data||[],a=queries[2].data||[];s.forEach(x=>items.push({date:x.created_at,icon:'students',title:'New student registered',text:`${x.student_id||''} — ${x.first_name||''} ${x.last_name||''}`.trim()}));t.forEach(x=>items.push({date:x.created_at,icon:'teachers',title:'Teacher record added',text:`${x.staff_id||''} — ${x.full_name||''}`.trim()}));a.forEach(x=>items.push({date:x.created_at,icon:'announcements',title:'Announcement created',text:x.title||''}));items.sort((a,b)=>new Date(b.date)-new Date(a.date));box.innerHTML=items.length?items.slice(0,7).map(x=>`<div class="dashboard-activity-item"><span class="dashboard-activity-icon">${x.icon}</span><div><b>${escapeHtml(x.title)}</b><p>${escapeHtml(x.text)}</p></div><time>${new Date(x.date).toLocaleDateString()}</time></div>`).join(''):'<div class="empty">No recent activity yet.</div>'}catch(e){console.error(e);box.innerHTML='<div class="empty">Recent activity could not be loaded.</div>';toast('Some dashboard data could not be loaded.','error')}}
 document.querySelector('#refresh-dashboard').onclick=async()=>{await stats();await activity();toast('Dashboard refreshed.')};await Promise.all([stats(),activity()]);
}
</script></body></html>
