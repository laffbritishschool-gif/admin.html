<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"></head><body class="login-page"><div class="login-wrap"><div class="login-card"><img class="login-logo" src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><p class="eyebrow">LAFF BRITISH MONTESSORI SCHOOL</p><h1>Admin Portal</h1><p class="muted">Sign in to securely manage the school system.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required placeholder="admin@school.com"></label><label>Password<div class="password"><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button type="button" id="toggle">Show</button></div></label><button class="btn full" id="submit" type="submit">Sign in</button><p id="formError" class="form-error"></p></form></div></div><div id="toast-host"></div><script type="module">import {supabase,setLoading,toast} from './assets/app.js';const f=document.querySelector('#loginForm');document.querySelector('#toggle').onclick=()=>{const p=document.querySelector('#password');p.type=p.type==='password'?'text':'password';document.querySelector('#toggle').textContent=p.type==='password'?'Show':'Hide'};f.onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#submit'),err=document.querySelector('#formError');err.textContent='';setLoading(b,true,'Signing in…');try{const {error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;toast('Login successful. Welcome back!');setTimeout(()=>location.replace('index.html'),450)}catch(x){err.textContent=x.message?.toLowerCase().includes('invalid')?'Incorrect email or password. Please check your details.':'We could not sign you in right now. Please try again.';toast(err.textContent,'error')}finally{setLoading(b,false)}};</script><style>.login-page{min-height:100vh;background:radial-gradient(circle at 20% 20%,#eaf1ff,transparent 35%),#f6f8fc;display:grid;place-items:center}.login-wrap{width:min(440px,92%)}.login-card{background:#fff;border:1px solid #e6eaf0;border-radius:22px;padding:36px;box-shadow:0 25px 70px rgba(18,61,143,.12);animation:rise .5s ease}.login-logo{width:78px;height:78px;border-radius:50%;display:block;margin:0 auto 18px}.login-card .eyebrow{text-align:center}.login-card h1{text-align:center;margin:6px 0;font-size:27px}.muted{color:#667085;font-size:13px;text-align:center;margin-bottom:28px}label{display:block;font-size:12px;font-weight:700;margin:16px 0}input{width:100%;margin-top:7px;padding:13px;border:1px solid #dfe4ec;border-radius:10px;font:inherit;outline:none}input:focus{border-color:#0a66c2;box-shadow:0 0 0 3px #0a66c21a}.password{position:relative}.password input{padding-right:65px}.password button{position:absolute;right:8px;top:14px;border:0;background:transparent;color:#0a66c2;font-weight:700;cursor:pointer}.full{width:100%;margin-top:10px}.form-error{color:#c62828;font-size:12px;min-height:17px}</style></body></html>
