<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Announcement | Laff British Montessori School</title>
<link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png"><link rel="stylesheet" href="assets/styles.css">
<style>
.compose{max-width:1080px;margin:auto;padding-bottom:40px}.compose-hero{padding:30px 32px;border-radius:24px;background:linear-gradient(135deg,#123d8f,#0a66c2);color:#fff;box-shadow:0 18px 48px rgba(18,61,143,.18);display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.compose-hero h1{margin:5px 0 8px;font-size:30px}.compose-hero p{margin:0;color:rgba(255,255,255,.8);font-size:12px}.compose-kicker{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#ffd84a}.compose-actions{display:flex;gap:8px}.compose-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.8fr);gap:18px;margin-top:18px}.compose-card{background:#fff;border:1px solid #e6eaf0;border-radius:20px;box-shadow:0 12px 35px rgba(19,43,88,.07);padding:24px}.section-title{margin:0 0 16px;font-size:16px;color:#14213d}.field{margin-bottom:16px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:11px;font-weight:800;color:#344054;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;border:1px solid #dbe2eb;border-radius:12px;padding:12px 13px;background:#fff;color:#172033;font:inherit;outline:0}.field textarea{min-height:230px;resize:vertical;line-height:1.65}.field input:focus,.field select:focus,.field textarea:focus{border-color:#0a66c2;box-shadow:0 0 0 4px rgba(10,102,194,.08)}.composer-bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #edf0f4;padding-top:18px;margin-top:18px}.publish-box{padding:15px;border:1px solid #d9e6fa;background:#f6f9ff;border-radius:14px}.publish-row{display:flex;gap:11px;align-items:flex-start}.publish-row input{margin-top:3px}.publish-row strong{display:block;font-size:11px;color:#14213d}.publish-row span{display:block;color:#667085;font-size:10px;line-height:1.5;margin-top:3px}.tip{padding:15px;border-radius:14px;background:#fff8df;border:1px solid #f0dda0;color:#6b5b16;font-size:10px;line-height:1.6}.preview{min-height:270px;border:1px solid #e9edf3;border-radius:15px;padding:16px;background:#fbfcff}.preview-badge{font-size:8px;font-weight:800;color:#0a66c2;letter-spacing:.8px}.preview h3{margin:8px 0;font-size:18px;color:#14213d;word-break:break-word}.preview p{margin:0;color:#667085;font-size:11px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.preview-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.preview-meta span{font-size:8px;padding:6px 8px;border-radius:999px;background:#eef4ff;color:#31517f;font-weight:800}.save-note{font-size:10px;color:#667085}.required{color:#d92d20}@media(max-width:820px){.compose-hero{align-items:flex-start;flex-direction:column}.compose-actions{width:100%}.compose-actions .btn{flex:1}.compose-layout{grid-template-columns:1fr}.preview{min-height:0}.composer-bottom{align-items:stretch;flex-direction:column}.composer-bottom .btn{width:100%}}@media(max-width:520px){.compose{padding-bottom:20px}.compose-hero,.compose-card{border-radius:18px}.compose-hero{padding:23px}.compose-hero h1{font-size:25px}.compose-card{padding:18px}}
</style></head>
<body data-title="New Announcement"><div id="page-loader" class="loader active"><div class="loader-box"><span class="spinner"></span><div>Loading announcement form…</div></div></div><div id="app-shell" data-content=""></div><div id="toast-host"></div>
<script type="module">
import{requireAdmin,mountShell,pageLoading,supabase,toast,setLoading,escapeHtml}from'./assets/app.js';
const user=await requireAdmin();
if(user){
 mountShell(user);
 const host=document.querySelector('.page-content');
 const announcementId=new URLSearchParams(location.search).get('id');
 let editingAnnouncement=null;
 if(announcementId){
  const {data,error}=await supabase.from('announcements').select('id,title,body,audience,class_id,published,published_at').eq('id',announcementId).maybeSingle();
  if(error)throw error;
  if(!data){toast('Announcement not found.','error');location.href='announcements.html';throw new Error('Announcement not found.');}
  editingAnnouncement=data;
}
host.innerHTML=`<div class="compose"><section class="compose-hero"><div><div class="compose-kicker">SCHOOL COMMUNICATION</div><h1>${editingAnnouncement?'Edit Announcement':'Create New Announcement'}</h1><p>${editingAnnouncement?'Update the announcement and save your changes.':'Write a clear notice and choose who should receive it.'}</p></div><div class="compose-actions"><a class="btn secondary" href="announcements.html">← Back</a></div></section>
 <div class="compose-layout"><section class="compose-card"><h2 class="section-title">Announcement details</h2><form id="announcement-form">
 <div class="field"><label>Announcement Title <span class="required">*</span></label><input name="title" id="title" maxlength="160" required value="${editingAnnouncement?escapeHtml(editingAnnouncement.title):''}" placeholder="e.g. Parents' Meeting — Important Notice"></div>
 <div class="field"><label>Audience</label><select name="audience" id="audience"><option value="ALL">Everyone</option><option value="STUDENTS">Students</option><option value="TEACHERS">Teachers</option><option value="CLASS">A Specific Class</option></select></div>
 <div class="field" id="classField" style="display:none"><label>Class</label><select name="class_id" id="classId"><option value="">Select class</option></select></div>
 <div class="field"><label>Message <span class="required">*</span></label><textarea name="body" id="body" maxlength="10000" required placeholder="Write the full announcement here…">${editingAnnouncement?escapeHtml(editingAnnouncement.body):''}</textarea></div>
 <div class="publish-box"><div class="publish-row"><input type="checkbox" id="published" name="published" ${editingAnnouncement?.published?'checked':''}><div><strong>Publish immediately</strong><span>Published announcements can be displayed to the selected audience. Leave this off to save it as a draft.</span></div></div></div>
 <div class="composer-bottom"><span class="save-note" id="statusNote">Required fields are marked with *.</span><button class="btn btn-primary" id="saveBtn" type="submit">${editingAnnouncement?'Save Changes':'Create Announcement'}</button></div>
 </form></section>
 <aside class="compose-card"><h2 class="section-title">Live preview</h2><div class="preview"><div class="preview-badge">SCHOOL ANNOUNCEMENT</div><h3 id="previewTitle">Your announcement title</h3><p id="previewBody">Your announcement message will appear here as you type.</p><div class="preview-meta"><span id="previewAudience">EVERYONE</span><span id="previewStatus">DRAFT</span></div></div><div class="tip" style="margin-top:14px"><strong>Tip:</strong> Keep the title short and put dates, times, venues and important instructions clearly in the message.</div></aside></div></div>`;
 const form=document.querySelector('#announcement-form'),title=document.querySelector('#title'),body=document.querySelector('#body'),audience=document.querySelector('#audience'),classField=document.querySelector('#classField'),classId=document.querySelector('#classId'),published=document.querySelector('#published');
 const classes=await supabase.from('classes').select('id,name').order('name'); if(classes.error)console.warn('Classes could not be loaded',classes.error); if(classes.data)classId.innerHTML='<option value="">Select class</option>'+classes.data.map(x=>`<option value="${x.id}" ${editingAnnouncement?.class_id===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join(''); if(editingAnnouncement){audience.value=editingAnnouncement.audience||'ALL';classField.style.display=audience.value==='CLASS'?'block':'none';classId.value=editingAnnouncement.class_id||'';}
 function updatePreview(){document.querySelector('#previewTitle').textContent=title.value.trim()||'Your announcement title';document.querySelector('#previewBody').textContent=body.value.trim()||'Your announcement message will appear here as you type.';document.querySelector('#previewAudience').textContent=audience.options[audience.selectedIndex]?.textContent?.toUpperCase()||'EVERYONE';document.querySelector('#previewStatus').textContent=published.checked?'PUBLISHED':'DRAFT';}
 title.oninput=updatePreview;body.oninput=updatePreview;published.onchange=updatePreview;audience.onchange=()=>{classField.style.display=audience.value==='CLASS'?'block':'none';updatePreview()};
 form.onsubmit=async e=>{e.preventDefault();if(audience.value==='CLASS'&&!classId.value){toast('Please select a class for this announcement.','error');return;}const btn=document.querySelector('#saveBtn');setLoading(btn,true,'Saving…');try{const p={title:title.value.trim(),body:body.value.trim(),audience:audience.value,class_id:audience.value==='CLASS'?classId.value:null,published:published.checked,published_at:published.checked?new Date().toISOString():null,created_by:user.id};const res=editingAnnouncement?await supabase.from('announcements').update(p).eq('id',editingAnnouncement.id):await supabase.from('announcements').insert(p);if(res.error)throw res.error;toast(editingAnnouncement?(published.checked?'Announcement updated and published.':'Announcement updated successfully.'): (published.checked?'Announcement published successfully.':'Announcement saved as draft.'));location.href='announcements.html';}catch(err){console.error(err);toast(err.message||'Could not create announcement.','error');document.querySelector('#statusNote').textContent='The announcement could not be saved.';}finally{setLoading(btn,false)}};
 updatePreview();pageLoading(false);
}
</script></body></html>
