<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subject | Laff British Montessori School</title><link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png"><link rel="stylesheet" href="assets/styles.css"><style>
.subject-form-page{max-width:1050px;margin:auto;padding-bottom:40px}.subject-form-hero{padding:30px 32px;border-radius:24px;background:linear-gradient(135deg,#123d8f,#0a66c2);color:#fff;box-shadow:0 18px 48px rgba(18,61,143,.18);display:flex;justify-content:space-between;gap:18px;align-items:flex-end}.subject-form-hero h1{margin:5px 0 7px;font-size:29px}.subject-form-hero p{margin:0;color:rgba(255,255,255,.82);font-size:12px}.sf-kicker{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#ffda4b}.sf-actions{display:flex;gap:8px}.sf-card{margin-top:18px;background:#fff;border:1px solid #e6eaf0;border-radius:20px;box-shadow:0 12px 35px rgba(19,43,88,.07);padding:25px}.sf-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.sf-field label{display:block;font-size:11px;font-weight:800;color:#344054;margin-bottom:7px}.sf-field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dbe2eb;border-radius:12px;font:inherit;outline:0}.sf-field input:focus{border-color:#0a66c2;box-shadow:0 0 0 4px rgba(10,102,194,.08)}.sf-help{margin-top:6px;font-size:9px;color:#8490a0}.sf-status{padding:15px;border:1px solid #e5eaf3;border-radius:14px;background:#f8faff}.sf-status-row{display:flex;align-items:flex-start;gap:11px}.sf-status-row input{margin-top:3px}.sf-status-row strong{display:block;font-size:11px}.sf-status-row span{display:block;margin-top:3px;font-size:9px;color:#667085;line-height:1.5}.sf-summary{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sf-summary div{padding:14px;border:1px solid #edf0f4;border-radius:13px;background:#fbfcff}.sf-summary small,.sf-summary strong{display:block}.sf-summary small{font-size:9px;color:#98a2b3;text-transform:uppercase}.sf-summary strong{margin-top:4px;font-size:13px;color:#14213d}.sf-bottom{margin-top:22px;padding-top:18px;border-top:1px solid #edf0f4;display:flex;justify-content:space-between;align-items:center;gap:12px}.sf-note{font-size:10px;color:#667085}@media(max-width:760px){.subject-form-hero{align-items:flex-start;flex-direction:column;padding:23px}.sf-actions{width:100%}.sf-actions .btn{flex:1}.sf-grid,.sf-summary{grid-template-columns:1fr}.sf-card{padding:18px}.sf-bottom{align-items:stretch;flex-direction:column}.sf-bottom .btn{width:100%}}</style></head><body data-title="Subject"><div id="page-loader" class="loader active"><div class="loader-box"><span class="spinner"></span><div>Loading subject form…</div></div></div><div id="app-shell" data-content=""></div><div id="toast-host"></div><script type="module">
import{requireAdmin,mountShell,supabase,toast,setLoading,pageLoading,escapeHtml}from'./assets/app.js';
const user=await requireAdmin();
if(user){
 mountShell(user);
 const id=new URLSearchParams(location.search).get('id');
 let row=null;
 if(id){const{data,error}=await supabase.from('subjects').select('id,name,code,max_ca,max_exam,is_active').eq('id',id).maybeSingle();if(error)throw error;if(!data){toast('Subject not found.','error');location.href='subjects.html';}row=data;}
 const host=document.querySelector('.page-content');
 host.innerHTML=`<div class="subject-form-page"><section class="subject-form-hero"><div><div class="sf-kicker">ACADEMIC MANAGEMENT</div><h1>${row?'Edit Subject':'Add New Subject'}</h1><p>${row?'Update this subject and keep its assessment settings accurate.':'Create a subject and configure its assessment limits.'}</p></div><div class="sf-actions"><a class="btn secondary" href="subjects.html">← Back</a></div></section><section class="sf-card"><form id="subjectForm"><div class="sf-grid"><div class="sf-field"><label>Subject Name *</label><input name="name" required maxlength="120" value="${row?escapeHtml(row.name):''}" placeholder="e.g. Mathematics"></div><div class="sf-field"><label>Subject Code</label><input name="code" maxlength="30" value="${row?escapeHtml(row.code||''):''}" placeholder="e.g. MATH"><div class="sf-help">Optional short code used in results and timetables.</div></div><div class="sf-field"><label>Maximum CA</label><input name="max_ca" type="number" min="0" max="1000" value="${row?Number(row.max_ca||0):30}"><div class="sf-help">Maximum continuous assessment mark.</div></div><div class="sf-field"><label>Maximum Exam</label><input name="max_exam" type="number" min="0" max="1000" value="${row?Number(row.max_exam||0):70}"><div class="sf-help">Maximum examination mark.</div></div></div><div class="sf-status" style="margin-top:18px"><div class="sf-status-row"><input id="active" name="is_active" type="checkbox" ${row?.is_active!==false?'checked':''}><div><strong>Active subject</strong><span>Active subjects remain available for classes, timetables and assessment.</span></div></div></div><div class="sf-summary"><div><small>Assessment Total</small><strong id="total">100 marks</strong></div><div><small>Subject Status</small><strong id="statusText">${row?.is_active===false?'Inactive':'Active'}</strong></div><div><small>Mode</small><strong>${row?'Editing existing subject':'Creating new subject'}</strong></div></div><div class="sf-bottom"><span class="sf-note" id="note">Fields marked * are required.</span><div class="sf-actions"><button type="button" class="btn btn-ghost" onclick="location.href='subjects.html'">Cancel</button><button class="btn btn-primary" id="save" type="submit">${row?'Save Changes':'Create Subject'}</button></div></div></form></section></div>`;
 const form=document.querySelector('#subjectForm'),active=document.querySelector('#active'),total=document.querySelector('#total'),statusText=document.querySelector('#statusText');
 function preview(){total.textContent=`${Number(form.elements.max_ca.value||0)+Number(form.elements.max_exam.value||0)} marks`;statusText.textContent=active.checked?'Active':'Inactive';}
 form.elements.max_ca.oninput=preview;form.elements.max_exam.oninput=preview;active.onchange=preview;preview();
 form.onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#save');setLoading(btn,true,'Saving…');try{const payload={name:String(form.elements.name.value||'').trim(),code:String(form.elements.code.value||'').trim()||null,max_ca:Number(form.elements.max_ca.value||0),max_exam:Number(form.elements.max_exam.value||0),is_active:active.checked};if(!payload.name)throw new Error('Subject name is required.');const res=row?await supabase.from('subjects').update(payload).eq('id',row.id):await supabase.from('subjects').insert(payload);if(res.error)throw res.error;toast(row?'Subject updated successfully.':'Subject created successfully.');location.href='subjects.html';}catch(err){console.error(err);toast(err.message||'Could not save subject.','error');document.querySelector('#note').textContent='The subject could not be saved.';}finally{setLoading(btn,false);}};
 pageLoading(false);
}
</script></body></html>
