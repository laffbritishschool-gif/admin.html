<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Principal Profile | Laff British Montessori School</title>
<link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png">
<link rel="stylesheet" href="assets/styles.css">
<style>
.profile-page{max-width:1000px;margin:0 auto;padding-bottom:42px}.profile-card{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.profile-banner{position:relative;padding:34px;background:linear-gradient(135deg,#0b3b82,#0a66c2);color:#fff}.profile-banner:after{content:"";position:absolute;width:250px;height:250px;right:-95px;top:-150px;border:38px solid rgba(244,196,0,.13);border-radius:50%}.profile-banner-inner{position:relative;z-index:1;display:flex;align-items:center;gap:18px}.profile-avatar-wrap{position:relative;width:94px;height:94px;flex:0 0 auto}.profile-large-avatar{width:94px;height:94px;border-radius:28px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.23);overflow:hidden;font-size:28px;font-weight:900}.profile-large-avatar img{width:100%;height:100%;object-fit:cover;display:block}.profile-banner h1{margin:2px 0 6px;font-size:29px}.profile-banner p{margin:0;color:rgba(255,255,255,.76);font-size:10px}.profile-badge{display:inline-flex;margin-bottom:7px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);font-size:8px;font-weight:900;letter-spacing:.8px}.profile-info{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:22px}.profile-info-item{padding:15px;border:1px solid #edf0f4;border-radius:14px;background:#fbfcff}.profile-info-item small,.profile-info-item strong{display:block}.profile-info-item small{font-size:8px;color:#98a2b3;text-transform:uppercase;letter-spacing:.4px}.profile-info-item strong{margin-top:6px;font-size:12px;color:#14213d;word-break:break-word}.profile-actions{display:flex;gap:9px;padding:0 22px 22px}.profile-actions .btn{min-width:125px}.profile-status{display:inline-flex;align-items:center;gap:6px}.profile-status:before{content:"";width:7px;height:7px;border-radius:50%;background:#20a35a}.profile-error{padding:30px;text-align:center}.profile-error h3{margin:0 0 6px}.profile-error p{margin:0 0 15px;color:var(--muted);font-size:10px}@media(max-width:650px){.profile-banner-inner{align-items:flex-start;flex-direction:column}.profile-info{grid-template-columns:1fr}.profile-actions{padding:0 18px 18px;flex-direction:column}.profile-actions .btn{width:100%}}
</style>
</head>
<body data-title="Principal Profile">
<div id="page-loader" class="loader active"><div class="loader-box"><span class="spinner"></span><div>Loading profile…</div></div></div>
<div id="app-shell" data-content=""></div><div id="toast-host"></div>
<script type="module">
import{requireAdmin,mountShell,pageLoading,escapeHtml,signOut,supabase,getCachedSchoolSettings,profileAvatarUrl}from'./assets/app.js';

const user=await requireAdmin();
if(user){
  mountShell(user);
  const root=document.querySelector('.page-content');
  try{
    const [{data:profile,error:profileError},{data:staff,error:staffError}]=await Promise.all([
      supabase.from('profiles').select('id,full_name,role,is_active,must_change_password,avatar_url').eq('id',user.id).maybeSingle(),
      supabase.from('admin_staff').select('user_id,full_name,role,is_active,must_change_password,email,staff_id').eq('user_id',user.id).maybeSingle()
    ]);

    if(profileError && !profile) throw profileError;
    if(staffError && !staff) console.warn('Admin staff profile lookup unavailable:',staffError);

    const source=profile||staff;
    const school=getCachedSchoolSettings();
    const fullName=source?.full_name||user?.user_metadata?.full_name||'Principal';
    const rawRole=String(source?.role||user?.profile?.role||'SUPER_ADMIN').toUpperCase();
    const displayRole=rawRole==='SUPER_ADMIN'?'Principal':(rawRole==='ADMIN'?'Administrator':rawRole);
    const email=user?.email||staff?.email||'';
    const avatar=source?.avatar_url||profileAvatarUrl(source,school);
    const initial=(email||fullName||'P')[0].toUpperCase();

    root.innerHTML=`<section class="profile-page">
      <div class="page-head"><div><h2>Principal Profile</h2><p>View the profile linked to the administrator account currently signed in.</p></div></div>
      <section class="profile-card">
        <div class="profile-banner">
          <div class="profile-banner-inner">
            <div class="profile-avatar-wrap">
              <div class="profile-large-avatar">
                <img src="${escapeHtml(avatar)}" alt="${escapeHtml(fullName)}" onerror="this.onerror=null;this.src='${escapeHtml(school.logo_url)}'">
              </div>
            </div>
            <div>
              <span class="profile-badge">SCHOOL ADMINISTRATION</span>
              <h1>${escapeHtml(fullName)}</h1>
              <p>${escapeHtml(displayRole)} · Laff British Montessori School</p>
            </div>
          </div>
        </div>

        <div class="profile-info">
          <div class="profile-info-item"><small>Full Name</small><strong>${escapeHtml(fullName)}</strong></div>
          <div class="profile-info-item"><small>Email</small><strong>${escapeHtml(email||'Not available')}</strong></div>
          <div class="profile-info-item"><small>Role</small><strong>${escapeHtml(displayRole)}</strong></div>
          <div class="profile-info-item"><small>Account Status</small><strong class="profile-status">${source?.is_active===false?'Inactive':'Active'}</strong></div>
          <div class="profile-info-item"><small>Staff ID</small><strong>${escapeHtml(staff?.staff_id||'Not assigned')}</strong></div>
          <div class="profile-info-item"><small>Profile Photo</small><strong>${source?.avatar_url?'Profile image loaded':'School logo fallback'}</strong></div>
        </div>

        <div class="profile-actions">
          <a class="btn btn-ghost" href="settings.html">School Settings</a>
          <button class="btn btn-danger" id="profile-page-logout" type="button">Logout</button>
        </div>
      </section>
    </section>`;

    document.querySelector('#profile-page-logout')?.addEventListener('click',signOut);
  }catch(err){
    console.error('Profile load failed:',err);
    const school=getCachedSchoolSettings();
    root.innerHTML=`<section class="profile-page"><div class="profile-error"><h3>Profile could not be loaded</h3><p>The signed-in account is still protected, but its profile could not be read right now.</p><button class="btn btn-primary" id="profile-retry">Refresh Profile</button></div></section>`;
    root.querySelector('#profile-retry')?.addEventListener('click',()=>location.reload());
  }
  pageLoading(false);
}
</script>
</body>
</html>
