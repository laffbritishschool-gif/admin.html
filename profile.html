<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Principal Profile | Laff British Montessori School</title>
<link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png">
<link rel="stylesheet" href="assets/styles.css">
<style>
.profile-page{max-width:1000px;margin:0 auto;padding-bottom:42px}.profile-card{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.profile-banner{position:relative;padding:34px;background:linear-gradient(135deg,#0b3b82,#0a66c2);color:#fff}.profile-banner:after{content:"";position:absolute;width:250px;height:250px;right:-95px;top:-150px;border:38px solid rgba(244,196,0,.13);border-radius:50%}.profile-banner-inner{position:relative;z-index:1;display:flex;align-items:center;gap:18px}.profile-avatar-wrap{position:relative;width:94px;height:94px;flex:0 0 auto}.profile-large-avatar{width:94px;height:94px;border-radius:28px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.23);overflow:hidden;font-size:28px;font-weight:900}.profile-large-avatar img{width:100%;height:100%;object-fit:cover;display:block}.profile-banner h1{margin:2px 0 6px;font-size:29px}.profile-banner p{margin:0;color:rgba(255,255,255,.76);font-size:10px}.profile-badge{display:inline-flex;margin-bottom:7px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);font-size:8px;font-weight:900;letter-spacing:.8px}.profile-info{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:22px}.profile-info-item{padding:15px;border:1px solid #edf0f4;border-radius:14px;background:#fbfcff}.profile-info-item small,.profile-info-item strong{display:block}.profile-info-item small{font-size:8px;color:#98a2b3;text-transform:uppercase;letter-spacing:.4px}.profile-info-item strong{margin-top:6px;font-size:12px;color:#14213d;word-break:break-word}.profile-actions{display:flex;gap:9px;padding:0 22px 22px}.profile-actions .btn{min-width:125px}.profile-status{display:inline-flex;align-items:center;gap:6px}.profile-status:before{content:"";width:7px;height:7px;border-radius:50%;background:#20a35a}.profile-error{padding:30px;text-align:center}.profile-error h3{margin:0 0 6px}.profile-error p{margin:0 0 15px;color:var(--muted);font-size:10px}.profile-avatar-wrap{cursor:pointer}.profile-avatar-edit{position:absolute;right:-4px;bottom:-4px;width:31px;height:31px;border:3px solid #fff;border-radius:10px;background:#f4c400;color:#17385f;display:grid;place-items:center;font-size:13px;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,.18);cursor:pointer}.avatar-crop-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:18px;background:rgba(7,25,52,.62);backdrop-filter:blur(7px)}.avatar-crop-card{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;border:1px solid #dfe6f0;border-radius:22px;box-shadow:0 32px 100px rgba(7,28,58,.3);padding:22px}.avatar-crop-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.avatar-crop-head h2{margin:3px 0 5px;color:#123d8f}.avatar-crop-head p{margin:0;color:#667085;font-size:10px;line-height:1.6}.avatar-crop-close{width:36px;height:36px;border:0;border-radius:10px;background:#f2f5f9;color:#344054;font-size:21px;cursor:pointer}.avatar-crop-layout{display:grid;grid-template-columns:minmax(280px,1fr) 235px;gap:18px;margin-top:18px}.avatar-crop-stage-wrap{display:grid;place-items:center;padding:16px;background:#f7f9fc;border:1px solid #e2e8f0;border-radius:17px}.avatar-crop-stage{position:relative;width:min(100%,420px);aspect-ratio:1;overflow:hidden;border-radius:16px;background:repeating-conic-gradient(#eef2f7 0 25%,#f8fafc 0 50%) 0/24px 24px;touch-action:none;cursor:grab}.avatar-crop-stage.dragging{cursor:grabbing}.avatar-crop-stage img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}.avatar-crop-mask{position:absolute;inset:22px;border:2px solid rgba(255,255,255,.98);box-shadow:0 0 0 999px rgba(5,25,52,.38),0 0 0 5px rgba(11,94,215,.16);pointer-events:none}.avatar-crop-mask.circle{border-radius:50%}.avatar-crop-controls{display:grid;gap:13px;align-content:start}.avatar-control-section{padding:12px;border:1px solid #e5eaf1;border-radius:14px;background:#fbfcff}.avatar-control-label{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;font-size:9px;font-weight:900;color:#344054}.avatar-control-label span{font-size:8px;color:#7c8a9e;font-weight:700}.avatar-shape-group{display:grid;grid-template-columns:1fr 1fr;gap:8px}.avatar-shape-btn{border:1px solid #dce4ee;background:#fff;border-radius:11px;padding:10px;cursor:pointer;font-size:10px;font-weight:900;color:#475467}.avatar-shape-btn.active{border-color:#0b5ed7;background:#edf4ff;color:#0b5ed7;box-shadow:0 0 0 3px rgba(11,94,215,.08)}.avatar-shape-preview{width:34px;height:34px;margin:0 auto 5px;background:#dbeafe;border-radius:10px}.avatar-shape-btn[data-shape="circle"] .avatar-shape-preview{border-radius:50%}.avatar-zoom{width:100%;accent-color:#0b5ed7}.avatar-crop-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:3px}.avatar-crop-actions .btn{flex:1;min-width:100px}.avatar-upload-note{font-size:8px;color:#8390a2;line-height:1.5}.avatar-crop-status{min-height:17px;font-size:9px;color:#667085}.avatar-crop-status.error{color:#b42318}.avatar-crop-status.success{color:#176c40;font-weight:800}.profile-large-avatar.square{border-radius:10px}.profile-large-avatar.circle{border-radius:50%}.profile-large-avatar.square img{border-radius:8px}.profile-large-avatar.circle img{border-radius:50%}@media(max-width:700px){.avatar-crop-layout{grid-template-columns:1fr}.avatar-crop-card{padding:17px}.avatar-crop-stage{width:min(100%,360px)}}
@media(max-width:650px){.profile-banner-inner{align-items:flex-start;flex-direction:column}.profile-info{grid-template-columns:1fr}.profile-actions{padding:0 18px 18px;flex-direction:column}.profile-actions .btn{width:100%}}
</style>
</head>
<body data-title="Principal Profile">
<div id="page-loader" class="loader active"><div class="loader-box"><span class="spinner"></span><div>Loading profile…</div></div></div>
<div id="app-shell" data-content=""></div><div id="toast-host"></div>
<script type="module">
import{requireAdmin,mountShell,pageLoading,escapeHtml,signOut,supabase,getCachedSchoolSettings,profileAvatarUrl}from'./assets/app.js';

const user=await requireAdmin();
if(user){
  mountShell(user);
  const root=document.querySelector('.page-content');
  try{
    const [{data:profile,error:profileError},{data:staff,error:staffError}]=await Promise.all([
      supabase.from('profiles').select('id,full_name,role,is_active,must_change_password,avatar_url').eq('id',user.id).maybeSingle(),
      supabase.from('admin_staff').select('user_id,full_name,role,is_active,must_change_password,email,staff_id').eq('user_id',user.id).maybeSingle()
    ]);

    if(profileError && !profile) throw profileError;
    if(staffError && !staff) console.warn('Admin staff profile lookup unavailable:',staffError);

    const source=profile||staff;
    const school=getCachedSchoolSettings();
    const fullName=source?.full_name||user?.user_metadata?.full_name||'Principal';
    const rawRole=String(source?.role||user?.profile?.role||'SUPER_ADMIN').toUpperCase();
    const displayRole=rawRole==='SUPER_ADMIN'?'Principal':(rawRole==='ADMIN'?'Administrator':rawRole);
    const email=user?.email||staff?.email||'';
    const avatar=source?.avatar_url||profileAvatarUrl(source,school);
    const initial=(email||fullName||'P')[0].toUpperCase();

    root.innerHTML=`<section class="profile-page">
      <div class="page-head"><div><h2>Principal Profile</h2><p>View the profile linked to the administrator account currently signed in.</p></div></div>
      <section class="profile-card">
        <div class="profile-banner">
          <div class="profile-banner-inner">
            <div class="profile-avatar-wrap" id="profile-avatar-trigger" title="Change profile image">
              <div class="profile-large-avatar ${source?.avatar_shape==='square'?'square':'circle'}" id="profile-large-avatar">
                <img id="profile-avatar-image" src="${escapeHtml(avatar)}" alt="${escapeHtml(fullName)}" onerror="this.onerror=null;this.src='${escapeHtml(school.logo_url)}'">
              </div>
              <button class="profile-avatar-edit" id="profile-avatar-edit" type="button" aria-label="Change profile image">✎</button>
            </div>
            <div>
              <span class="profile-badge">SCHOOL ADMINISTRATION</span>
              <h1>${escapeHtml(fullName)}</h1>
              <p>${escapeHtml(displayRole)} · Laff British Montessori School</p>
            </div>
          </div>
        </div>

        <div class="profile-info">
          <div class="profile-info-item"><small>Full Name</small><strong>${escapeHtml(fullName)}</strong></div>
          <div class="profile-info-item"><small>Email</small><strong>${escapeHtml(email||'Not available')}</strong></div>
          <div class="profile-info-item"><small>Role</small><strong>${escapeHtml(displayRole)}</strong></div>
          <div class="profile-info-item"><small>Account Status</small><strong class="profile-status">${source?.is_active===false?'Inactive':'Active'}</strong></div>
          <div class="profile-info-item"><small>Staff ID</small><strong>${escapeHtml(staff?.staff_id||'Not assigned')}</strong></div>
          <div class="profile-info-item"><small>Profile Photo</small><strong id="profile-photo-status">${source?.avatar_url?'Profile image loaded':'School logo fallback'}</strong></div>
        </div>

        <input type="file" id="profile-avatar-file" accept="image/jpeg,image/png,image/webp" hidden>
<div class="avatar-crop-modal" id="avatar-crop-modal" hidden>
  <div class="avatar-crop-card" role="dialog" aria-modal="true" aria-labelledby="avatar-crop-title">
    <div class="avatar-crop-head"><div><span class="profile-badge" style="background:#edf4ff;color:#123d8f;border-color:#d8e5f7;margin:0 0 5px">PROFILE IMAGE</span><h2 id="avatar-crop-title">Crop your profile image</h2><p>Drag the image, adjust the zoom, and choose a square or circle shape before saving.</p></div><button type="button" class="avatar-crop-close" id="avatar-crop-close" aria-label="Close crop editor">×</button></div>
    <div class="avatar-crop-layout"><div class="avatar-crop-stage-wrap"><div class="avatar-crop-stage" id="avatar-crop-stage"><img id="avatar-crop-image" alt="Crop preview"><div class="avatar-crop-mask" id="avatar-crop-mask"></div></div></div>
      <div class="avatar-crop-controls"><div class="avatar-control-section"><div class="avatar-control-label"><span>Shape</span><span>Select one</span></div><div class="avatar-shape-group"><button type="button" class="avatar-shape-btn active" data-shape="square"><div class="avatar-shape-preview"></div>Square</button><button type="button" class="avatar-shape-btn" data-shape="circle"><div class="avatar-shape-preview"></div>Circle</button></div></div>
        <div class="avatar-control-section"><div class="avatar-control-label"><span>Zoom</span><span id="avatar-zoom-value">1.00×</span></div><input class="avatar-zoom" id="avatar-zoom" type="range" min="1" max="3" value="1" step="0.01"></div>
        <div class="avatar-control-section"><div class="avatar-control-label"><span>Crop tips</span></div><div class="avatar-upload-note">Drag to position the image. Use zoom for a closer crop. Your original image is not changed.</div></div>
        <div class="avatar-crop-status" id="avatar-crop-status"></div><div class="avatar-crop-actions"><button class="btn btn-ghost" type="button" id="avatar-crop-cancel">Cancel</button><button class="btn btn-primary" type="button" id="avatar-crop-save">Use This Image</button></div>
      </div>
    </div>
  </div>
</div>
<div class="profile-actions">
          <a class="btn btn-ghost" href="settings.html">School Settings</a>
          <button class="btn btn-danger" id="profile-page-logout" type="button">Logout</button>
        </div>
      </section>
    </section>`;

    document.querySelector('#profile-page-logout')?.addEventListener('click',signOut);

    const avatarTrigger=document.querySelector('#profile-avatar-trigger');
    const avatarEdit=document.querySelector('#profile-avatar-edit');
    const avatarFile=document.querySelector('#profile-avatar-file');
    const cropModal=document.querySelector('#avatar-crop-modal');
    const cropStage=document.querySelector('#avatar-crop-stage');
    const cropImg=document.querySelector('#avatar-crop-image');
    const cropMask=document.querySelector('#avatar-crop-mask');
    const zoomControl=document.querySelector('#avatar-zoom');
    const zoomValue=document.querySelector('#avatar-zoom-value');
    const cropStatus=document.querySelector('#avatar-crop-status');
    const largeAvatar=document.querySelector('#profile-large-avatar');
    const avatarImage=document.querySelector('#profile-avatar-image');
    const photoStatus=document.querySelector('#profile-photo-status');
    let cropObjectUrl='',cropShape='square',cropZoom=1,cropBaseScale=1,cropX=0,cropY=0,cropDrag=false,lastPointerX=0,lastPointerY=0,naturalW=0,naturalH=0;
    const stageSize=()=>cropStage.clientWidth;
    function updateCropImage(){const size=stageSize();const w=naturalW*cropBaseScale*cropZoom,h=naturalH*cropBaseScale*cropZoom;cropImg.style.width=w+'px';cropImg.style.height=h+'px';cropImg.style.left=((size-w)/2+cropX)+'px';cropImg.style.top=((size-h)/2+cropY)+'px';cropMask.classList.toggle('circle',cropShape==='circle');zoomValue.textContent=cropZoom.toFixed(2)+'×';}
    function resetCrop(){const size=stageSize(),frame=size-44;cropBaseScale=Math.max(frame/naturalW,frame/naturalH);cropZoom=1;cropX=0;cropY=0;zoomControl.value='1';updateCropImage();}
    function openCrop(file){if(!file)return;if(file.size>2*1024*1024){toast('Profile image must be 2 MB or smaller.','error');return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Please choose a JPG, PNG or WebP image.','error');return}const reader=new FileReader();reader.onload=()=>{cropObjectUrl=reader.result;cropImg.onload=()=>{naturalW=cropImg.naturalWidth;naturalH=cropImg.naturalHeight;cropShape='square';document.querySelectorAll('.avatar-shape-btn').forEach(b=>b.classList.toggle('active',b.dataset.shape===cropShape));cropModal.hidden=false;requestAnimationFrame(resetCrop);cropStatus.textContent='Drag the image to position it.';};cropImg.src=cropObjectUrl;};reader.readAsDataURL(file);}
    function pointerDown(e){cropDrag=true;cropStage.classList.add('dragging');lastPointerX=e.clientX;lastPointerY=e.clientY;cropStage.setPointerCapture?.(e.pointerId);}
    function pointerMove(e){if(!cropDrag)return;cropX+=e.clientX-lastPointerX;cropY+=e.clientY-lastPointerY;lastPointerX=e.clientX;lastPointerY=e.clientY;updateCropImage();}
    function pointerUp(){cropDrag=false;cropStage.classList.remove('dragging');}
    function setShape(shape){cropShape=shape;document.querySelectorAll('.avatar-shape-btn').forEach(b=>b.classList.toggle('active',b.dataset.shape===shape));updateCropImage();}
    function blobFromCrop(){return new Promise((resolve,reject)=>{const output=800,canvas=document.createElement('canvas');canvas.width=output;canvas.height=output;const ctx=canvas.getContext('2d');if(!ctx)return reject(new Error('Canvas is not supported in this browser.'));const size=stageSize(),frame=size-44;const displayW=naturalW*cropBaseScale*cropZoom,displayH=naturalH*cropBaseScale*cropZoom;const imageLeft=(size-displayW)/2+cropX,imageTop=(size-displayH)/2+cropY;const sx=(44-imageLeft)*(naturalW/displayW),sy=(44-imageTop)*(naturalH/displayH),sw=frame*(naturalW/displayW),sh=frame*(naturalH/displayH);if(cropShape==='circle'){ctx.beginPath();ctx.arc(output/2,output/2,output/2,0,Math.PI*2);ctx.closePath();ctx.clip();}ctx.drawImage(cropImg,sx,sy,sw,sh,0,0,output,output);canvas.toBlob(b=>b?resolve(b):reject(new Error('Could not prepare the cropped image.')),'image/png',.95);});}
    async function saveCroppedAvatar(){try{cropStatus.className='avatar-crop-status';cropStatus.textContent='Uploading cropped image…';const blob=await blobFromCrop();const path=user.id+'/'+crypto.randomUUID()+'.png';const{error:uploadError}=await supabase.storage.from('profile-avatars').upload(path,blob,{contentType:'image/png',upsert:false});if(uploadError)throw uploadError;const publicUrl=supabase.storage.from('profile-avatars').getPublicUrl(path).data.publicUrl;const{error:updateError}=await supabase.from('profiles').update({avatar_url:publicUrl,avatar_shape:cropShape,updated_at:new Date().toISOString()}).eq('id',user.id);if(updateError)throw updateError;largeAvatar.classList.toggle('square',cropShape==='square');largeAvatar.classList.toggle('circle',cropShape==='circle');avatarImage.src=publicUrl;photoStatus.textContent='Profile image loaded';cropStatus.className='avatar-crop-status success';cropStatus.textContent='Profile image updated successfully.';toast('Profile image updated successfully.');setTimeout(()=>{cropModal.hidden=true;cropImg.removeAttribute('src');},500);}catch(err){console.error('Profile avatar upload failed:',err);cropStatus.className='avatar-crop-status error';cropStatus.textContent=err?.message||'Could not update profile image.';toast(err?.message||'Could not update profile image.','error');}}
    avatarTrigger?.addEventListener('click',()=>avatarFile?.click());avatarEdit?.addEventListener('click',e=>{e.stopPropagation();avatarFile?.click()});avatarFile?.addEventListener('change',()=>{const file=avatarFile.files?.[0];avatarFile.value='';if(file)openCrop(file);});
    document.querySelectorAll('.avatar-shape-btn').forEach(b=>b.addEventListener('click',()=>setShape(b.dataset.shape)));zoomControl?.addEventListener('input',()=>{cropZoom=Number(zoomControl.value)||1;updateCropImage();});cropStage?.addEventListener('pointerdown',pointerDown);cropStage?.addEventListener('pointermove',pointerMove);cropStage?.addEventListener('pointerup',pointerUp);cropStage?.addEventListener('pointercancel',pointerUp);cropStage?.addEventListener('wheel',e=>{e.preventDefault();cropZoom=Math.min(3,Math.max(1,cropZoom+(e.deltaY<0?.05:-.05)));zoomControl.value=cropZoom;updateCropImage();},{passive:false});document.querySelector('#avatar-crop-close')?.addEventListener('click',()=>{cropModal.hidden=true;cropImg.removeAttribute('src');});document.querySelector('#avatar-crop-cancel')?.addEventListener('click',()=>{cropModal.hidden=true;cropImg.removeAttribute('src');});document.querySelector('#avatar-crop-save')?.addEventListener('click',saveCroppedAvatar);cropModal?.addEventListener('click',e=>{if(e.target===cropModal){cropModal.hidden=true;cropImg.removeAttribute('src');}});window.addEventListener('resize',()=>{if(!cropModal.hidden&&naturalW)updateCropImage();});

  }catch(err){
    console.error('Profile load failed:',err);
    const school=getCachedSchoolSettings();
    root.innerHTML=`<section class="profile-page"><div class="profile-error"><h3>Profile could not be loaded</h3><p>The signed-in account is still protected, but its profile could not be read right now.</p><button class="btn btn-primary" id="profile-retry">Refresh Profile</button></div></section>`;
    root.querySelector('#profile-retry')?.addEventListener('click',()=>location.reload());
  }
  pageLoading(false);
}
</script>
</body>
</html>
