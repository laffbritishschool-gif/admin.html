function canvasCropFile(options={includeBackground:true}){return new Promise((resolve,reject)=>{const stageSize=Math.round(cropStage.clientWidth),sx=Math.max(0,Math.round(cropRect.x)),sy=Math.max(0,Math.round(cropRect.y)),sw=Math.max(2,Math.round(cropRect.w)),sh=Math.max(2,Math.round(cropRect.h));const previewCanvas=document.createElement('canvas');previewCanvas.width=stageSize;previewCanvas.height=stageSize;const pctx=previewCanvas.getContext('2d');if(!pctx)return reject(new Error('Your browser does not support image cropping.'));const displayW=naturalW*cropBaseScale*cropZoom,displayH=naturalH*cropBaseScale*cropZoom;pctx.clearRect(0,0,stageSize,stageSize);if(options.includeBackground!==false){if(backgroundImageObj?.complete&&backgroundImageObj.naturalWidth){const bw=backgroundImageObj.naturalWidth,bh=backgroundImageObj.naturalHeight,scale=Math.max(stageSize/bw,stageSize/bh),dw=bw*scale,dh=bh*scale;pctx.drawImage(backgroundImageObj,(stageSize-dw)/2,(stageSize-dh)/2,dw,dh);}else if(backgroundColor!=='transparent'){pctx.fillStyle=backgroundColor;pctx.fillRect(0,0,stageSize,stageSize);}}pctx.save();pctx.filter='brightness('+cropBrightnessValueNum+'%) contrast('+cropContrastValueNum+'%) saturate('+cropSaturationValueNum+'%)';pctx.translate(stageSize/2+cropX,stageSize/2+cropY);pctx.rotate(cropRotation*Math.PI/180);pctx.scale(cropFlipX?-1:1,cropFlipY?-1:1);pctx.drawImage(cropImg,-displayW/2,-displayH/2,displayW,displayH);pctx.restore();const circle=(photoShape==='circle'),shapeSide=Math.min(sw,sh);let outW=640,outH=Math.max(1,Math.round(outW*sh/sw));if(circle){const cx=sx+sw/2,cy=sy+sh/2;outW=640;outH=640;const tmp=document.createElement('canvas');tmp.width=shapeSide;tmp.height=shapeSide;const tctx=tmp.getContext('2d');if(!tctx)return reject(new Error('Could not prepare the circular crop.'));tctx.drawImage(previewCanvas,cx-shapeSide/2,cy-shapeSide/2,shapeSide,shapeSide,0,0,shapeSide,shapeSide);const finalCanvas=document.createElement('canvas');finalCanvas.width=640;finalC function backgroundLabel(color){const labels={'transparent':'Transparent','#ffffff':'White','#f2f4f7':'Gray','#dbeafe':'Ice Blue','#93c5fd':'Sky Blue','#2563eb':'Blue','#0b2e59':'Navy','#111827':'Black','#fee2e2':'Soft Pink','#dcfce7':'Soft Green','#fef3c7':'Cream'};return labels[color]||'Custom';}
function clearBackgroundImage(){if(backgroundObjectUrl)URL.revokeObjectURL(backgroundObjectUrl);backgroundObjectUrl='';backgroundImageUrl='';backgroundImageObj=null;if(bgImageInput)bgImageInput.value='';}
function setBackgroundColor(color){clearBackgroundImage();backgroundColor=color||'transparent';bgValue.textContent=backgroundLabel(backgroundColor);if(backgroundColor!=='transparent')customBgSwatch.style.background=backgroundColor;syncBackgroundButtons();updateCropView();}
function setBackgroundImage(file){if(!file)return;if(file.size>5*1024*1024){toast('Background image must be 5 MB or smaller.','error');return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Please choose JPG, PNG or WebP.','error');return}const reader=new FileReader();reader.onload=()=>{clearBackgroundImage();backgroundObjectUrl=String(reader.result||'');backgroundImageUrl=backgroundObjectUrl;const img=new Image();img.onload=()=>{backgroundImageObj=img;bgValue.textContent='Image';syncBackgroundButtons();updateCropView();};img.onerror=()=>{clearBackgroundImage();toast('The background image could not be loaded.','error')};img.src=backgroundImageUrl;};reader.readAsDataURL(file);}
function cropRectClamp(){const size=cropStage.clientWidth,min=50,max=size-8;cropRect.w=Math.max(50,Math.min(cropRect.w,max));cropRect.h=Math.max(50,Math.min(cropRect.h,max));cropRect.x=Math.max(4,Math.min(size-cropRect.w-4,cropRect.x));cropRect.y=Math.max(4,Math.min(size-cropRect.h-4,cropRect.y));}
function syncCropFrameButtons(){document.querySelectorAll('.student-crop-frame-btn').forEach(b=>b.classList.toggle('active',b.dataset.cropAspect===cropAspect));}
function applyCropAspect(aspect){cropAspect=aspect;const size=cropStage.clientWidth;if(aspect==='free'){syncCropFrameButtons();return}let ratio=Number(aspect)||1,cw=cropRect.w,ch=cropRect.w/ratio;if(ratio>1){ch=cropRect.h;cw=ch*ratio}const max=size-8;if(cw>max){cw=max;ch=cw/ratio}if(ch>max){ch=max;cw=ch*ratio}cropRect.w=Math.max(50,cw);cropRect.h=Math.max(50,ch);cropRect.x=(size-cropRect.w)/2;cropRect.y=(size-cropRect.h)/2;cropRectClamp();syncCropFrameButtons();updateCropView();}
function setPhotoShape(shape){photoShape=shape;if(shape==='circle'&&Math.abs(cropRect.w-cropRect.h)>2){const side=Math.min(cropRect.w,cropRect.h);cropRect.w=side;cropRect.h=side;cropRect.x+= (cropRect.w-side)/2;cropRect.y+= (cropRect.h-side)/2;cropRect.x=(cropStage.clientWidth-side)/2;cropRect.y=(cropStage.clientWidth-side)/2}syncShapeButtons();updateCropView();}
function startCropInteraction(e){const handle=e.target?.dataset?.cropHandle||'';if(handle){cropInteraction={type:'resize',handle,startX:e.clientX,startY:e.clientY,rect:{...cropRect}};e.stopPropagation();cropStage.setPointerCapture?.(e.pointerId);return}if(e.target===cropMask){cropInteraction={type:'moveCrop',startX:e.clientX,startY:e.clientY,rect:{...cropRect}};e.stopPropagation();cropStage.setPointerCapture?.(e.pointerId);return}cropInteraction={type:'moveImage',startX:e.clientX,startY:e.clientY,imageX:cropX,imageY:cropY};cropDragging=true;cropStage.classList.add('dragging');cropStage.setPointerCapture?.(e.pointerId);}
function moveCropInteraction(e){if(!cropInteraction)return;const dx=e.clientX-cropInteraction.startX,dy=e.clientY-cropInteraction.startY,size=cropStage.clientWidth,min=50;if(cropInteraction.type==='moveImage'){cropX=cropInteraction.imageX+dx;cropY=cropInteraction.imageY+dy;updateCropView();return}if(cropInteraction.type==='moveCrop'){cropRect.x=cropInteraction.rect.x+dx;cropRect.y=cropInteraction.rect.y+dy;cropRectClamp();if(cropAspect!=='free'){applyCropAspect(cropAspect)}updateCropView();return}let r={...cropInteraction.rect},h=cropInteraction.handle,ratio=cropAspect==='free'?null:Number(cropAspect)||1;if(h.includes('e'))r.w=Math.max(min,cropInteraction.rect.w+dx);if(h.includes('s'))r.h=Math.max(min,cropInteraction.rect.h+dy);if(h.includes('w')){const nx=cropInteraction.rect.x+dx;r.w=Math.max(min,cropInteraction.rect.w-dx);r.x=nx}if(h.includes('n')){const ny=cropInteraction.rect.y+dy;r.h=Math.max(min,cropInteraction.rect.h-dy);r.y=ny}if(ratio){if(Math.abs(dx)>=Math.abs(dy)){r.h=r.w/ratio;if(h.includes('n'))r.y=cropInteraction.rect.y+cropInteraction.rect.h-r.h}else{r.w=r.h*ratio;if(h.includes('w'))r.x=cropInteraction.rect.x+cropInteraction.rect.w-r.w}}r.x=Math.max(4,Math.min(size-r.w-4,r.x));r.y=Math.max(4,Math.min(size-r.h-4,r.y));r.w=Math.min(r.w,size-r.x-4);r.h=Math.min(r.h,size-r.y-4);if(photoShape==='circle'){const side=Math.min(r.w,r.h);r.w=side;r.h=side}cropRect=r;updateCropView();}
function endCropInteraction(){cropInteraction=null;cropDragging=false;cropStage.classList.remove('dragging');}
