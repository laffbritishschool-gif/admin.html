<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register Student | Laff British Montessori School</title>
<link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png">
<link rel="stylesheet" href="assets/styles.css">
<style>
.reg{max-width:1120px;margin:auto;padding-bottom:40px}.register-hero{position:relative;overflow:hidden;margin-bottom:20px;padding:28px;border-radius:24px;background:linear-gradient(135deg,#0b4ea2,#1677d2);color:#fff;box-shadow:0 18px 45px rgba(11,78,162,.2)}.register-hero:after{content:'';position:absolute;width:220px;height:220px;border:28px solid rgba(255,205,38,.18);border-radius:50%;right:-70px;top:-100px}.register-hero h1{margin:4px 0 7px;font-size:30px}.register-hero p{margin:0;max-width:760px;color:rgba(255,255,255,.82)}.register-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}.photo-card,.form-card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;box-shadow:0 14px 35px rgba(15,23,42,.07)}.photo-card{padding:22px;position:sticky;top:20px}.photo-preview{width:170px;height:170px;border-radius:50%;margin:4px auto 18px;display:grid;place-items:center;overflow:hidden;border:7px solid #f4f7fb;background:#eef3f9;color:#718096;font-size:52px;font-weight:800}.photo-preview img{width:100%;height:100%;object-fit:cover}.photo-card h3{text-align:center;margin:0}.photo-card p{text-align:center;font-size:12px;color:#718096;line-height:1.6}.photo-upload{display:block;text-align:center;border:1px dashed #b8c7da;border-radius:13px;padding:12px;cursor:pointer;color:#0b5cad;font-weight:700;background:#f7faff}.photo-upload input{display:none}.photo-note{margin:10px 0 0!important}.form-card{padding:26px}.form-section{padding:0 0 24px;margin:0 0 24px;border-bottom:1px solid #edf0f5}.form-section:last-of-type{border-bottom:0;margin-bottom:0}.section-title{display:flex;align-items:center;gap:10px;margin-bottom:17px}.section-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#edf5ff;color:#0b5cad;font-weight:800}.section-title h2{font-size:16px;margin:0}.section-title p{font-size:11px;color:#7b8798;margin:3px 0 0}.register-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.register-grid .wide{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;color:#344054;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;border:1px solid #dbe2eb;border-radius:11px;padding:12px 13px;background:#fff;color:#172033;font:inherit;outline:none}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#1677d2;box-shadow:0 0 0 4px rgba(22,119,210,.09)}.field input[readonly]{background:#f7f9fc;color:#667085}.required{color:#d92d20}.helper{display:block;margin-top:6px;color:#8490a0;font-size:10px;line-height:1.5}.password-panel{padding:14px;border:1px solid #f0df99;background:#fff9df;border-radius:14px}.password-panel strong{display:block;color:#5d4d00;font-size:13px;word-break:break-word}.password-panel p{margin:6px 0 0;color:#6e621d;font-size:11px;line-height:1.5}.credential-card{display:none;margin-bottom:22px;padding:20px;border:1px solid #b9e2cc;background:#effbf4;border-radius:18px}.credential-card.show{display:block}.credential-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.credential-head h2{margin:0 0 5px;font-size:18px;color:#0d5136}.credential-head p{margin:0;color:#49705e;font-size:11px}.credential-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.credential-item{padding:12px 13px;border-radius:12px;background:#fff;border:1px solid #d5ecde}.credential-item span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#6d8778;font-weight:800}.credential-item strong{display:block;margin-top:4px;font-size:13px;color:#153c2c;word-break:break-word}.credential-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.form-actions{display:flex;justify-content:flex-end;gap:10px;align-items:center;padding-top:4px}.save-status{font-size:12px;color:#667085;margin-right:auto}.success-check{display:none;color:#14804a;font-weight:800;font-size:12px}.notice{padding:12px 13px;border-radius:12px;background:#eef6ff;border:1px solid #c9ddfb;color:#0a467f;font-size:11px;line-height:1.5;margin-top:12px}.warning{padding:12px 13px;border-radius:12px;background:#fff6e8;border:1px solid #f0cc86;color:#805600;font-size:11px;line-height:1.5;margin-top:12px}@media(max-width:850px){.register-layout{grid-template-columns:1fr}.photo-card{position:relative;top:auto}.register-grid,.credential-grid{grid-template-columns:1fr}.register-grid .wide{grid-column:auto}.form-card{padding:20px}.register-hero{padding:22px}.register-hero h1{font-size:25px}.form-actions{flex-wrap:wrap}.save-status{width:100%;margin-bottom:4px}.credential-head{flex-direction:column}}@media(max-width:520px){.photo-preview{width:145px;height:145px}.register-hero,.form-card,.photo-card{border-radius:18px}}
</style>
</head>
<body data-title="Register Student">
<div id="app-shell" data-content="<main id='registerContent'></main>"></div>
<div id="toast-host"></div>
<script type="module">
import {requireAdmin,mountShell,supabase,toast,setLoading} from './assets/app.js';

const DEFAULT_PASSWORD='Laff British School2026';
const user=await requireAdmin();
if(user){
  mountShell(user);
  const root=document.querySelector('#registerContent');
  const id=new URLSearchParams(location.search).get('id');
  const editing=Boolean(id);
  let existing=null,photoPath=null,classes=[],sessions=[],enrollments=[];

  root.innerHTML=`
    <section class="register-hero"><p class="eyebrow" style="color:#ffd43b">STUDENT RECORDS</p><h1>${editing?'Update Student Record':'Register New Student'}</h1><p>${editing?'Update the student profile, change class/session and optionally set a new login password.':'Create the student profile, assign a class and issue the school’s initial login password.'}</p></section>
    <div id="credentialCard" class="credential-card">
      <div class="credential-head"><div><h2>✓ Student registration completed</h2><p>The student account and class assignment were created successfully.</p></div><button class="btn-secondary" id="copyCredentials" type="button">Copy credentials</button></div>
      <div class="credential-grid">
        <div class="credential-item"><span>Student</span><strong id="credName">—</strong></div>
        <div class="credential-item"><span>Registration number</span><strong id="credStudentId">—</strong></div>
        <div class="credential-item"><span>School email</span><strong id="credEmail">—</strong></div>
        <div class="credential-item"><span>Class</span><strong id="credClass">—</strong></div>
        <div class="credential-item"><span>Academic session</span><strong id="credSession">—</strong></div>
        <div class="credential-item"><span>Initial password</span><strong id="credPassword">${DEFAULT_PASSWORD}</strong></div>
      </div>
      <div id="photoWarning" class="warning" style="display:none"></div>
      <div class="credential-actions"><button class="btn btn-primary" id="printCredentials" type="button">Print login details</button><a class="btn-secondary" id="openStudent" href="students.html">Go to Students</a><a class="btn-secondary" href="register-student.html">Register another student</a></div>
      <div class="notice"><b>First login:</b> the student can sign in with the registration number shown above and the initial password. They should change the password after signing in.</div>
    </div>
    <div class="register-layout">
      <aside class="photo-card"><div class="photo-preview" id="photoPreview"><span>ST</span></div><h3>Student Passport</h3><p>Clear JPG, PNG or WebP. Maximum 5 MB.</p><label class="photo-upload">📷 Choose student photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="photo-note" id="photoName">No photo selected</p></aside>
      <section class="form-card">
        <form id="studentForm" novalidate>
          <div class="form-section"><div class="section-title"><div class="section-icon">01</div><div><h2>Student identity & class</h2><p>Basic identification and current academic placement</p></div></div>
            <div class="register-grid">
              <div class="field"><label>Student ID</label><input name="student_id" readonly placeholder="Generated automatically"></div>
              <div class="field"><label>Exam Number</label><input name="exam_number" placeholder="Optional examination number"></div>
              <div class="field"><label>First Name <span class="required">*</span></label><input name="first_name" required placeholder="First name"></div>
              <div class="field"><label>Middle Name</label><input name="middle_name" placeholder="Middle name"></div>
              <div class="field"><label>Last Name <span class="required">*</span></label><input name="last_name" required placeholder="Surname"></div>
              <div class="field"><label>Gender</label><select name="gender"><option value="">Select gender</option><option value="MALE">Male</option><option value="FEMALE">Female</option><option value="OTHER">Other</option></select></div>
              <div class="field"><label>Date of Birth</label><input name="date_of_birth" type="date"></div>
              <div class="field"><label>Admission Date</label><input name="admission_date" type="date"></div>
              <div class="field"><label>Status</label><select name="status"><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option><option value="GRADUATED">Graduated</option><option value="WITHDRAWN">Withdrawn</option></select></div>
              <div class="field"><label>Class <span class="required">*</span></label><select name="class_id" id="classId" required><option value="">Loading classes…</option></select></div>
              <div class="field"><label>Academic Session <span class="required">*</span></label><select name="session_id" id="sessionId" required><option value="">Loading sessions…</option></select></div>
            </div>
          </div>
          <div class="form-section"><div class="section-title"><div class="section-icon">02</div><div><h2>Contact information</h2><p>Student contact details and home address</p></div></div>
            <div class="register-grid"><div class="field"><label>Student Phone</label><input name="phone" type="tel" placeholder="080..." autocomplete="tel"></div><div class="field"><label>School Email</label><input name="school_email" type="email" placeholder="Leave blank to generate automatically"></div><div class="field wide"><label>Home Address</label><textarea name="address" placeholder="Full home address"></textarea></div></div>
          </div>
          <div class="form-section"><div class="section-title"><div class="section-icon">03</div><div><h2>Parent / guardian</h2><p>Emergency and family contact information</p></div></div>
            <div class="register-grid"><div class="field"><label>Guardian Name</label><input name="guardian_name" placeholder="Parent or guardian full name"></div><div class="field"><label>Guardian Phone</label><input name="guardian_phone" type="tel" placeholder="080..." autocomplete="tel"></div><div class="field wide"><label>Guardian Email</label><input name="guardian_email" type="email" placeholder="parent@example.com"></div></div>
          </div>
          <div class="form-section" ${editing?'':'style="display:none"'}><div class="section-title"><div class="section-icon">04</div><div><h2>Student login password</h2><p>Admin password control</p></div></div>
            <div class="field"><label>New password</label><input name="new_password" id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Leave blank to keep the current password"><span class="helper">Set a new password here whenever the student needs a reset. At least 8 characters.</span></div>
            <div class="password-panel"><strong>Current/default password: ${DEFAULT_PASSWORD}</strong><p>New registrations use this password initially. Resetting an existing student password also marks the account to change it after sign-in.</p></div>
          </div>
          <div class="form-actions"><span class="save-status" id="saveStatus">Fields marked * are required.</span><span class="success-check" id="successCheck">✓ Saved successfully</span><a class="btn-secondary" href="students.html">Cancel</a><button class="btn btn-primary" id="saveBtn" type="submit">${editing?'Save Student Changes':'Register Student'}</button></div>
        </form>
      </section>
    </div>`;

  const form=document.querySelector('#studentForm'),photo=document.querySelector('#photo'),preview=document.querySelector('#photoPreview'),photoName=document.querySelector('#photoName'),saveBtn=document.querySelector('#saveBtn'),classId=document.querySelector('#classId'),sessionId=document.querySelector('#sessionId');
  const setValue=(name,value)=>{const el=form.elements[name];if(el&&value!==null&&value!==undefined)el.value=value};

  function showPhoto(file){if(!file)return;const reader=new FileReader();reader.onload=()=>preview.innerHTML=`<img src="${reader.result}" alt="Student photo preview">`;reader.readAsDataURL(file);photoName.textContent=file.name;}
  photo.addEventListener('change',()=>{const file=photo.files?.[0];if(!file)return;if(file.size>5*1024*1024){photo.value='';toast('Photo must be 5 MB or smaller.','error');return}if(!file.type.startsWith('image/')){photo.value='';toast('Please choose a JPG, PNG or WebP image.','error');return}showPhoto(file)});

  async function invoke(name,body){
    const {data,error}=await supabase.functions.invoke(name,{body});
    if(error){let detail=error.message||'The request could not be completed. Please try again.';try{const r=error.context;if(r?.clone){const j=await r.clone().json();if(j?.error)detail=j.error;}}catch{}throw new Error(detail)}
    if(!data?.ok)throw new Error(data?.error||'The request could not be completed. Please try again.');
    return data;
  }

  async function loadOptions(){
    const [{data:cs,error:ce},{data:ss,error:se}]=await Promise.all([
      supabase.from('classes').select('id,name,level').order('name'),
      supabase.from('academic_sessions').select('id,name,is_current').order('starts_on',{ascending:false})
    ]);
    if(ce)throw new Error(`Could not load classes: ${ce.message}`);if(se)throw new Error(`Could not load academic sessions: ${se.message}`);
    classes=cs||[];sessions=ss||[];
    classId.innerHTML='<option value="">Select class</option>'+classes.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.level?' · '+escapeHtml(x.level):''}</option>`).join('');
    sessionId.innerHTML='<option value="">Select session</option>'+sessions.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.is_current?' · Current':''}</option>`).join('');
  }

  async function loadStudent(){
    if(!editing)return;
    const {data:s,error:se}=await supabase.from('students').select('*').eq('id',id).maybeSingle();
    if(se||!s)throw new Error(se?.message||'Student record could not be found.');
    existing=s;
    ['student_id','exam_number','first_name','middle_name','last_name','gender','date_of_birth','admission_date','status','phone','school_email','address','guardian_name','guardian_phone','guardian_email'].forEach(k=>setValue(k,s[k]));
    const {data:ens,error:ee}=await supabase.from('enrollments').select('id,class_id,session_id,status,created_at,classes(name,level),academic_sessions(name,is_current)').eq('student_id',id).order('created_at',{ascending:false});
    if(ee)throw new Error(`Could not load class assignment: ${ee.message}`);
    enrollments=ens||[];
    const active=enrollments.find(x=>x.status==='ACTIVE')||enrollments[0];
    if(active){classId.value=active.class_id;sessionId.value=active.session_id;}
    if(s.photo_url){photoName.textContent='Existing photo stored';}
    if(s.user_id){document.querySelector('#newPassword').placeholder='Leave blank to keep the current password';}
  }

  function validate(){
    const missing=['first_name','last_name','class_id','session_id'].filter(k=>!String(form.elements[k].value||'').trim());
    if(missing.length)throw new Error('Please complete first name, last name, class and academic session.');
    const pw=String(form.elements.new_password?.value||'').trim();
    if(editing&&pw&&pw.length<8)throw new Error('New password must be at least 8 characters.');
  }

  async function uploadStudentPhoto(studentId){
    const file=photo.files?.[0];if(!file)return null;
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=`${String(studentId).replace(/[^a-zA-Z0-9_-]/g,'_')}/${crypto.randomUUID()}.${ext}`;
    const {error}=await supabase.storage.from('student-passports').upload(path,file,{contentType:file.type,upsert:false});
    if(error)throw error;photoPath=path;return path;
  }

  async function updateEnrollment(studentIdValue,classIdValue,sessionIdValue){
    const {data:current,error:ee}=await supabase.from('enrollments').select('id,class_id,session_id,status').eq('student_id',studentIdValue).order('created_at',{ascending:false});
    if(ee)throw ee;
    const rows=current||[];
    const target=rows.find(x=>x.session_id===sessionIdValue);
    if(target){
      const {error}=await supabase.from('enrollments').update({class_id:classIdValue,status:'ACTIVE'}).eq('id',target.id);if(error)throw error;
      const old=rows.filter(x=>x.id!==target.id&&x.status==='ACTIVE');
      for(const x of old){const {error:oe}=await supabase.from('enrollments').update({status:'INACTIVE'}).eq('id',x.id);if(oe)throw oe;}
    }else{
      const old=rows.filter(x=>x.status==='ACTIVE');
      for(const x of old){const {error:oe}=await supabase.from('enrollments').update({status:'INACTIVE'}).eq('id',x.id);if(oe)throw oe;}
      const {error}=await supabase.from('enrollments').insert({student_id:studentIdValue,class_id:classIdValue,session_id:sessionIdValue,status:'ACTIVE'});if(error)throw error;
    }
  }

  function showCredentials(data,photoWarning){
    const card=document.querySelector('#credentialCard');card.classList.add('show');
    document.querySelector('#credName').textContent=data.student?.name||'—';
    document.querySelector('#credStudentId').textContent=data.student?.student_id||'—';
    document.querySelector('#credEmail').textContent=data.student?.email||'—';
    document.querySelector('#credClass').textContent=data.student?.class_name||className();
    document.querySelector('#credSession').textContent=data.student?.session_name||sessionName();
    document.querySelector('#credPassword').textContent=data.onboarding?.password||DEFAULT_PASSWORD;
    document.querySelector('#openStudent').href=`student-details.html?id=${encodeURIComponent(data.student.id)}`;
    if(photoWarning){const w=document.querySelector('#photoWarning');w.textContent=photoWarning;w.style.display='block';}
    document.querySelector('#copyCredentials').onclick=async()=>{const text=`Laff British Montessori School\nStudent: ${data.student.name}\nRegistration Number: ${data.student.student_id}\nSchool Email: ${data.student.email}\nClass: ${data.student.class_name||className()}\nAcademic Session: ${data.student.session_name||sessionName()}\nInitial Password: ${data.onboarding?.password||DEFAULT_PASSWORD}`;try{await navigator.clipboard.writeText(text);toast('Login credentials copied.')}catch{toast('Could not copy credentials automatically.','error')}};
    document.querySelector('#printCredentials').onclick=()=>window.print();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  form.onsubmit=async e=>{
    e.preventDefault();
    try{validate()}catch(err){toast(err.message,'error');return}
    setLoading(saveBtn,true,editing?'Saving…':'Registering…');document.querySelector('#saveStatus').textContent=editing?'Saving student changes…':'Creating student account…';
    try{
      const payload={first_name:form.elements.first_name.value.trim(),middle_name:form.elements.middle_name.value.trim()||null,last_name:form.elements.last_name.value.trim(),gender:form.elements.gender.value||null,date_of_birth:form.elements.date_of_birth.value||null,exam_number:form.elements.exam_number.value.trim()||null,school_email:form.elements.school_email.value.trim().toLowerCase()||null,phone:form.elements.phone.value.trim()||null,address:form.elements.address.value.trim()||null,guardian_name:form.elements.guardian_name.value.trim()||null,guardian_phone:form.elements.guardian_phone.value.trim()||null,guardian_email:form.elements.guardian_email.value.trim().toLowerCase()||null,admission_date:form.elements.admission_date.value||null,class_id:classId.value,session_id:sessionId.value};
      let saved;
      if(!editing){
        saved=await invoke('admin-create-student',payload);
        let photoWarning='';
        if(photo.files?.[0]){try{const path=await uploadStudentPhoto(saved.student.id);const {error}=await supabase.from('students').update({photo_url:path}).eq('id',saved.student.id);if(error)throw error;}catch(photoError){photoWarning=`Student registration succeeded, but the passport photo could not be saved. You can upload it later from the student record. (${photoError.message})`;}}
        showCredentials(saved,photoWarning);toast('Student registered successfully.');document.querySelector('#saveStatus').textContent='Registration completed successfully.';document.querySelector('#successCheck').style.display='inline';
      }else{
        const updateData={exam_number:payload.exam_number,first_name:payload.first_name,middle_name:payload.middle_name,last_name:payload.last_name,gender:payload.gender,date_of_birth:payload.date_of_birth,school_email:payload.school_email,phone:payload.phone,address:payload.address,guardian_name:payload.guardian_name,guardian_phone:payload.guardian_phone,guardian_email:payload.guardian_email,admission_date:payload.admission_date,status:form.elements.status.value};
        const {error}=await supabase.from('students').update(updateData).eq('id',id);if(error)throw new Error(`Student profile could not be updated: ${error.message}`);
        await updateEnrollment(id,classId.value,sessionId.value);
        if(photo.files?.[0]){const path=await uploadStudentPhoto(existing.student_id||form.elements.student_id.value);const {error:pe}=await supabase.from('students').update({photo_url:path}).eq('id',id);if(pe)throw new Error(`Student photo could not be saved: ${pe.message}`);}
        const newPassword=String(form.elements.new_password?.value||'').trim();
        if(newPassword){await invoke('admin-student-password',{student_id:id,password:newPassword});}
        toast(newPassword?'Student updated and password changed successfully.':'Student updated successfully.');document.querySelector('#saveStatus').textContent='Changes saved successfully.';document.querySelector('#successCheck').style.display='inline';setTimeout(()=>location.href=`student-details.html?id=${encodeURIComponent(id)}`,500);
      }
    }catch(err){console.error(err);toast(err.message||'The request could not be completed. Please try again.','error');document.querySelector('#saveStatus').textContent='The record was not saved. Please review the form.';if(photoPath){try{await supabase.storage.from('student-passports').remove([photoPath])}catch{}}}
    finally{setLoading(saveBtn,false)}
  };

  try{await loadOptions();if(!editing){const current=sessions.find(x=>x.is_current);if(current)sessionId.value=current.id;form.elements.admission_date.value=new Date().toISOString().slice(0,10);}await loadStudent();}
  catch(err){console.error(err);toast(err.message||'Unable to load registration form.','error');document.querySelector('#saveStatus').textContent='Unable to load registration data.';}
}
</script>
</body>
</html>
