<style>
.exam-number-wrap{display:flex;gap:8px;align-items:stretch}.exam-number-wrap input{flex:1;min-width:0}.exam-generate{width:46px;min-width:46px;border:1px solid #dbe2eb;border-radius:11px;background:#f6f9fd;color:#0b5cad;cursor:pointer;font-size:18px;font-weight:800;display:grid;place-items:center}.exam-generate:hover{background:#edf5ff;border-color:#b9d2f2}.exam-generate:active{transform:scale(.97)}.exam-number-status{display:block;margin-top:6px;font-size:10px;color:#718096}.exam-number-status.ready{color:#14804a;font-weight:700}
.reg{max-width:1120px;margin:auto;padding-bottom:40px}.hero{padding:28px;border-radius:24px;background:linear-gradient(135deg,#0b4ea2,#1677d2);color:#fff;margin-bottom:20px;box-shadow:0 18px 45px rgba(11,78,162,.18)}.hero h1{margin:4px 0 7px;font-size:30px}.hero p{margin:0;color:rgba(255,255,255,.82)}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;box-shadow:0 14px 35px rgba(15,23,42,.07)}.photo-card{padding:22px;position:sticky;top:20px}.preview{width:170px;height:170px;border-radius:50%;margin:4px auto 18px;display:grid;place-items:center;overflow:hidden;border:7px solid #f4f7fb;background:#eef3f9;color:#718096;font-size:52px;font-weight:800}.preview img{width:100%;height:100%;object-fit:cover}.photo-card h3{text-align:center;margin:0}.photo-card p{text-align:center;font-size:12px;color:#718096;line-height:1.6}.upload{display:block;text-align:center;border:1px dashed #b8c7da;border-radius:13px;padding:12px;cursor:pointer;color:#0b5cad;font-weight:700;background:#f7faff}.upload input{display:none}.form-card{padding:26px}.section{padding:0 0 24px;margin:0 0 24px;border-bottom:1px solid #edf0f5}.section:last-of-type{border-bottom:0;margin-bottom:0}.section-title{display:flex;gap:10px;align-items:center;margin-bottom:17px}.icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#edf5ff;color:#0b5cad;font-weight:800}.section-title h2{font-size:16px;margin:0}.section-title p{font-size:11px;color:#7b8798;margin:3px 0 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.wide{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;color:#344054;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;border:1px solid #dbe2eb;border-radius:11px;padding:12px 13px;background:#fff;color:#172033;font:inherit;outline:none}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#1677d2;box-shadow:0 0 0 4px rgba(22,119,210,.09)}.field input[readonly]{background:#f7f9fc;color:#667085}.required{color:#d92d20}.helper{display:block;margin-top:6px;color:#8490a0;font-size:10px;line-height:1.5}.password-box{padding:14px;border:1px solid #f0df99;background:#fff9df;border-radius:14px;margin-top:12px}.password-box strong{display:block;color:#5d4d00}.password-box p{margin:6px 0 0;color:#6e621d;font-size:11px;line-height:1.5}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.save-status{font-size:12px;color:#667085;margin-right:auto}.success{display:none;color:#14804a;font-weight:800;font-size:12px}.credentials{display:none;margin-bottom:22px;padding:20px;border:1px solid #b9e2cc;background:#effbf4;border-radius:18px}.credentials.show{display:block}.credentials h2{margin:0 0 5px;color:#0d5136;font-size:18px}.credentials p{margin:0;color:#49705e;font-size:11px}.cred-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.cred{padding:12px 13px;border-radius:12px;background:#fff;border:1px solid #d5ecde}.cred span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#6d8778;font-weight:800}.cred strong{display:block;margin-top:4px;font-size:13px;color:#153c2c;word-break:break-word}.credential-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice{padding:12px 13px;border-radius:12px;background:#eef6ff;border:1px solid #c9ddfb;color:#0a467f;font-size:11px;line-height:1.5;margin-top:12px}.warning{display:none;padding:12px 13px;border-radius:12px;background:#fff6e8;border:1px solid #f0cc86;color:#805600;font-size:11px;line-height:1.5;margin-top:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.photo-card{position:relative;top:auto}.grid,.cred-grid{grid-template-columns:1fr}.wide{grid-column:auto}.form-card{padding:20px}.hero{padding:22px}.hero h1{font-size:25px}.save-status{width:100%;margin-bottom:4px}}@media(max-width:520px){.preview{width:145px;height:145px}.hero,.card,.credentials{border-radius:18px}}
</style>

<body data-title="Register Student"><div id="app-shell" data-content="<main id='registerContent'></main>"></div><div id="toast-host"></div>
<script type="module">
import{requireAdmin,mountShell,supabase,toast,setLoading,escapeHtml}from'./assets/app.js';
const DEFAULT_PASSWORD='Laff British School2026';
const user=await requireAdmin();
if(user){
 mountShell(user);
 const root=document.querySelector('#registerContent'),id=new URLSearchParams(location.search).get('id'),editing=Boolean(id);
 let existing=null,classes=[],sessions=[],photoPath=null;
 root.innerHTML=`<div class="reg"><section class="hero"><div class="eyebrow" style="color:#ffd43b">STUDENT RECORDS</div><h1>${editing?'Update Student Record':'Register New Student'}</h1><p>${editing?'Update student information, class/session and password.':'Create the student account, assign the class and issue the school login details.'}</p></section><div id="credentials" class="credentials"><h2>✓ Registration completed</h2><p>Keep these login details private and give them to the student.</p><div class="cred-grid"><div class="cred"><span>Student</span><strong id="cName">—</strong></div><div class="cred"><span>Registration number</span><strong id="cId">—</strong></div><div class="cred"><span>School email</span><strong id="cEmail">—</strong></div><div class="cred"><span>Class</span><strong id="cClass">—</strong></div><div class="cred"><span>Academic session</span><strong id="cSession">—</strong></div><div class="cred"><span>Initial password</span><strong id="cPassword">${DEFAULT_PASSWORD}</strong></div></div><div id="photoWarning" class="warning"></div><div class="credential-actions"><button class="btn btn-primary" id="copyBtn" type="button">Copy credentials</button><button class="btn btn-ghost" id="printBtn" type="button">Print login details</button><a class="btn btn-ghost" id="studentBtn" href="students.html">Go to Student</a><a class="btn btn-ghost" href="register-student.html">Register another</a></div><div class="notice"><b>Student first login:</b> use the registration number and initial password above. The student should change the password after signing in.</div></div><div class="layout"><aside class="card photo-card"><div class="preview" id="preview"><span>ST</span></div><h3>Student Passport</h3><p>JPG, PNG or WebP. Maximum 5 MB.</p><label class="upload">📷 Choose student photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p id="photoName">No photo selected</p></aside><section class="card form-card"><form id="form" novalidate><div class="section"><div class="section-title"><div class="icon">01</div><div><h2>Student identity & class</h2><p>Basic student details and academic placement</p></div></div><div class="grid"><div class="field"><label>Student ID</label><input name="student_id" readonly placeholder="Generated automatically"></div><div class="field"><label>Exam Number</label><div class="exam-number-wrap"><input name="exam_number" maxlength="24" placeholder="Generated automatically" autocomplete="off"><button class="exam-generate" id="generateExamNumber" type="button" title="Generate exam number" aria-label="Generate exam number">⟳</button></div><span class="exam-number-status" id="examNumberStatus">Generated automatically as LBMS plus unique numbers.</span></div><div class="field"><label>First Name <span class="required">*</span></label><input name="first_name" required></div><div class="field"><label>Middle Name</label><input name="middle_name"></div><div class="field"><label>Last Name <span class="required">*</span></label><input name="last_name" required></div><div class="field"><label>Gender</label><select name="gender"><option value="">Select gender</option><option value="MALE">Male</option><option value="FEMALE">Female</option><option value="OTHER">Other</option></select></div><div class="field"><label>Date of Birth</label><input name="date_of_birth" type="date"></div><div class="field"><label>Admission Date</label><input name="admission_date" type="date"></div><div class="field"><label>Status</label><select name="status"><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option><option value="GRADUATED">Graduated</option><option value="WITHDRAWN">Withdrawn</option></select></div><div class="field"><label>Class <span class="required">*</span></label><select name="class_id" id="classId" required><option value="">Loading classes…</option></select></div><div class="field"><label>Academic Session <span class="required">*</span></label><select name="session_id" id="sessionId" required><option value="">Loading sessions…</option></select><span class="helper" id="sessionHelper">Sessions are loaded from the school database.</span></div></div></div><div class="section"><div class="section-title"><div class="icon">02</div><div><h2>Contact information</h2><p>Student contact details</p></div></div><div class="grid"><div class="field"><label>Student Phone</label><input name="phone" type="tel"></div><div class="field"><label>School Email</label><div class="exam-number-wrap"><input name="school_email" type="email" placeholder="Enter school email or generate it" autocomplete="email"><button class="exam-generate" id="generateSchoolEmail" type="button" title="Generate school email" aria-label="Generate school email">⟳</button></div><span class="exam-number-status" id="schoolEmailStatus">You can type the email yourself or use the generate button.</span></div><div class="field wide"><label>Home Address</label><textarea name="address"></textarea></div></div></div><div class="section"><div class="section-title"><div class="icon">03</div><div><h2>Parent / guardian</h2><p>Emergency and family contact information</p></div></div><div class="grid"><div class="field"><label>Guardian Name <span class="required">*</span></label><input name="guardian_name" required></div><div class="field"><label>Guardian Phone <span class="required">*</span></label><input name="guardian_phone" required type="tel"></div><div class="field wide"><label>Guardian Email</label><input name="guardian_email" type="email"></div></div></div>${editing?`<div class="section"><div class="section-title"><div class="icon">04</div><div><h2>Student login password</h2><p>Administrator password control</p></div></div><div class="field"><label>New Password</label><input name="new_password" id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Leave blank to keep the current password"><span class="helper">At least 8 characters. Saving this resets the student password and requires a change after sign-in.</span></div><div class="password-box"><strong>School default: ${DEFAULT_PASSWORD}</strong><p>New registrations are reset to this default after account creation.</p></div></div>`:''}<div class="actions"><span class="save-status" id="saveStatus">Fields marked * are required.</span><span class="success" id="success">✓ Saved successfully</span><a class="btn btn-ghost" href="students.html">Cancel</a><button class="btn btn-primary" id="saveBtn" type="submit">${editing?'Save Student Changes':'Register Student'}</button></div></form></section></div></div>`;
 const form=document.querySelector('#form'),saveBtn=document.querySelector('#saveBtn'),classId=document.querySelector('#classId'),sessionId=document.querySelector('#sessionId'),photo=document.querySelector('#photo'),preview=document.querySelector('#preview'),photoName=document.querySelector('#photoName'),examNumber=document.querySelector('[name="exam_number"]'),generateExamBtn=document.querySelector('#generateExamNumber'),examNumberStatus=document.querySelector('#examNumberStatus'),schoolEmail=document.querySelector('[name="school_email"]'),generateEmailBtn=document.querySelector('#generateSchoolEmail'),schoolEmailStatus=document.querySelector('#schoolEmailStatus');
 const setValue=(k,v)=>{const e=form.elements[k];if(e&&v!==null&&v!==undefined)e.value=v};
 function selectedClass(){return classes.find(x=>x.id===classId.value)?.name||'—'} function selectedSession(){return sessions.find(x=>x.id===sessionId.value)?.name||'—'}
async function examNumberExists(value,currentId=''){let q=supabase.from('students').select('id').eq('exam_number',value).limit(1);if(currentId)q=q.neq('id',currentId);const{data,error}=await q;if(error)throw error;return !!data?.length;}
async function generateExamNumber(force=false){let candidate='';for(let i=0;i<200;i++){const digits=String(Math.floor(100000+Math.random()*900000));candidate='LBMS'+digits;if(!(await examNumberExists(candidate,editing?id:'')))break;}if(!candidate)throw new Error('Could not generate a unique exam number. Please try again.');examNumber.value=candidate;examNumberStatus.textContent=force?'Exam number regenerated.':'Exam number generated automatically.';examNumberStatus.classList.add('ready');return candidate;}
function emailBase(){const first=String(form.elements.first_name?.value||'').trim().toLowerCase().replace(/[^a-z]/g,''),last=String(form.elements.last_name?.value||'').trim().toLowerCase().replace(/[^a-z]/g,'');if(!first||!last)return '';return (first.slice(0,3)+last.slice(0,3));}
async function schoolEmailExists(value,currentId=''){let q=supabase.from('students').select('id').eq('school_email',value).limit(1);if(currentId)q=q.neq('id',currentId);const{data,error}=await q;if(error)throw error;return !!data?.length;}
async function generateSchoolEmail(force=false){const base=emailBase(),domain='laffbritishmontessorischool.com';if(!base){schoolEmail.value='';schoolEmailStatus.textContent='Enter the first and last name and the school email will be generated automatically.';schoolEmailStatus.classList.remove('ready');return '';}let local=base;for(let i=2;i<=200;i++){const candidate=local+'@'+domain;if(!(await schoolEmailExists(candidate,editing?id:''))){schoolEmail.value=candidate;schoolEmailStatus.textContent=force?'School email regenerated.':'School email generated automatically.';schoolEmailStatus.classList.add('ready');return candidate;}local=base+i;}throw new Error('Could not generate a unique school email. Please try again.');}
 async function invoke(name,body){const {data,error}=await supabase.functions.invoke(name,{body});if(error){let m=error.message||'The request could not be completed. Please try again.';try{const r=error.context?.clone?await error.context.clone().json():null;if(r?.error)m=r.error}catch{}throw new Error(m)}if(!data?.ok)throw new Error(data?.error||'The request could not be completed. Please try again.');return data;}
 async function loadOptions(){const[{data:cs,error:ce},{data:ss,error:se}]=await Promise.all([supabase.from('classes').select('id,name,level').order('name'),supabase.from('academic_sessions').select('id,name,is_current,is_active,starts_on,ends_on').eq('is_active',true).order('starts_on',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false})]);if(ce)throw new Error(`Could not load classes: ${ce.message}`);if(se)throw new Error(`Could not load sessions: ${se.message}`);classes=cs||[];sessions=ss||[];classId.innerHTML='<option value="">Select class</option>'+classes.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.level?' · '+escapeHtml(x.level):''}</option>`).join('');if(!sessions.length){sessionId.innerHTML='<option value="">No academic session available</option>';sessionId.disabled=true;document.querySelector('#sessionHelper').textContent='No active academic session is available. Activate a session in Supabase before registering students.';}else{sessionId.disabled=false;sessionId.innerHTML='<option value="">Select session</option>'+sessions.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.is_current?' · Current':''}</option>`).join('');}}
 async function loadStudent(){if(!editing)return;const{data:s,error:se}=await supabase.from('students').select('*').eq('id',id).maybeSingle();if(se||!s)throw new Error(se?.message||'Student record could not be found.');existing=s;['student_id','exam_number','first_name','middle_name','last_name','gender','date_of_birth','admission_date','status','phone','school_email','address','guardian_name','guardian_phone','guardian_email'].forEach(k=>setValue(k,s[k]));const{data:ens,error:ee}=await supabase.from('enrollments').select('id,class_id,session_id,status,created_at').eq('student_id',id).order('created_at',{ascending:false});if(ee)throw new Error(`Could not load class assignment: ${ee.message}`);const active=(ens||[]).find(x=>x.status==='ACTIVE')||(ens||[])[0];if(active){classId.value=active.class_id;sessionId.value=active.session_id;}photoName.textContent=s.photo_url?'Existing photo stored':'No photo selected';}
 async function updateEnrollment(studentIdValue,classIdValue,sessionIdValue){const{data:rows,error}=await supabase.from('enrollments').select('id,class_id,session_id,status,created_at').eq('student_id',studentIdValue).order('created_at',{ascending:false});if(error)throw error;const list=rows||[],target=list.find(x=>x.session_id===sessionIdValue);if(target){const{error:e}=await supabase.from('enrollments').update({class_id:classIdValue,status:'ACTIVE'}).eq('id',target.id);if(e)throw e;for(const x of list.filter(y=>y.id!==target.id&&y.status==='ACTIVE')){const{error:e}=await supabase.from('enrollments').update({status:'INACTIVE'}).eq('id',x.id);if(e)throw e;}}else{for(const x of list.filter(y=>y.status==='ACTIVE')){const{error:e}=await supabase.from('enrollments').update({status:'INACTIVE'}).eq('id',x.id);if(e)throw e;}const{error:e}=await supabase.from('enrollments').insert({student_id:studentIdValue,class_id:classIdValue,session_id:sessionIdValue,status:'ACTIVE'});if(e)throw e;}}
 async function uploadPhoto(studentDbId){const file=photo.files?.[0];if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${String(studentDbId).replace(/[^a-zA-Z0-9_-]/g,'_')}/${crypto.randomUUID()}.${ext}`;const{error}=await supabase.storage.from('student-passports').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;photoPath=path;return path;}
 function showCredentials(data){document.querySelector('#credentials').classList.add('show');document.querySelector('#cName').textContent=data.student.name||'—';document.querySelector('#cId').textContent=data.student.student_id||'—';document.querySelector('#cEmail').textContent=data.student.email||'—';document.querySelector('#cClass').textContent=data.student.class_name||selectedClass();document.querySelector('#cSession').textContent=data.student.session_name||selectedSession();document.querySelector('#cPassword').textContent=DEFAULT_PASSWORD;document.querySelector('#studentBtn').href=`student-details.html?id=${encodeURIComponent(data.student.id)}`;document.querySelector('#copyBtn').onclick=async()=>{const t=`Laff British Montessori School\nStudent: ${data.student.name}\nRegistration Number: ${data.student.student_id}\nSchool Email: ${data.student.email}\nClass: ${data.student.class_name||selectedClass()}\nAcademic Session: ${data.student.session_name||selectedSession()}\nInitial Password: ${DEFAULT_PASSWORD}`;try{await navigator.clipboard.writeText(t);toast('Student login credentials copied.')}catch{toast('Could not copy credentials automatically.','error')}};document.querySelector('#printBtn').onclick=()=>window.print();window.scrollTo({top:0,behavior:'smooth'});}
 generateExamBtn.addEventListener('click',()=>{generateExamNumber(true).catch(err=>toast(err.message||'Could not generate an exam number.','error'));});
generateEmailBtn.addEventListener('click',()=>{generateSchoolEmail(true).catch(err=>toast(err.message||'Could not generate the school email.','error'));});
form.elements.first_name.addEventListener('input',()=>{if(!editing||!examNumber.value||!/^LBMS\d{6}$/.test(examNumber.value))generateExamNumber(false).catch(()=>{});if(!editing&&!schoolEmail.value)generateSchoolEmail(false).catch(()=>{});});
form.elements.last_name.addEventListener('input',()=>{if(!editing||!examNumber.value||!/^LBMS\d{6}$/.test(examNumber.value))generateExamNumber(false).catch(()=>{});if(!editing||!schoolEmail.value||schoolEmail.value.endsWith('@laffbritishmontessorischool.com'))generateSchoolEmail(false).catch(()=>{});});
form.elements.first_name.addEventListener('blur',()=>{if(!examNumber.value)generateExamNumber(false).catch(()=>{});if(!schoolEmail.value)generateSchoolEmail(false).catch(()=>{});});
form.elements.last_name.addEventListener('blur',()=>{if(!examNumber.value)generateExamNumber(false).catch(()=>{});if(!schoolEmail.value)generateSchoolEmail(false).catch(()=>{});});
photo.addEventListener('change',()=>{const f=photo.files?.[0];if(!f)return;if(f.size>5*1024*1024){photo.value='';toast('Photo must be 5 MB or smaller.','error');return}if(!['image/jpeg','image/png','image/webp'].includes(f.type)){photo.value='';toast('Please choose JPG, PNG or WebP.','error');return}const r=new FileReader();r.onload=()=>preview.innerHTML=`<img src="${r.result}" alt="Student photo preview">`;r.readAsDataURL(f);photoName.textContent=f.name;});
 form.onsubmit=async e=>{e.preventDefault();const required=['first_name','last_name','class_id','session_id','guardian_name','guardian_phone'];if(required.some(k=>!String(form.elements[k].value||'').trim())){toast('Please complete first name, last name, class, academic session, guardian name and guardian phone.','error');return}const newPassword=String(form.elements.new_password?.value||'').trim();if(!String(examNumber.value||'').trim())await generateExamNumber(false);if(!String(schoolEmail.value||'').trim())await generateSchoolEmail(false);if(editing&&newPassword&&newPassword.length<8){toast('New password must be at least 8 characters.','error');return}setLoading(saveBtn,true,editing?'Saving…':'Registering…');document.querySelector('#saveStatus').textContent=editing?'Saving student changes…':'Creating student account…';try{const payload={first_name:form.elements.first_name.value.trim(),middle_name:form.elements.middle_name.value.trim()||null,last_name:form.elements.last_name.value.trim(),gender:form.elements.gender.value||null,date_of_birth:form.elements.date_of_birth.value||null,exam_number:form.elements.exam_number.value.trim()||null,school_email:form.elements.school_email.value.trim().toLowerCase()||null,phone:form.elements.phone.value.trim()||null,address:form.elements.address.value.trim()||null,guardian_name:form.elements.guardian_name.value.trim(),guardian_phone:form.elements.guardian_phone.value.trim(),guardian_email:form.elements.guardian_email.value.trim().toLowerCase()||null,admission_date:form.elements.admission_date.value||null,class_id:classId.value,session_id:sessionId.value};if(!editing){const created=await invoke('create-student-v2',payload);await invoke('admin-student-password',{student_id:created.student.id,password:DEFAULT_PASSWORD});let warning='';if(photo.files?.[0]){try{const path=await uploadPhoto(created.student.id);const{error}=await supabase.from('students').update({photo_url:path}).eq('id',created.student.id);if(error)throw error}catch(pe){warning=`Registration succeeded, but the passport photo could not be saved: ${pe.message}`;}}showCredentials(created);if(warning){const w=document.querySelector('#photoWarning');w.textContent=warning;w.style.display='block';}toast('Student registered successfully.');document.querySelector('#saveStatus').textContent='Registration completed successfully.';document.querySelector('#success').style.display='inline';}else{const updateData={exam_number:payload.exam_number,first_name:payload.first_name,middle_name:payload.middle_name,last_name:payload.last_name,gender:payload.gender,date_of_birth:payload.date_of_birth,school_email:payload.school_email,phone:payload.phone,address:payload.address,guardian_name:payload.guardian_name,guardian_phone:payload.guardian_phone,guardian_email:payload.guardian_email,admission_date:payload.admission_date,status:form.elements.status.value};const{error}=await supabase.from('students').update(updateData).eq('id',id);if(error)throw new Error(`Student profile could not be updated: ${error.message}`);await updateEnrollment(id,classId.value,sessionId.value);if(photo.files?.[0]){const path=await uploadPhoto(existing.student_id||id);const{error:pe}=await supabase.from('students').update({photo_url:path}).eq('id',id);if(pe)throw new Error(`Student photo could not be saved: ${pe.message}`);}if(newPassword)await invoke('admin-student-password',{student_id:id,password:newPassword});toast(newPassword?'Student updated and password changed successfully.':'Student updated successfully.');document.querySelector('#saveStatus').textContent='Changes saved successfully.';document.querySelector('#success').style.display='inline';setTimeout(()=>location.href=`student-details.html?id=${encodeURIComponent(id)}`,500);}}catch(err){console.error(err);toast(err.message||'The request could not be completed. Please try again.','error');document.querySelector('#saveStatus').textContent='The record was not saved. Please review the form.';if(photoPath){try{await supabase.storage.from('student-passports').remove([photoPath])}catch{}}}finally{setLoading(saveBtn,false)}};
