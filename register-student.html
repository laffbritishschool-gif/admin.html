<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register Student | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/theme.js"></script>
<style>
.register-page{padding-bottom:40px}.register-hero{position:relative;overflow:hidden;margin-bottom:22px;padding:28px;border-radius:24px;background:linear-gradient(135deg,#0b4ea2,#1677d2);color:#fff;box-shadow:0 18px 45px rgba(11,78,162,.2)}.register-hero:after{content:"";position:absolute;width:220px;height:220px;border:28px solid rgba(255,205,38,.18);border-radius:50%;right:-70px;top:-100px}.register-hero h1{margin:4px 0 7px;font-size:30px}.register-hero p{margin:0;max-width:720px;color:rgba(255,255,255,.82)}.register-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}.photo-card,.form-card{background:var(--surface,#fff);border:1px solid var(--border,#e5e7eb);border-radius:22px;box-shadow:0 14px 35px rgba(15,23,42,.07)}.photo-card{padding:22px;position:sticky;top:20px}.photo-preview{width:170px;height:170px;border-radius:50%;margin:4px auto 18px;display:grid;place-items:center;overflow:hidden;border:7px solid #f4f7fb;background:#eef3f9;color:#718096;font-size:52px;font-weight:800}.photo-preview img{width:100%;height:100%;object-fit:cover}.photo-card h3{margin:0;text-align:center}.photo-card p{font-size:12px;text-align:center;color:#718096;line-height:1.6}.photo-upload{display:block;text-align:center;border:1px dashed #b8c7da;border-radius:13px;padding:12px;cursor:pointer;color:#0b5cad;font-weight:700;background:#f7faff}.photo-upload:hover{background:#eef6ff;border-color:#0b5cad}.photo-upload input{display:none}.photo-note{margin:10px 0 0!important}.form-card{padding:26px}.form-section{padding:0 0 24px;margin:0 0 24px;border-bottom:1px solid #edf0f5}.form-section:last-of-type{border-bottom:0;margin-bottom:0}.section-title{display:flex;align-items:center;gap:10px;margin-bottom:17px}.section-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#edf5ff;color:#0b5cad;font-weight:800}.section-title h2{font-size:16px;margin:0}.section-title p{font-size:11px;color:#7b8798;margin:3px 0 0}.register-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.register-grid .wide{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;color:#344054;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;border:1px solid #dbe2eb;border-radius:11px;padding:12px 13px;background:#fff;color:#172033;font:inherit;outline:none;transition:.2s}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#1677d2;box-shadow:0 0 0 4px rgba(22,119,210,.09)}.field input[readonly]{background:#f7f9fc;color:#667085}.required{color:#d92d20}.helper{display:block;margin-top:6px;color:#8490a0;font-size:10px}.form-actions{display:flex;justify-content:flex-end;gap:10px;align-items:center;padding-top:4px}.btn-secondary{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border-radius:11px;border:1px solid #d9e0e9;background:#fff;color:#344054;font-weight:800;text-decoration:none;cursor:pointer}.save-status{font-size:12px;color:#667085;margin-right:auto}.success-check{display:none;color:#14804a;font-weight:800;font-size:12px}.credential-card{display:none;margin:0 0 22px;padding:20px;border:1px solid #b9e2cc;background:#effbf4;border-radius:18px}.credential-card.show{display:block}.credential-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.credential-head h2{margin:0 0 5px;font-size:18px;color:#0d5136}.credential-head p{margin:0;color:#49705e;font-size:11px}.credential-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.credential-item{padding:12px 13px;border-radius:12px;background:#fff;border:1px solid #d5ecde}.credential-item span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#6d8778;font-weight:800}.credential-item strong{display:block;margin-top:4px;font-size:13px;color:#153c2c;word-break:break-word}.credential-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.password-note{padding:11px 13px;border-radius:12px;background:#fff8df;border:1px solid #eedc8f;color:#725f08;font-size:10px;line-height:1.5;margin-top:12px}@media(max-width:850px){.register-layout{grid-template-columns:1fr}.photo-card{position:relative;top:auto}.register-grid,.credential-grid{grid-template-columns:1fr}.register-grid .wide{grid-column:auto}.form-card{padding:20px}.register-hero{padding:22px}.register-hero h1{font-size:25px}.form-actions{flex-wrap:wrap}.save-status{width:100%;margin-bottom:4px}.credential-head{flex-direction:column}}@media(max-width:520px){.photo-preview{width:145px;height:145px}.register-hero{border-radius:18px}.form-card,.photo-card{border-radius:18px}}
</style>
</head>
<body data-title="Register Student">
<div id="app-shell" data-content="<main id='registerContent'></main>"></div>
<div id="toast-host"></div>
<script type="module">
import {requireAdmin,mountShell,supabase,toast,setLoading} from './assets/app.js';

const SUPABASE_URL='https://moqpmrhholbbhuedvbgg.supabase.co';
const SUPABASE_KEY='sb_publishable_IfSp9O5zUubH6rifFbfmZQ_DJttLC1f';
const INITIAL_STUDENT_PASSWORD='Laff British School2026';
const user=await requireAdmin();
if(user){
  mountShell(user);
  const root=document.querySelector('#registerContent');
  const id=new URLSearchParams(location.search).get('id');
  let editing=Boolean(id), existing=null, uploadedPath=null, classes=[], sessions=[], activeEnrollment=null;

  root.innerHTML=`
    <section class="register-hero">
      <p class="eyebrow" style="color:#ffd43b">STUDENT RECORDS</p>
      <h1>${editing?'Update Student Record':'Register New Student'}</h1>
      <p>${editing?'Update student information, class assignment and login password below.':'Create a complete student record, assign the student to a class and issue the initial school login password.'}</p>
    </section>
    <div id="credentialCard" class="credential-card">
      <div class="credential-head"><div><h2>✓ Registration completed</h2><p>Give the student the login details below. The initial password is the school default.</p></div><button class="btn-secondary" id="copyCredentials" type="button">Copy credentials</button></div>
      <div class="credential-grid">
        <div class="credential-item"><span>Student</span><strong id="credName">—</strong></div>
        <div class="credential-item"><span>Registration number</span><strong id="credStudentId">—</strong></div>
        <div class="credential-item"><span>School email</span><strong id="credEmail">—</strong></div>
        <div class="credential-item"><span>Class</span><strong id="credClass">—</strong></div>
        <div class="credential-item"><span>Academic session</span><strong id="credSession">—</strong></div>
        <div class="credential-item"><span>Initial password</span><strong>${INITIAL_STUDENT_PASSWORD}</strong></div>
      </div>
      <div class="credential-actions"><button class="btn btn-primary" id="printCredentials" type="button">Print login details</button><a class="btn-secondary" id="openStudent" href="students.html">Go to Students</a><a class="btn-secondary" href="register-student.html">Register another student</a></div>
      <div class="password-note"><b>Important:</b> Students should change this initial password after their first login. Keep these credentials private.</div>
    </div>
    <div class="register-layout">
      <aside class="photo-card">
        <div class="photo-preview" id="photoPreview"><span>ST</span></div>
        <h3>Student Passport</h3>
        <p>Use a clear recent passport-style photo. JPG, PNG or WebP up to 5 MB.</p>
        <label class="photo-upload">📷 Choose student photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <p class="photo-note" id="photoName">No photo selected</p>
      </aside>
      <section class="form-card">
        <form id="studentForm" novalidate>
          <div class="form-section">
            <div class="section-title"><div class="section-icon">01</div><div><h2>Student identity</h2><p>Basic identification, class assignment and admission details</p></div></div>
            <div class="register-grid">
              <div class="field"><label>Student ID</label><input name="student_id" readonly placeholder="Generated automatically"><span class="helper">Generated automatically when the student account is created.</span></div>
              <div class="field"><label>Exam Number</label><input name="exam_number" placeholder="Optional examination number"></div>
              <div class="field"><label>First Name <span class="required">*</span></label><input name="first_name" required placeholder="First name"></div>
              <div class="field"><label>Middle Name</label><input name="middle_name" placeholder="Middle name"></div>
              <div class="field"><label>Last Name <span class="required">*</span></label><input name="last_name" required placeholder="Surname"></div>
              <div class="field"><label>Gender</label><select name="gender"><option value="">Select gender</option><option value="MALE">Male</option><option value="FEMALE">Female</option><option value="OTHER">Other</option></select></div>
              <div class="field"><label>Date of Birth</label><input name="date_of_birth" type="date"></div>
              <div class="field"><label>Admission Date</label><input name="admission_date" type="date"></div>
              <div class="field"><label>Status</label><select name="status"><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option><option value="GRADUATED">Graduated</option><option value="WITHDRAWN">Withdrawn</option></select></div>
              <div class="field"><label>Class <span class="required">*</span></label><select name="class_id" id="classId" required><option value="">Loading classes…</option></select><span class="helper">Every active student must belong to a class for the selected academic session.</span></div>
              <div class="field"><label>Academic Session <span class="required">*</span></label><select name="session_id" id="sessionId" required><option value="">Loading sessions…</option></select></div>
            </div>
          </div>
          <div class="form-section">
            <div class="section-title"><div class="section-icon">02</div><div><h2>Contact information</h2><p>Student contact details and home address</p></div></div>
            <div class="register-grid">
              <div class="field"><label>Student Phone</label><input name="phone" type="tel" placeholder="080..." autocomplete="tel"></div>
              <div class="field"><label>School Email</label><input name="school_email" type="email" placeholder="Leave blank to generate automatically"></div>
              <div class="field wide"><label>Home Address</label><textarea name="address" placeholder="Full home address"></textarea></div>
            </div>
          </div>
          <div class="form-section">
            <div class="section-title"><div class="section-icon">03</div><div><h2>Parent / guardian</h2><p>Emergency and family contact information</p></div></div>
            <div class="register-grid">
              <div class="field"><label>Guardian Name</label><input name="guardian_name" placeholder="Parent or guardian full name"></div>
              <div class="field"><label>Guardian Phone</label><input name="guardian_phone" type="tel" placeholder="080..." autocomplete="tel"></div>
              <div class="field wide"><label>Guardian Email</label><input name="guardian_email" type="email" placeholder="parent@example.com"></div>
            </div>
          </div>
          ${editing?`<div class="form-section"><div class="section-title"><div class="section-icon">04</div><div><h2>Student login</h2><p>Admin password control for this student account</p></div></div><div class="register-grid"><div class="field wide"><label>New password</label><input name="new_password" id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Leave blank to keep current password"><span class="helper">Admins may change this student password at any time. At least 8 characters.</span></div></div><div class="password-note">Saving a new password will require the student to change it after signing in.</div></div>`:''}
          <div class="form-actions">
            <span class="save-status" id="saveStatus">Fields marked * are required.</span>
            <span class="success-check" id="successCheck">✓ Saved successfully</span>
            <a class="btn-secondary" href="students.html">Cancel</a>
            <button class="btn btn-primary" id="saveBtn" type="submit">${editing?'Save Student Changes':'Register Student'}</button>
          </div>
        </form>
      </section>
    </div>`;

  const form=document.querySelector('#studentForm'), photo=document.querySelector('#photo'), preview=document.querySelector('#photoPreview'), photoName=document.querySelector('#photoName'), saveBtn=document.querySelector('#saveBtn'), classId=document.querySelector('#classId'), sessionId=document.querySelector('#sessionId');
  const setValue=(name,value)=>{const el=form.elements[name];if(el&&value!==null&&value!==undefined)el.value=value};
  const currentDate=()=>new Date().toISOString().slice(0,10);
  const sessionName=()=>sessions.find(x=>x.id===sessionId.value)?.name||'—';
  const className=()=>classes.find(x=>x.id===classId.value)?.name||'—';
  const authHeaders=token=>({'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${token}`});

  function showPhoto(file){if(!file)return;const reader=new FileReader();reader.onload=()=>preview.innerHTML=`<img src="${reader.result}" alt="Student photo preview">`;reader.readAsDataURL(file);photoName.textContent=file.name;}
  photo.addEventListener('change',()=>{const file=photo.files?.[0];if(!file)return;if(file.size>5*1024*1024){photo.value='';toast('Photo must be 5 MB or smaller.','error');return}if(!file.type.startsWith('image/')){photo.value='';toast('Please choose a JPG, PNG or WebP image.','error');return}showPhoto(file)});

  async function loadOptions(){
    const [{data:cs,error:ce},{data:ss,error:se}]=await Promise.all([
      supabase.from('classes').select('id,name,level').order('name'),
      supabase.from('academic_sessions').select('id,name,is_current').order('starts_on',{ascending:false})
    ]);
    if(ce)throw ce;if(se)throw se;classes=cs||[];sessions=ss||[];
    classId.innerHTML='<option value="">Select class</option>'+classes.map(x=>`<option value="${x.id}">${x.name}${x.level?` · ${x.level}`:''}</option>`).join('');
    sessionId.innerHTML='<option value="">Select session</option>'+sessions.map(x=>`<option value="${x.id}">${x.name}${x.is_current?' · Current':''}</option>`).join('');
    const current=sessions.find(x=>x.is_current);if(current)sessionId.value=current.id;
  }

  async function loadExisting(){
    if(!editing)return;
    const {data,error}=await supabase.from('students').select('*').eq('id',id).single();
    if(error)throw error;existing=data;
    ['student_id','exam_number','first_name','middle_name','last_name','gender','date_of_birth','admission_date','status','phone','school_email','address','guardian_name','guardian_phone','guardian_email'].forEach(k=>setValue(k,data[k]));
    if(data.photo_url){preview.innerHTML=`<div style="font-size:12px;text-align:center;padding:20px">Existing<br>Photo</div>`;photoName.textContent='Existing photo stored';}
    const {data:enrollments,error:ee}=await supabase.from('enrollments').select('id,class_id,session_id,status,created_at').eq('student_id',id).order('created_at',{ascending:false});
    if(ee)throw ee;activeEnrollment=(enrollments||[]).find(x=>x.status==='ACTIVE')||enrollments?.[0]||null;
    if(activeEnrollment){classId.value=activeEnrollment.class_id||'';sessionId.value=activeEnrollment.session_id||sessionId.value||'';}
  }

  async function uploadPhoto(file,studentId){
    if(!file)return existing?.photo_url||null;
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=`${studentId.trim().replace(/[^a-zA-Z0-9_-]/g,'_')}/${crypto.randomUUID()}.${ext}`;
    const {error}=await supabase.storage.from('student-passports').upload(path,file,{contentType:file.type,upsert:false});
    if(error)throw error;uploadedPath=path;return path;
  }

  async function invoke(name,body){
    const {data:{session}}=await supabase.auth.getSession();if(!session?.access_token)throw new Error('Your admin session has expired. Please sign in again.');
    const response=await fetch(`${SUPABASE_URL}/functions/v1/${name}`,{method:'POST',headers:authHeaders(session.access_token),body:JSON.stringify(body)});
    const result=await response.json().catch(()=>({}));if(!response.ok||(!result.ok&&result.error))throw new Error(result.error||'The server request could not be completed.');return result;
  }

  function showCredentials(student){
    $('credentialCard').classList.add('show');$('credName').textContent=student.name||'—';$('credStudentId').textContent=student.student_id||'—';$('credEmail').textContent=student.email||'—';$('credClass').textContent=className();$('credSession').textContent=sessionName();$('openStudent').href=`student-details.html?id=${encodeURIComponent(student.id)}`;
    $('copyCredentials').onclick=async()=>{const text=`Laff British Montessori School\nStudent: ${student.name}\nRegistration Number: ${student.student_id}\nSchool Email: ${student.email}\nClass: ${className()}\nAcademic Session: ${sessionName()}\nPassword: ${INITIAL_STUDENT_PASSWORD}`;try{await navigator.clipboard.writeText(text);toast('Login details copied.')}catch{toast('Could not copy automatically. Please use the print option.','error')}};
    $('printCredentials').onclick=()=>window.print();
    document.querySelector('.register-layout')?.scrollIntoView({behavior:'smooth',block:'start'});
  }

  form.onsubmit=async e=>{
    e.preventDefault();
    const missing=['first_name','last_name','class_id','session_id'].filter(k=>!String(form.elements[k]?.value||'').trim());
    if(missing.length){toast('Please complete first name, last name, class and academic session.','error');form.elements[missing[0]].focus();return;}
    const data=Object.fromEntries(new FormData(form));
    Object.keys(data).forEach(k=>{if(data[k]==='')data[k]=null});
    data.first_name=String(data.first_name||'').trim();data.middle_name=data.middle_name?String(data.middle_name).trim():null;data.last_name=String(data.last_name||'').trim();data.exam_number=data.exam_number?String(data.exam_number).trim():null;data.phone=data.phone?String(data.phone).trim():null;data.address=data.address?String(data.address).trim():null;data.school_email=data.school_email?String(data.school_email).trim().toLowerCase():null;data.guardian_name=data.guardian_name?String(data.guardian_name).trim():null;data.guardian_phone=data.guardian_phone?String(data.guardian_phone).trim():null;data.guardian_email=data.guardian_email?String(data.guardian_email).trim().toLowerCase():null;
    if(editing&&data.new_password&&data.new_password.length<8){toast('New password must be at least 8 characters.','error');return}
    setLoading(saveBtn,true,editing?'Saving…':'Registering…');$('saveStatus').textContent=editing?'Saving student changes…':'Creating student account…';
    try{
      if(!editing){
        const result=await invoke('create-student',{first_name:data.first_name,middle_name:data.middle_name,last_name:data.last_name,class_id:data.class_id,session_id:data.session_id,exam_number:data.exam_number,gender:data.gender,school_email:data.school_email,phone:data.phone,address:data.address,guardian_name:data.guardian_name,guardian_phone:data.guardian_phone,guardian_email:data.guardian_email});
        const student=result.student;if(!student?.id)throw new Error('Student account was created but no student record was returned.');
        const photoFile=photo.files?.[0];const photoUrl=await uploadPhoto(photoFile,student.student_id);
        const profileUpdate={exam_number:data.exam_number,first_name:data.first_name,middle_name:data.middle_name,last_name:data.last_name,gender:data.gender,date_of_birth:data.date_of_birth,admission_date:data.admission_date||currentDate(),status:data.status||'ACTIVE',phone:data.phone,address:data.address,guardian_name:data.guardian_name,guardian_phone:data.guardian_phone,guardian_email:data.guardian_email,photo_url:photoUrl};
        const {error:ue}=await supabase.from('students').update(profileUpdate).eq('id',student.id);if(ue)throw ue;
        let passwordResult;try{passwordResult=await invoke('admin-student-password',{student_id:student.id,password:INITIAL_STUDENT_PASSWORD});}catch(err){throw new Error(`Student was created, but the initial login password could not be applied: ${err.message}`)}
        $('successCheck').style.display='inline';toast('Student registered successfully.');showCredentials({...student,email:student.email||data.school_email});$('saveStatus').textContent='Registration complete. Login details are shown above.';
      }else{
        const photoFile=photo.files?.[0];data.photo_url=await uploadPhoto(photoFile,data.student_id||existing.student_id);delete data.student_id;delete data.class_id;delete data.session_id;delete data.new_password;
        const {error:ue}=await supabase.from('students').update(data).eq('id',id);if(ue)throw ue;
        if(!activeEnrollment) {
          const {data:en,error:ee}=await supabase.from('enrollments').insert({student_id:id,class_id:classId.value,session_id:sessionId.value,status:'ACTIVE'}).select('id').single();if(ee)throw ee;activeEnrollment=en;
        } else {
          const {error:ee}=await supabase.from('enrollments').update({class_id:classId.value,session_id:sessionId.value,status:'ACTIVE'}).eq('id',activeEnrollment.id);if(ee)throw ee;
        }
        const newPassword=form.elements.new_password?.value?.trim();if(newPassword){await invoke('admin-student-password',{student_id:id,password:newPassword});toast('Student password changed successfully.');}
        $('successCheck').style.display='inline';toast('Student record updated successfully.');$('saveStatus').textContent='Student record updated successfully.';setTimeout(()=>location.href=`student-details.html?id=${encodeURIComponent(id)}`,500);
      }
    }catch(error){
      console.error('Student save error',error);if(uploadedPath){try{await supabase.storage.from('student-passports').remove([uploadedPath])}catch(cleanup){console.warn(cleanup)}}
      toast(error.message||'We could not save the student record. Please try again.','error');$('saveStatus').textContent='The record was not saved. Please review the form.';
    }finally{setLoading(saveBtn,false)}
  };

  try{await loadOptions();await loadExisting();}catch(e){console.error(e);toast(e.message||'Could not load student registration data.','error');}
}
</script>
</body>
</html>
