<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register Student</title><link rel="stylesheet" href="assets/styles.css"><script src="assets/theme.js"></script></head><body data-title="Register Student"><div id="app-shell" data-content="<div class='panel'><form id='f' class='form-grid'><label>Student ID<input name='student_id' required></label><label>Exam Number<input name='exam_number'></label><label>First Name<input name='first_name' required></label><label>Middle Name<input name='middle_name'></label><label>Last Name<input name='last_name' required></label><label>Gender<select name='gender'><option value=''>Select…</option><option>MALE</option><option>FEMALE</option><option>OTHER</option></select></label><label>Date of Birth<input type='date' name='date_of_birth'></label><label>Phone<input name='phone'></label><label>Guardian Name<input name='guardian_name'></label><label>Guardian Phone<input name='guardian_phone'></label><label>Guardian Email<input type='email' name='guardian_email'></label><label>Address<textarea name='address'></textarea></label><div class='form-actions'><button class='btn btn-primary'>Register Student</button></div></form></div>"></div><div id="toast-host"></div><script type="module">import{requireAdmin,mountShell,supabase,toast,setLoading}from'./assets/app.js';const u=await requireAdmin();if(u){mountShell(u);const f=document.querySelector('#f');f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');setLoading(b,true,'Registering…');const p=Object.fromEntries(new FormData(f));const{error}=await supabase.from('students').insert(p);if(error)toast(error.message,'error');else{toast('Student registered successfully.');f.reset()}setLoading(b,false)}};</script></body></html>
