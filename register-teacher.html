#fff;box-shadow:0 0 0 4px rgba(10,102,194,.08)}.teacher-field small{font-size:9px;color:var(--muted)}.status-control{display:flex;gap:8px;flex-wrap:wrap}.status-option{position:relative}.status-option input{position:absolute;opacity:0}.status-option span{display:inline-flex;align-items:center;gap:7px;padding:10px 13px;border:1px solid #dbe2ec;border-radius:10px;background:#fbfcff;font-size:10px;font-weight:700;cursor:pointer;color:#475467}.status-option input:checked+span{border-color:#b7cff0;background:#edf5ff;color:var(--blue)}.status-dot{width:7px;height:7px;border-radius:50%;background:#12b76a}.status-dot.off{background:#98a2b3}.form-note{padding:12px 13px;border-radius:12px;background:#f8fbff;border:1px solid #dce9fb;color:#526078;font-size:10px;line-height:1.6}.assignment-builder{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.assignment-field{display:grid;gap:7px}.assignment-field label{font-size:10px;font-weight:800;color:#344054}.assignment-field select{width:100%;border:1px solid #dbe2ec;background:#fbfcff;border-radius:11px;padding:12px 13px;outline:0;color:var(--ink);font-size:11px}.assignment-field select:focus{border-color:#0a66c2;box-shadow:0 0 0 4px rgba(10,102,194,.08)}.assignment-add{height:42px}.assignment-list-form{display:grid;gap:9px;margin-top:14px}.assignment-empty{padding:22px;border:1px dashed #d6deea;border-radius:13px;text-align:center;color:#8a95a5;background:#fbfcff;font-size:10px}.assignment-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 13px;border:1px solid #e7ebf1;border-radius:13px;background:#fff}.assignment-main{display:flex;align-items:center;gap:11px;min-width:0}.assignment-icon{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:#eef4ff;color:var(--blue);display:grid;place-items:center}.assignment-copy{min-width:0}.assignment-copy strong{display:block;font-size:11px}.assignment-copy small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.remove-assignment{border:0;background:#fff3f3;color:#c62828;border-radius:9px;padding:8px 10px;font-size:9px;font-weight:800;cursor:pointer}.teacher-form-actions{display:flex;justify-content:flex-end;gap:10px;padding:22px 26px;background:#fbfcfe}.teacher-form-actions .btn{min-width:145px;text-align:center}.teacher-photo-panel{position:sticky;top:106px}.photo-preview-shell{padding:18px;border:1px solid #e5eaf2;border-radius:18px;background:#f7faff}.teacher-photo-preview{width:170px;height:200px;margin:0 auto 16px;border-radius:18px;overflow:hidden;background:#eaf1ff;border:4px solid #fff;box-shadow:0 14px 30px rgba(19,43,88,.12);display:grid;place-items:center;color:#0b5ed7;font-size:42px;font-weight:800}.teacher-photo-preview img{width:100%;height:100%;object-fit:cover}.photo-meta{text-align:center}.photo-meta strong{display:block;font-size:12px}.photo-meta small{display:block;color:var(--muted);font-size:9px;line-height:1.6;margin-top:4px}.upload-box{display:block;margin-top:14px;border:1px dashed #b9c9e3;background:#fff;border-radius:12px;padding:13px;text-align:center;cursor:pointer}.upload-box input{display:none}.upload-box strong{display:block;font-size:11px;color:var(--blue)}.upload-box small{display:block;color:var(--muted);margin-top:4px;font-size:9px}@media(max-width:1050px){.teacher-form-grid{grid-template-columns:1fr}.teacher-photo-panel{position:static}}@media(max-width:800px){.teacher-form-hero{align-items:flex-start;flex-direction:column;padding:24px}.teacher-form-hero h2{font-size:24px}.teacher-form-hero .btn{width:100%;text-align:center}.teacher-fields{grid-template-columns:1fr}.teacher-field.full{grid-column:auto}.assignment-builder{grid-template-columns:1fr}.assignment-add{width:100%}.form-section{padding:21px 18px}.teacher-form-actions{padding:18px;flex-direction:column}.teacher-form-actions .btn{width:100%}.teacher-photo-panel .photo-preview-shell{display:block}}

<body data-title="Register Teacher">
<div id="app-shell" data-content="<div class='teacher-form-page'><div class='loading-inline'>Loading…</div></div>"></div><div id="toast-host"></div>
<script type="module">
import {requireAdmin,mountShell,supabase,escapeHtml,pageLoading,setLoading,toast} from './assets/app.js';
const user=await requireAdmin();
if(user){
 mountShell(user);pageLoading(false);
 const root=document.querySelector('.teacher-form-page');
 const id=new URLSearchParams(location.search).get('id');
 root.innerHTML=`<div class="teacher-form-hero"><div><span class="section-kicker" style="color:#f8d84b">STAFF MANAGEMENT</span><h2>${id?'Edit Teacher':'Register New Teacher'}</h2><p>${id?'Update the teacher profile and teaching assignments.':'Create a complete teacher profile, upload a photo and assign classes and subjects.'}</p></div><a class="btn" href="teachers.html">← Back to Teachers</a></div><div class="teacher-form-grid"><section class="panel teacher-main-panel"><form id="teacher-form"><div class="form-section"><div class="form-section-head"><div><span class="section-kicker">01 · PROFILE</span><h2>Teacher information</h2><p>Enter the staff member’s core contact and account information.</p></div><div class="section-number">01</div></div><div class="teacher-fields"><div class="teacher-field"><label>Staff ID *</label><div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center"><input name="staff_id" required readonly placeholder="Generating…"><button type="button" class="btn btn-ghost" id="regenerate-staff-id" title="Generate another Staff ID" aria-label="Generate another Staff ID" style="width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:11px;color:#0a66c2;border:1px solid #cbd8ea;background:#f7faff"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M20 11a8 8 0 0 0-14.5-4.7L4 8"></path><path d="M4 4v4h4M4 13a8 8 0 0 0 14.5 4.7L20 16"></path><path d="M20 20v-4h-4"></path></svg></button></div><small id="staff-id-help">A unique staff ID is generated automatically. Use the regenerate icon to choose another one.</small><span id="staff-id-status" style="display:none">Auto-generated</span></div><div class="teacher-field"><label>Full Name *</label><input name="full_name" required placeholder="Teacher full name"></div><div class="teacher-field"><label>School Email Address *</label><input name="school_email" type="email" required readonly placeholder="Generating school email…"><small>This is the teacher's official school email. It is generated from the teacher's name.</small></div>
<div class="teacher-field full"><label>Secondary / Personal Email *</label><input name="secondary_email" type="email" required autocomplete="email" placeholder="teacher@gmail.com"><small>This email is required. Verification codes will be sent to this address, not the generated school email.</small><div id="admin-otp-panel" style="display:none;margin-top:12px;padding:16px;border:1px solid #dbe5f2;border-radius:14px;background:#f8fbff"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px"><div><strong style="font-size:12px;color:#12365a">EMAIL VERIFICATION</strong><div style="font-size:11px;color:#66758a;margin-top:4px">The 6-digit verification code will be sent to this secondary email address.</div></div><span id="admin-otp-badge" style="display:none;font-size:10px;font-weight:800;padding:6px 9px;border-radius:999px;background:#e9f8ef;color:#177245">Verified</span></div><div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px"><input id="admin-confirmation-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code" style="font-size:16px;letter-spacing:3px;text-align:center"><button type="button" class="btn btn-primary" id="verify-admin-otp" disabled>Verify code</button></div><button type="button" class="btn btn-ghost" id="send-admin-otp" style="margin-top:10px;width:fit-content">↻ Send code again</button><div id="admin-otp-status" style="margin-top:10px;font-size:11px;color:#5f6f83"></div></div></div>
<div class="teacher-field full"><label>Email Confirmation</label><div class="status-control" id="email-confirmation-modes">
<label class="status-option"><input name="email_confirmation_mode" type="radio" value="ADMIN"><span><i class="status-dot"></i> Confirm by me</span></label>
<label class="status-option"><input name="email_confirmation_mode" type="radio" value="AUTO" checked><span><i class="status-dot"></i> Auto confirm</span></label>
<label class="status-option"><input name="email_confirmation_mode" type="radio" value="TEACHER"><span><i class="status-dot"></i> Confirm by teacher</span></label>
</div><small id="email-confirm-help">You control this per teacher. For teacher confirmation, a code is sent by email before dashboard access.</small></div><div class="teacher-field"><label>Phone Number</label><input name="phone" type="tel" placeholder="080…"></div><div class="teacher-field full"><label>Employment Status</label><div class="status-control"><label class="status-option"><input name="is_active" type="radio" value="true" checked><span><i class="status-dot"></i> Active</span></label><label class="status-option"><input name="is_active" type="radio" value="false"><span><i class="status-dot off"></i> Inactive</span></label></div></div></div></div><div class="form-section"><div class="form-section-head"><div><span class="section-kicker">02 · ASSIGNMENTS</span><h2>Teaching assignments</h2><p>Choose the classes and subjects this teacher is responsible for.</p></div><div class="section-number">02</div></div><div class="form-note" style="margin-bottom:14px">Add every class and subject combination handled by this teacher.</div><div class="assignment-builder"><div class="assignment-field"><label>Class</label><select id="assignment-class"><option value="">Select class…</option></select></div><div class="assignment-field"><label>Subject</label><select id="assignment-subject"><option value="">Select subject…</option></select></div><button type="button" class="btn btn-primary assignment-add" id="add-assignment">+ Add Assignment</button></div><div id="assignment-list" class="assignment-list-form"><div class="assignment-empty">No assignments added yet.</div></div></div><div class="form-section"><div class="form-section-head"><div><span class="section-kicker">03 · REVIEW</span><h2>Before you save</h2><p>Check the information above before submitting.</p></div><div class="section-number">03</div></div><div class="form-note">Staff ID, full name and school email are required. "Confirm by teacher" is completed from the teacher login page. "Confirm by me" requires the principal verification code shown directly under the School Email Address field. "Auto confirm" completes confirmation immediately.</div><div class="teacher-form-actions"><a class="btn btn-ghost" href="teachers.html">Cancel</a><button class="btn btn-primary" id="save-teacher" type="submit">${id?'Save Changes':'Register Teacher'}</button></div></div></form></section><aside class="panel teacher-photo-panel"><div class="panel-head"><div><span class="section-kicker">PROFILE PHOTO</span><h2>Teacher Photo</h2></div></div><div class="photo-preview-shell"><div id="photo-preview" class="teacher-photo-preview">T</div><div class="photo-meta"><strong>Professional profile photo</strong><small>Use a clear passport-style image facing the camera.</small></div><label class="upload-box"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><strong>Upload photo</strong><small>JPG, PNG or WebP · Maximum 5 MB</small></label><div id="photo-status" class="form-note" style="margin-top:12px">A clear professional photo is recommended.</div></div></aside></div>`;
 const form=document.querySelector('#teacher-form'),photoInput=document.querySelector('#photo'),preview=document.querySelector('#photo-preview'),status=document.querySelector('#photo-status');
 const classSelect=document.querySelector('#assignment-class'),subjectSelect=document.querySelector('#assignment-subject'),assignmentList=document.querySelector('#assignment-list');
 let teacherId=id,existingPhoto='',selectedAssignments=[];let generatedStaffId='';let generatedSchoolEmail='';let teacherEmailConfirmed=false;let principalVerified=!!id&&teacherEmailConfirmed;let pendingAdminConfirmation=false;let adminOtpSending=false;let lastAdminOtpSecondaryEmail='';let adminVerificationRequestId='';const adminOtpPanel=document.querySelector('#admin-otp-panel'),adminOtpStatus=document.querySelector('#admin-otp-status'),adminOtpInput=document.querySelector('#admin-confirmation-code'),adminOtpVerify=document.querySelector('#verify-admin-otp'),adminOtpSend=document.querySelector('#send-admin-otp'),adminOtpBadge=document.querySelector('#admin-otp-badge'),saveTeacherButton=document.querySelector('#save-teacher');
 function initials(name){return (name||'Teacher').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'T'}
 function renderAssignments(){if(!selectedAssignments.length){assignmentList.innerHTML='<div class="assignment-empty">No assignments added yet.</div>';return}assignmentList.innerHTML=selectedAssignments.map((a,i)=>`<div class="assignment-row"><div><strong>${escapeHtml(a.className)}</strong><small>${escapeHtml(a.level||'')} · ${escapeHtml(a.subjectName)}${a.subjectCode?' · '+escapeHtml(a.subjectCode):''}</small></div><button type="button" class="remove-assignment" data-index="${i}">Remove</button></div>`).join('');assignmentList.querySelectorAll('.remove-assignment').forEach(b=>b.onclick=()=>{selectedAssignments.splice(Number(b.dataset.index),1);renderAssignments();syncOtpControls()})}
 function slugName(name){return String(name||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9\\s]/g,'').trim().split(/\\s+/).filter(Boolean)}
let schoolEmailGenerationToken=0;
async function generateSchoolEmail(){
 if(id)return;
 const input=form.elements.school_email,name=form.elements.full_name?.value||'';
 const parts=slugName(name);
 if(!input)return;
 if(parts.length<1){input.value='';input.placeholder='Enter full name first…';generatedSchoolEmail='';return}
 const token=++schoolEmailGenerationToken;
 const prefix=(parts.length===1?parts[0]:parts[0]+parts[parts.length-1]).slice(0,28);
 const base=prefix+'@laffbritishmontesorrischool.com';
 generatedSchoolEmail=base;
 input.value=base;
 input.placeholder='Generated school email';
 if(!id)setTimeout(()=>maybeAutoSendAdminOtp(),0);
 try{
   const {data,error}=await supabase.from('teachers').select('id').eq('school_email',base).maybeSingle();
   if(token!==schoolEmailGenerationToken)return;
   if(error)throw error;
   let candidate=base;
   if(data){
     let found=null;
     for(let i=2;i<=99;i++){
       const x=prefix+i+'@laffbritishmontesorrischool.com';
       const {data:d,error:e}=await supabase.from('teachers').select('id').eq('school_email',x).maybeSingle();
       if(token!==schoolEmailGenerationToken)return;
       if(e)throw e;
       if(!d){found=x;break}
     }
     candidate=found||base;
   }
   generatedSchoolEmail=candidate;
   input.value=candidate;
 }catch(e){
   console.error('School email availability check failed:',e);
 }
}

async function loadOptions(){const [{data:classes,error:ce},{data:subjects,error:se}]=await Promise.all([supabase.from('classes').select('id,name,level').order('name'),supabase.from('subjects').select('id,name,code').eq('is_active',true).order('name')]);if(ce)throw ce;if(se)throw se;classSelect.innerHTML='<option value="">Select class…</option>'+(classes||[]).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.level?' — '+escapeHtml(x.level):''}</option>`).join('');subjectSelect.innerHTML='<option value="">Select subject…</option>'+(subjects||[]).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.code?' — '+escapeHtml(x.code):''}</option>`).join('');}
 async function generateStaffId(){if(id)return;const input=form.elements.staff_id;const help=document.querySelector('#staff-id-help'),badge=document.querySelector('#staff-id-status'),regen=document.querySelector('#regenerate-staff-id');if(!input)return;input.value='';input.placeholder='Generating…';input.disabled=true;if(regen)regen.disabled=true;if(help)help.textContent='Generating a unique staff ID…';if(badge)badge.textContent='Generating…';try{for(let i=0;i<12;i++){const code='TCH-'+String(Math.floor(100000+Math.random()*900000));const {data,error}=await supabase.from('teachers').select('id').eq('staff_id',code).maybeSingle();if(error)throw error;if(!data){generatedStaffId=code;input.value=code;if(help)help.textContent='This staff ID is generated automatically. Tap the regenerate icon to choose another.';if(badge)badge.textContent='Ready';input.disabled=false;if(regen)regen.disabled=false;return}}throw new Error('Could not generate a unique staff ID. Please try again.')}catch(e){input.disabled=false;if(regen)regen.disabled=false;if(badge)badge.textContent='Retry';if(help)help.textContent='Staff ID could not be generated automatically.';throw e}}
 async function loadTeacher(){if(!id)return;const {data:t,error}=await supabase.from('teachers').select('id,staff_id,full_name,email,school_email,secondary_email,email_confirmation_mode,email_confirmed,email_confirmation_expires_at,phone,photo_url,is_active').eq('id',id).maybeSingle();if(error)throw error;if(!t)throw new Error('Teacher record not found.');teacherId=t.id;existingPhoto=t.photo_url||'';for(const k of ['staff_id','full_name','phone'])form.elements[k].value=t[k]||'';form.elements.school_email.value=t.school_email||t.email||'';form.elements.school_email.readOnly=true;form.elements.secondary_email.value=t.secondary_email||'';teacherEmailConfirmed=!!t.email_confirmed;form.querySelectorAll('input[name="is_active"]').forEach(r=>r.checked=r.value===String(t.is_active));preview.textContent=initials(t.full_name);if(existingPhoto){try{const {data}=await supabase.storage.from('teacher-photos').createSignedUrl(existingPhoto,3600);if(data?.signedUrl)preview.innerHTML=`<img src="${escapeHtml(data.signedUrl)}" alt="Teacher photo">`;status.textContent='Existing photo loaded. Upload a new photo to replace it.'}catch{}}const {data:as,error:ae}=await supabase.from('class_subjects').select('id,class_id,subject_id,classes(name,level),subjects(name,code)').eq('teacher_id',id);if(ae)throw ae;selectedAssignments=(as||[]).map(a=>({existingId:a.id,classId:a.class_id,subjectId:a.subject_id,className:a.classes?.name||'Class',level:a.classes?.level||'',subjectName:a.subjects?.name||'Subject',subjectCode:a.subjects?.code||''}));renderAssignments()}
 photoInput.onchange=()=>{const file=photoInput.files?.[0];if(!file)return;if(file.size>5*1024*1024){photoInput.value='';toast('Photo must be 5 MB or smaller.','error');return}if(!file.type.startsWith('image/')){photoInput.value='';toast('Please choose a JPG, PNG or WebP image.','error');return}const url=URL.createObjectURL(file);preview.innerHTML=`<img src="${url}" alt="Teacher photo preview">`;status.textContent='New photo selected. It will be uploaded when you save.'};
 document.querySelector('#add-assignment').onclick=()=>{const c=classSelect.options[classSelect.selectedIndex],s=subjectSelect.options[subjectSelect.selectedIndex];if(!classSelect.value||!subjectSelect.value){toast('Select both a class and subject.','error');return}if(selectedAssignments.some(a=>a.classId===classSelect.value&&a.subjectId===subjectSelect.value)){toast('That class and subject assignment already exists.','error');return}selectedAssignments.push({classId:classSelect.value,subjectId:subjectSelect.value,className:c.text.split(' — ')[0],level:'',subjectName:s.text.split(' — ')[0],subjectCode:s.text.includes(' — ')?s.text.split(' — ').slice(1).join(' — '):''});renderAssignments();classSelect.value='';subjectSelect.value=''};
 async function uploadPhoto(){const file=photoInput.files?.[0];if(!file)return existingPhoto||null;const ext=file.name.split('.').pop().toLowerCase();const path=`${teacherId||crypto.randomUUID()}/${Date.now()}.${ext}`;const {error}=await supabase.storage.from('teacher-photos').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return path}
 function syncOtpControls(){
 const mode=form.querySelector('input[name="email_confirmation_mode"]:checked')?.value||'AUTO';
 const isAdminMode=mode==='ADMIN';
 const secondary=String(form.elements.secondary_email?.value||'').trim();
 const hasSecondary=!!secondary&&secondary.includes('@');
 if(adminOtpPanel)adminOtpPanel.style.display=(isAdminMode&&hasSecondary)?'block':'none';
 if(adminOtpBadge)adminOtpBadge.style.display=principalVerified?'inline-flex':'none';
 if(adminOtpInput)adminOtpInput.disabled=principalVerified;
 if(adminOtpVerify)adminOtpVerify.disabled=principalVerified||!pendingAdminConfirmation||adminOtpSending;
 if(adminOtpSend)adminOtpSend.disabled=adminOtpSending||!hasSecondary;
 if(!id&&saveTeacherButton&&isAdminMode)saveTeacherButton.disabled=!principalVerified;
 if(adminOtpStatus&&isAdminMode&&hasSecondary&&!pendingAdminConfirmation&&!principalVerified)adminOtpStatus.textContent='A verification code will be sent automatically to '+secondary+'.';
 if(adminOtpStatus&&isAdminMode&&principalVerified)adminOtpStatus.textContent='Email verified. Register Teacher is now available.'
}
function resetPrincipalVerification(){
 principalVerified=false;
 pendingAdminConfirmation=false;
 adminVerificationRequestId='';
 if(adminOtpInput)adminOtpInput.value='';
 if(adminOtpBadge)adminOtpBadge.style.display='none';
 syncOtpControls()
}
async function sendAdminConfirmationCode(){
 const secondaryEmail=String(form.elements.secondary_email?.value||'').trim().toLowerCase();
 if(!secondaryEmail||!secondaryEmail.includes('@'))throw new Error('Enter the Secondary / Personal Email first.');
 if(adminOtpSending)return false;
 adminOtpSending=true;
 pendingAdminConfirmation=false;
 if(adminOtpStatus)adminOtpStatus.textContent='Sending a 6-digit verification code to '+secondaryEmail+'…';
 syncOtpControls();
 try{
   const {data,error}=await supabase.functions.invoke('teacher-secondary-email-otp',{body:{action:'send',secondary_email:secondaryEmail}});
   if(error||!data?.ok)throw new Error(data?.error||error?.message||'Could not send the verification code.');
   adminVerificationRequestId=data.request_id||'';
   if(!adminVerificationRequestId)throw new Error('Verification request was not created.');
   pendingAdminConfirmation=true;
   lastAdminOtpSecondaryEmail=secondaryEmail;
   if(adminOtpStatus)adminOtpStatus.textContent='Code sent to '+secondaryEmail+'. Enter it below to unlock Register Teacher.';
   adminOtpInput?.focus();
   return true
 }catch(error){
   adminVerificationRequestId='';
   if(adminOtpStatus)adminOtpStatus.textContent=error?.message||'Could not send the verification code.';
   throw error
 }finally{adminOtpSending=false;syncOtpControls()}
}
async function maybeAutoSendAdminOtp(){
 if(id)return;
 const mode=form.querySelector('input[name="email_confirmation_mode"]:checked')?.value||'AUTO';
 const secondaryEmail=String(form.elements.secondary_email?.value||'').trim().toLowerCase();
 if(mode!=='ADMIN'||!secondaryEmail||!secondaryEmail.includes('@')){syncOtpControls();return}
 if(pendingAdminConfirmation||principalVerified||adminOtpSending||lastAdminOtpSecondaryEmail===secondaryEmail)return;
 resetPrincipalVerification();
 lastAdminOtpSecondaryEmail=secondaryEmail;
 syncOtpControls();
 try{await sendAdminConfirmationCode()}catch(error){lastAdminOtpSecondaryEmail='';console.error(error)}
}
async function verifyAdminConfirmationCode(){
 if(!pendingAdminConfirmation||!adminVerificationRequestId)throw new Error('A verification code has not been sent yet.');
 const code=String(adminOtpInput?.value||'').trim();
 if(!/^\\d{6}$/.test(code))throw new Error('Enter the 6-digit verification code.');
 if(adminOtpStatus)adminOtpStatus.textContent='Verifying email code…';
 if(adminOtpVerify)adminOtpVerify.disabled=true;
 try{
   const {data,error}=await supabase.functions.invoke('teacher-secondary-email-otp',{body:{action:'verify',request_id:adminVerificationRequestId,code}});
   if(error||!data?.verified)throw new Error(data?.error||error?.message||'That verification code is invalid or expired.');
   principalVerified=true;
   pendingAdminConfirmation=false;
   if(adminOtpStatus)adminOtpStatus.textContent='Secondary email verified successfully. Register Teacher is now unlocked.';
   toast('Secondary email verified successfully.');
 }catch(error){
   principalVerified=false;
   if(adminOtpStatus)adminOtpStatus.textContent=error?.message||'Verification failed.';
   throw error
 }finally{syncOtpControls()}
}
adminOtpSend?.addEventListener('click',async()=>{
 try{
   resetPrincipalVerification();
   lastAdminOtpSecondaryEmail='';
   await sendAdminConfirmationCode()
 }catch(e){console.error(e);toast(e.message||'Could not send the verification code.','error')}
})
adminOtpVerify?.addEventListener('click',async()=>{
 try{await verifyAdminConfirmationCode()}catch(e){console.error(e);toast(e.message||'Could not verify the code.','error')}
})
form.querySelectorAll('input[name="email_confirmation_mode"]').forEach(r=>r.addEventListener('change',()=>{
 resetPrincipalVerification();
 lastAdminOtpSecondaryEmail='';
 syncOtpControls();
 if(r.checked&&r.value==='ADMIN')setTimeout(()=>maybeAutoSendAdminOtp(),0)
}))

form.onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#save-teacher');setLoading(btn,true,id?'Saving…':'Registering…');let newPhoto=null;try{const payload={staff_id:form.elements.staff_id.value.trim(),full_name:form.elements.full_name.value.trim(),school_email:form.elements.school_email.value.trim().toLowerCase(),email:form.elements.school_email.value.trim().toLowerCase(),secondary_email:form.elements.secondary_email.value.trim().toLowerCase()||null,email_confirmation_mode:form.querySelector('input[name="email_confirmation_mode"]:checked')?.value||'AUTO',email_confirmed:id?undefined:false,phone:form.elements.phone.value.trim()||null,is_active:form.querySelector('input[name="is_active"]:checked')?.value==='true'};if(!payload.staff_id||!payload.full_name||!payload.school_email||!payload.secondary_email)throw new Error('Staff ID, full name, school email and secondary email are required.'); delete payload.email_confirmed;if(!id)payload.onboarding_status='PENDING';let res;if(teacherId)res=await supabase.from('teachers').update(payload).eq('id',teacherId).select('id').maybeSingle();else res=await supabase.from('teachers').insert(payload).select('id').single();if(res.error)throw res.error;teacherId=res.data?.id||teacherId;const mode=payload.email_confirmation_mode;if(!id&&mode==='ADMIN'&&(!principalVerified||!adminVerificationRequestId))throw new Error('Please verify the secondary email code before registering this teacher.');const provision=await supabase.functions.invoke('teacher-provision-account',{body:{teacher_id:teacherId,school_email:payload.school_email,secondary_email:payload.secondary_email,mode,verification_request_id:mode==='ADMIN'?adminVerificationRequestId:''}});if(provision.error||!provision.data?.ok)throw new Error(provision.data?.error||provision.error?.message||'Teacher account could not be prepared.');teacherEmailConfirmed=!!provision.data?.confirmed;pendingAdminConfirmation=false;newPhoto=await uploadPhoto();if(newPhoto&&newPhoto!==existingPhoto){const {error:pe}=await supabase.from('teachers').update({photo_url:newPhoto}).eq('id',teacherId);if(pe)throw pe}if(teacherId&&selectedAssignments.length>=0){const {error:de}=await supabase.from('class_subjects').delete().eq('teacher_id',teacherId);if(de)throw de;if(selectedAssignments.length){const rows=selectedAssignments.map(a=>({class_id:a.classId,subject_id:a.subjectId,teacher_id:teacherId}));const {error:ie}=await supabase.from('class_subjects').insert(rows);if(ie)throw ie}}if(mode==='ADMIN'){toast(id?'Teacher updated. Enter the principal verification code above to finish confirmation.':'Teacher registered. Enter the principal verification code above to finish confirmation.');return}toast(id?'Teacher updated and account settings refreshed.':'Teacher registered successfully.');location.href=`teacher-details.html?id=${encodeURIComponent(teacherId)}`;}catch(err){console.error(err);toast(err.message||'Could not save teacher.','error')}finally{setLoading(btn,false)}};
 form.elements.secondary_email?.addEventListener('input',()=>{if(!id){resetPrincipalVerification();lastAdminOtpSecondaryEmail=''}clearTimeout(window.__secondaryEmailTimer);window.__secondaryEmailTimer=setTimeout(()=>{maybeAutoSendAdminOtp().catch(e=>console.error(e))},600)});form.elements.full_name?.addEventListener('input',()=>{if(!id){resetPrincipalVerification();lastAdminOtpSecondaryEmail=''}clearTimeout(window.__teacherEmailTimer);window.__teacherEmailTimer=setTimeout(()=>generateSchoolEmail().catch(e=>console.error(e)),350)});try{await loadOptions();await loadTeacher();if(!id){await generateStaffId();generateSchoolEmail().catch(e=>console.error(e))}syncOtpControls()}catch(e){console.error(e);toast(e.message||'Could not load teacher registration data.','error')}
}
