<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register Teacher | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.teacher-form-page{max-width:1280px;margin:0 auto;animation:rise .45s ease}.teacher-form-hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:22px;padding:30px 32px;border-radius:24px;background:linear-gradient(135deg,#123d8f,#0a66c2);color:#fff;box-shadow:0 20px 50px rgba(18,61,143,.18)}.teacher-form-hero:before{content:"";position:absolute;width:290px;height:290px;border:42px solid rgba(244,196,0,.13);border-radius:50%;right:-120px;top:-160px}.teacher-form-hero>div,.teacher-form-hero>a{position:relative;z-index:1}.teacher-form-hero h2{margin:6px 0 8px;font-size:29px}.teacher-form-hero p{margin:0;max-width:650px;color:rgba(255,255,255,.82);font-size:12px;line-height:1.7}.teacher-form-hero .section-kicker{color:#ffdc48}.teacher-form-hero .btn{background:#f4c400;color:#14213d;white-space:nowrap}.teacher-form-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;margin-top:18px;align-items:start}.teacher-main-panel{padding:0;overflow:hidden}.form-section{padding:25px 26px;border-bottom:1px solid #edf0f4}.form-section:last-child{border-bottom:0}.form-section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.form-section-head h2{margin:4px 0 0;font-size:18px}.form-section-head p{margin:5px 0 0;color:var(--muted);font-size:10px;line-height:1.6}.section-number{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:#eaf1ff;color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:12px}.teacher-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.teacher-field{display:grid;gap:7px}.teacher-field.full{grid-column:1/-1}.teacher-field>label{font-size:10px;font-weight:800;color:#344054}.teacher-field input{width:100%;border:1px solid #dbe2ec;background:#fbfcff;border-radius:11px;padding:12px 13px;outline:0;color:var(--ink);font-size:12px;transition:.2s}.teacher-field input:focus{border-color:#0a66c2;background:#fff;box-shadow:0 0 0 4px rgba(10,102,194,.08)}.teacher-field small{font-size:9px;color:var(--muted)}.status-control{display:flex;gap:8px;flex-wrap:wrap}.status-option{position:relative}.status-option input{position:absolute;opacity:0}.status-option span{display:inline-flex;align-items:center;gap:7px;padding:10px 13px;border:1px solid #dbe2ec;border-radius:10px;background:#fbfcff;font-size:10px;font-weight:700;cursor:pointer;color:#475467}.status-option input:checked+span{border-color:#b7cff0;background:#edf5ff;color:var(--blue)}.status-dot{width:7px;height:7px;border-radius:50%;background:#12b76a}.status-dot.off{background:#98a2b3}.form-note{padding:12px 13px;border-radius:12px;background:#f8fbff;border:1px solid #dce9fb;color:#526078;font-size:10px;line-height:1.6}.assignment-builder{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.assignment-field{display:grid;gap:7px}.assignment-field label{font-size:10px;font-weight:800;color:#344054}.assignment-field select{width:100%;border:1px solid #dbe2ec;background:#fbfcff;border-radius:11px;padding:12px 13px;outline:0;color:var(--ink);font-size:11px}.assignment-field select:focus{border-color:#0a66c2;box-shadow:0 0 0 4px rgba(10,102,194,.08)}.assignment-add{height:42px}.assignment-list-form{display:grid;gap:9px;margin-top:14px}.assignment-empty{padding:22px;border:1px dashed #d6deea;border-radius:13px;text-align:center;color:#8a95a5;background:#fbfcff;font-size:10px}.assignment-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 13px;border:1px solid #e7ebf1;border-radius:13px;background:#fff}.assignment-main{display:flex;align-items:center;gap:11px;min-width:0}.assignment-icon{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:#eef4ff;color:var(--blue);display:grid;place-items:center}.assignment-copy{min-width:0}.assignment-copy strong{display:block;font-size:11px}.assignment-copy small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.remove-assignment{border:0;background:#fff3f3;color:#c62828;border-radius:9px;padding:8px 10px;font-size:9px;font-weight:800;cursor:pointer}.teacher-form-actions{display:flex;justify-content:flex-end;gap:10px;padding:22px 26px;background:#fbfcfe}.teacher-form-actions .btn{min-width:145px;text-align:center}.teacher-photo-panel{position:sticky;top:106px}.photo-preview-shell{padding:18px;border:1px solid #e5eaf2;border-radius:18px;background:#f7faff}.teacher-photo-preview{width:170px;height:200px;margin:0 auto 16px;border-radius:18px;overflow:hidden;background:#eaf1ff;border:4px solid #fff;box-shadow:0 14px 30px rgba(19,43,88,.12);display:grid;place-items:center;color:#0b5ed7;font-size:42px;font-weight:800}.teacher-photo-preview img{width:100%;height:100%;object-fit:cover}.photo-meta{text-align:center}.photo-meta strong{display:block;font-size:12px}.photo-meta small{display:block;color:var(--muted);font-size:9px;line-height:1.6;margin-top:4px}.upload-box{display:block;margin-top:14px;border:1px dashed #b9c9e3;background:#fff;border-radius:12px;padding:13px;text-align:center;cursor:pointer}.upload-box input{display:none}.upload-box strong{display:block;font-size:11px;color:var(--blue)}.upload-box small{display:block;color:var(--muted);margin-top:4px;font-size:9px}@media(max-width:1050px){.teacher-form-grid{grid-template-columns:1fr}.teacher-photo-panel{position:static}}@media(max-width:800px){.teacher-form-hero{align-items:flex-start;flex-direction:column;padding:24px}.teacher-form-hero h2{font-size:24px}.teacher-form-hero .btn{width:100%;text-align:center}.teacher-fields{grid-template-columns:1fr}.teacher-field.full{grid-column:auto}.assignment-builder{grid-template-columns:1fr}.assignment-add{width:100%}.form-section{padding:21px 18px}.teacher-form-actions{padding:18px;flex-direction:column}.teacher-form-actions .btn{width:100%}.teacher-photo-panel .photo-preview-shell{display:block}}
</style>
</head>
<body data-title="Register Teacher">
<div id="app-shell" data-content="<div class='teacher-form-page'><div class='loading-inline'>Loading…</div></div>"></div><div id="toast-host"></div>
<script type="module">
import {requireAdmin,mountShell,supabase,escapeHtml,pageLoading,setLoading,toast} from './assets/app.js';
const user=await requireAdmin();
if(user){
 mountShell(user);pageLoading(false);
 const root=document.querySelector('.teacher-form-page');
 const id=new URLSearchParams(location.search).get('id');
 root.innerHTML=`<div class="teacher-form-hero"><div><span class="section-kicker" style="color:#f8d84b">STAFF MANAGEMENT</span><h2>${id?'Edit Teacher':'Register New Teacher'}</h2><p>${id?'Update the teacher profile and teaching assignments.':'Create a complete teacher profile, upload a photo and assign classes and subjects.'}</p></div><a class="btn" href="teachers.html">← Back to Teachers</a></div><div class="teacher-form-grid"><section class="panel teacher-main-panel"><form id="teacher-form"><div class="form-section"><div class="form-section-head"><div><span class="section-kicker">01 · PROFILE</span><h2>Teacher information</h2><p>Enter the staff member’s core contact and account information.</p></div><div class="section-number">01</div></div><div class="teacher-fields"><div class="teacher-field"><label>Staff ID *</label><input name="staff_id" required placeholder="e.g. TCH-001"><small>School staff identification number.</small></div><div class="teacher-field"><label>Full Name *</label><input name="full_name" required placeholder="Teacher full name"></div><div class="teacher-field"><label>Email Address</label><input name="email" type="email" placeholder="teacher@school.edu"></div><div class="teacher-field"><label>Phone Number</label><input name="phone" type="tel" placeholder="080…"></div><div class="teacher-field full"><label>Employment Status</label><div class="status-control"><label class="status-option"><input name="is_active" type="radio" value="true" checked><span><i class="status-dot"></i> Active</span></label><label class="status-option"><input name="is_active" type="radio" value="false"><span><i class="status-dot off"></i> Inactive</span></label></div></div></div></div><div class="form-section"><div class="form-section-head"><div><span class="section-kicker">02 · ASSIGNMENTS</span><h2>Teaching assignments</h2><p>Choose the classes and subjects this teacher is responsible for.</p></div><div class="section-number">02</div></div><div class="form-note" style="margin-bottom:14px">Add every class and subject combination handled by this teacher.</div><div class="assignment-builder"><div class="assignment-field"><label>Class</label><select id="assignment-class"><option value="">Select class…</option></select></div><div class="assignment-field"><label>Subject</label><select id="assignment-subject"><option value="">Select subject…</option></select></div><button type="button" class="btn btn-primary assignment-add" id="add-assignment">+ Add Assignment</button></div><div id="assignment-list" class="assignment-list-form"><div class="assignment-empty">No assignments added yet.</div></div></div><div class="form-section"><div class="form-section-head"><div><span class="section-kicker">03 · REVIEW</span><h2>Before you save</h2><p>Check the information above before submitting.</p></div><div class="section-number">03</div></div><div class="form-note">Staff ID and full name are required. A profile photo is optional.</div></div><div class="teacher-form-actions"><a class="btn btn-ghost" href="teachers.html">Cancel</a><button class="btn btn-primary" id="save-teacher" type="submit">${id?'Save Changes':'Register Teacher'}</button></div></form></section><aside class="panel teacher-photo-panel"><div class="panel-head"><div><span class="section-kicker">PROFILE PHOTO</span><h2>Teacher Photo</h2></div></div><div class="photo-preview-shell"><div id="photo-preview" class="teacher-photo-preview">T</div><div class="photo-meta"><strong>Professional profile photo</strong><small>Use a clear passport-style image facing the camera.</small></div><label class="upload-box"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><strong>Upload photo</strong><small>JPG, PNG or WebP · Maximum 5 MB</small></label><div id="photo-status" class="form-note" style="margin-top:12px">A clear professional photo is recommended.</div></div></aside></div>`;
 const form=document.querySelector('#teacher-form'),photoInput=document.querySelector('#photo'),preview=document.querySelector('#photo-preview'),status=document.querySelector('#photo-status');
 const classSelect=document.querySelector('#assignment-class'),subjectSelect=document.querySelector('#assignment-subject'),assignmentList=document.querySelector('#assignment-list');
 let teacherId=id,existingPhoto='',selectedAssignments=[];
 function initials(name){return (name||'Teacher').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'T'}
 function renderAssignments(){if(!selectedAssignments.length){assignmentList.innerHTML='<div class="assignment-empty">No assignments added yet.</div>';return}assignmentList.innerHTML=selectedAssignments.map((a,i)=>`<div class="assignment-row"><div><strong>${escapeHtml(a.className)}</strong><small>${escapeHtml(a.level||'')} · ${escapeHtml(a.subjectName)}${a.subjectCode?' · '+escapeHtml(a.subjectCode):''}</small></div><button type="button" class="remove-assignment" data-index="${i}">Remove</button></div>`).join('');assignmentList.querySelectorAll('.remove-assignment').forEach(b=>b.onclick=()=>{selectedAssignments.splice(Number(b.dataset.index),1);renderAssignments()})}
 async function loadOptions(){const [{data:classes,error:ce},{data:subjects,error:se}]=await Promise.all([supabase.from('classes').select('id,name,level').order('name'),supabase.from('subjects').select('id,name,code').eq('is_active',true).order('name')]);if(ce)throw ce;if(se)throw se;classSelect.innerHTML='<option value="">Select class…</option>'+(classes||[]).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.level?' — '+escapeHtml(x.level):''}</option>`).join('');subjectSelect.innerHTML='<option value="">Select subject…</option>'+(subjects||[]).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.code?' — '+escapeHtml(x.code):''}</option>`).join('');}
 async function loadTeacher(){if(!id)return;const {data:t,error}=await supabase.from('teachers').select('id,staff_id,full_name,email,phone,photo_url,is_active').eq('id',id).maybeSingle();if(error)throw error;if(!t)throw new Error('Teacher record not found.');teacherId=t.id;existingPhoto=t.photo_url||'';for(const k of ['staff_id','full_name','email','phone'])form.elements[k].value=t[k]||'';form.querySelectorAll('input[name="is_active"]').forEach(r=>r.checked=r.value===String(t.is_active));preview.textContent=initials(t.full_name);if(existingPhoto){try{const {data}=await supabase.storage.from('teacher-photos').createSignedUrl(existingPhoto,3600);if(data?.signedUrl)preview.innerHTML=`<img src="${escapeHtml(data.signedUrl)}" alt="Teacher photo">`;status.textContent='Existing photo loaded. Upload a new photo to replace it.'}catch{}}const {data:as,error:ae}=await supabase.from('class_subjects').select('id,class_id,subject_id,classes(name,level),subjects(name,code)').eq('teacher_id',id);if(ae)throw ae;selectedAssignments=(as||[]).map(a=>({existingId:a.id,classId:a.class_id,subjectId:a.subject_id,className:a.classes?.name||'Class',level:a.classes?.level||'',subjectName:a.subjects?.name||'Subject',subjectCode:a.subjects?.code||''}));renderAssignments()}
 photoInput.onchange=()=>{const file=photoInput.files?.[0];if(!file)return;if(file.size>5*1024*1024){photoInput.value='';toast('Photo must be 5 MB or smaller.','error');return}if(!file.type.startsWith('image/')){photoInput.value='';toast('Please choose a JPG, PNG or WebP image.','error');return}const url=URL.createObjectURL(file);preview.innerHTML=`<img src="${url}" alt="Teacher photo preview">`;status.textContent='New photo selected. It will be uploaded when you save.'};
 document.querySelector('#add-assignment').onclick=()=>{const c=classSelect.options[classSelect.selectedIndex],s=subjectSelect.options[subjectSelect.selectedIndex];if(!classSelect.value||!subjectSelect.value){toast('Select both a class and subject.','error');return}if(selectedAssignments.some(a=>a.classId===classSelect.value&&a.subjectId===subjectSelect.value)){toast('That class and subject assignment already exists.','error');return}selectedAssignments.push({classId:classSelect.value,subjectId:subjectSelect.value,className:c.text.split(' — ')[0],level:'',subjectName:s.text.split(' — ')[0],subjectCode:s.text.includes(' — ')?s.text.split(' — ').slice(1).join(' — '):''});renderAssignments();classSelect.value='';subjectSelect.value=''};
 async function uploadPhoto(){const file=photoInput.files?.[0];if(!file)return existingPhoto||null;const ext=file.name.split('.').pop().toLowerCase();const path=`${teacherId||crypto.randomUUID()}/${Date.now()}.${ext}`;const {error}=await supabase.storage.from('teacher-photos').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return path}
 form.onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#save-teacher');setLoading(btn,true,id?'Saving…':'Registering…');let newPhoto=null;try{const payload={staff_id:form.elements.staff_id.value.trim(),full_name:form.elements.full_name.value.trim(),email:form.elements.email.value.trim()||null,phone:form.elements.phone.value.trim()||null,is_active:form.querySelector('input[name="is_active"]:checked')?.value==='true'};if(!payload.staff_id||!payload.full_name)throw new Error('Staff ID and full name are required.');let res;if(teacherId)res=await supabase.from('teachers').update(payload).eq('id',teacherId).select('id').maybeSingle();else res=await supabase.from('teachers').insert(payload).select('id').single();if(res.error)throw res.error;teacherId=res.data?.id||teacherId;newPhoto=await uploadPhoto();if(newPhoto&&newPhoto!==existingPhoto){const {error:pe}=await supabase.from('teachers').update({photo_url:newPhoto}).eq('id',teacherId);if(pe)throw pe}if(teacherId&&selectedAssignments.length>=0){const {error:de}=await supabase.from('class_subjects').delete().eq('teacher_id',teacherId);if(de)throw de;if(selectedAssignments.length){const rows=selectedAssignments.map(a=>({class_id:a.classId,subject_id:a.subjectId,teacher_id:teacherId}));const {error:ie}=await supabase.from('class_subjects').insert(rows);if(ie)throw ie}}toast(id?'Teacher updated successfully.':'Teacher registered successfully.');location.href=`teacher-details.html?id=${encodeURIComponent(teacherId)}`;}catch(err){console.error(err);toast(err.message||'Could not save teacher.','error')}finally{setLoading(btn,false)}};
 try{await loadOptions();await loadTeacher()}catch(e){console.error(e);toast('Could not load teacher registration data.','error')}
}
</script>
</body></html>
