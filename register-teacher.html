import {requireAdmin,mountShell,supabase,escapeHtml,pageLoading,setLoading,toast} from './assets/app.js';
const user=await requireAdmin();
if(user){
 mountShell(user);pageLoading(false);
 const root=document.querySelector('.teacher-form-page');
 const id=new URLSearchParams(location.search).get('id');
 root.innerHTML=`<div class="teacher-form-hero"><div><span class="section-kicker" style="color:#f8d84b">STAFF MANAGEMENT</span><h2>${id?'Edit Teacher':'Register New Teacher'}</h2><p>${id?'Update the teacher profile and teaching assignments.':'Create a complete teacher profile, upload a photo and assign classes and subjects.'}</p></div><a class="btn" href="teachers.html">← Back to Teachers</a></div><div class="teacher-form-grid"><section class="panel teacher-main-panel"><form id="teacher-form"><div class="form-section"><div class="form-section-head"><div><span class="section-kicker">01 · PROFILE</span><h2>Teacher information</h2><p>Enter the staff member’s core contact and account information.</p></div><div class="section-number">01</div></div><div class="teacher-fields"><div class="teacher-field"><label>Staff ID *</label><div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center"><input name="staff_id" required readonly placeholder="Generating…"><button type="button" class="btn btn-ghost" id="regenerate-staff-id" title="Generate another Staff ID" aria-label="Generate another Staff ID" style="width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:11px;color:#0a66c2;border:1px solid #cbd8ea;background:#f7faff"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M20 11a8 8 0 0 0-14.5-4.7L4 8"></path><path d="M4 4v4h4M4 13a8 8 0 0 0 14.5 4.7L20 16"></path><path d="M20 20v-4h-4"></path></svg></button></div><small id="staff-id-help">A unique staff ID is generated automatically. Use the regenerate icon to choose another one.</small><span id="staff-id-status" style="display:none">Auto-generated</span></div><div class="teacher-field"><label>Full Name *</label><input name="full_name" required placeholder="Teacher full name"></div><div class="teacher-field"><label>School Email Address *</label><input name="school_email" type="email" required readonly placeholder="Generating school email…"><small>This is the teacher's first school email. It is generated from the teacher's name.</small></div>
<div class="teacher-field"><label>Secondary / Personal Email</label><input name="secondary_email" type="email" placeholder="teacher@gmail.com"><small>Optional second email address for receiving account details and confirmation.</small></div>
<div class="teacher-field full"><label>Email Confirmation</label><div class="status-control" id="email-confirmation-modes">
<label class="status-option"><input name="email_confirmation_mode" type="radio" value="ADMIN"><span><i class="status-dot"></i> Confirm by me</span></label>
<label class="status-option"><input name="email_confirmation_mode" type="radio" value="AUTO" checked><span><i class="status-dot"></i> Auto confirm</span></label>
<label class="status-option"><input name="email_confirmation_mode" type="radio" value="TEACHER"><span><i class="status-dot"></i> Confirm by teacher</span></label>
</div><small id="email-confirm-help">You control this per teacher. For teacher confirmation, a code is sent by email before dashboard access.</small></div><div class="teacher-field"><label>Phone Number</label><input name="phone" type="tel" placeholder="080…"></div><div class="teacher-field full"><label>Employment Status</label><div class="status-control"><label class="status-option"><input name="is_active" type="radio" value="true" checked><span><i class="status-dot"></i> Active</span></label><label class="status-option"><input name="is_active" type="radio" value="false"><span><i class="status-dot off"></i> Inactive</span></label></div></div></div></div><div class="form-section"><div class="form-section-head"><div><span class="section-kicker">02 · ASSIGNMENTS</span><h2>Teaching assignments</h2><p>Choose the classes and subjects this teacher is responsible for.</p></div><div class="section-number">02</div></div><div class="form-note" style="margin-bottom:14px">Add every class and subject combination handled by this teacher.</div><div class="assignment-builder"><div class="assignment-field"><label>Class</label><select id="assignment-class"><option value="">Select class…</option></select></div><div class="assignment-field"><label>Subject</label><select id="assignment-subject"><option value="">Select subject…</option></select></div><button type="button" class="btn btn-primary assignment-add" id="add-assignment">+ Add Assignment</button></div><div id="assignment-list" class="assignment-list-form"><div class="assignment-empty">No assignments added yet.</div></div></div><div class="form-section"><div class="form-section-head"><div><span class="section-kicker">03 · REVIEW</span><h2>Before you save</h2><p>Check the information above before submitting.</p></div><div class="section-number">03</div></div><div class="form-note">Staff ID, full name and school email are required. "Confirm by teacher" is completed from the teacher login page. "Confirm by me" opens a principal verification code box here. "Auto confirm" completes confirmation immediately.</div><div class="teacher-field"><label>School Email Address *</label><input name="school_email" type="email" required readonly placeholder="Generating school email…"><small>This is the teacher's first school email. It is generated from the teacher's name.</small></div>
<div id="admin-otp-panel" style="display:none;margin-top:12px;padding:16px;border:1px solid #dbe5f2;border-radius:14px;background:#f8fbff"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px"><div><strong style="font-size:12px;color:#12365a">PRINCIPAL VERIFICATION</strong><div style="font-size:11px;color:#66758a;margin-top:4px">A 6-digit code will be sent automatically to the signed-in principal email.</div></div><span id="admin-otp-badge" style="display:none;font-size:10px;font-weight:800;padding:6px 9px;border-radius:999px;background:#e9f8ef;color:#177245">Verified</span></div><div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px"><input id="admin-confirmation-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code" style="font-size:16px;letter-spacing:3px;text-align:center"><button type="button" class="btn btn-primary" id="verify-admin-otp" disabled>Verify code</button></div><button type="button" class="btn btn-ghost" id="send-admin-otp" style="margin-top:10px;width:fit-content">↻ Send code again</button><div id="admin-otp-status" style="margin-top:10px;font-size:11px;color:#5f6f83"></div></div>
<div class="teacher-field"><label>Secondary / Personal Email</label><input name="secondary_email" type="email" placeholder="teacher@gmail.com"><small>Optional second email address for receiving account details and confirmation.</small></div>
<div class="teacher-field full"><label>Email Confirmation</label><div class="status-control" id="email-confirmation-modes">
<label class="status-option"><input name="email_confirmation_mode" type="radio" value="ADMIN"><span><i class="status-dot"></i> Confirm by me</span></label>
<label class="status-option"><input name="email_confirmation_mode" type="radio" value="AUTO" checked><span><i class="status-dot"></i> Auto confirm</span></label>
<label class="status-option"><input name="email_confirmation_mode" type="radio" value="TEACHER"><span><i class="status-dot"></i> Confirm by teacher</span></label>
</div><small id="email-confirm-help">You control this per teacher. For teacher confirmation, a code is sent by email before dashboard access.</small></div><div class="teacher-field"><label>Phone Number</label><input name="phone" type="tel" placeholder="080…"></div><div class="teacher-field full"><label>Employment Status</label><div class="status-control"><label class="status-option"><input name="is_active" type="radio" value="true" checked><span><i class="status-dot"></i> Active</span></label><label class="status-option"><input name="is_active" type="radio" value="false"><span><i class="status-dot off"></i> Inactive</span></label></div></div></div></div><div class="form-section"><div class="form-section-head"><div><span class="section-kicker">02 · ASSIGNMENTS</span><h2>Teaching assignments</h2><p>Choose the classes and subjects this teacher is responsible for.</p></div><div class="section-number">02</div></div><div class="form-note" style="margin-bottom:14px">Add every class and subject combination handled by this teacher.</div><div class="assignment-builder"><div class="assignment-field"><label>Class</label><select id="assignment-class"><option value="">Select class…</option></select></div><div class="assignment-field"><label>Subject</label><select id="assignment-subject"><option value="">Select subject…</option></select></div><button type="button" class="btn btn-primary assignment-add" id="add-assignment">+ Add Assignment</button></div><div id="assignment-list" class="assignment-list-form"><div class="assignment-empty">No assignments added yet.</div></div></div><div class="form-section"><div class="form-section-head"><div><span class="section-kicker">03 · REVIEW</span><h2>Before you save</h2><p>Check the information above before submitting.</p></div><div class="section-number">03</div></div><div class="form-note">Staff ID, full name and school email are required. "Confirm by teacher" is completed from the teacher login page. "Confirm by me" opens a principal verification code box here. "Auto confirm" completes confirmation immediately.</div><div class="teacher-form-actions"><a class="btn btn-ghost" href="teachers.html">Cancel</a><button class="btn btn-primary" id="save-teacher" type="submit">${id?'Save Changes':'Register Teacher'}</button></div></form></section><aside class="panel teacher-photo-panel"><div class="panel-head"><div><span class="section-kicker">PROFILE PHOTO</span><h2>Teacher Photo</h2></div></div><div class="photo-preview-shell"><div id="photo-preview" class="teacher-photo-preview">T</div><div class="photo-meta"><strong>Professional profile photo</strong><small>Use a clear passport-style image facing the camera.</small></div><label class="upload-box"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><strong>Upload photo</strong><small>JPG, PNG or WebP · Maximum 5 MB</small></label><div id="photo-status" class="form-note" style="margin-top:12px">A clear professional photo is recommended.</div></div></aside></div>`;
 const form=document.querySelector('#teacher-form'),photoInput=document.querySelector('#photo'),preview=document.querySelector('#photo-preview'),status=document.querySelector('#photo-status');
 const classSelect=document.querySelector('#assignment-class'),subjectSelect=document.querySelector('#assignment-subject'),assignmentList=document.querySelector('#assignment-list');
 let teacherId=id,existingPhoto='',selectedAssignments=[];let generatedStaffId='';let generatedSchoolEmail='';let teacherEmailConfirmed=false;let pendingAdminConfirmation=false;const adminOtpPanel=document.querySelector('#admin-otp-panel'),adminOtpStatus=document.querySelector('#admin-otp-status'),adminOtpInput=document.querySelector('#admin-confirmation-code'),adminOtpVerify=document.querySelector('#verify-admin-otp'),adminOtpSend=document.querySelector('#send-admin-otp');
 function initials(name){return (name||'Teacher').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'T'}
 function renderAssignments(){if(!selectedAssignments.length){assignmentList.innerHTML='<div class="assignment-empty">No assignments added yet.</div>';return}assignmentList.innerHTML=selectedAssignments.map((a,i)=>`<div class="assignment-row"><div><strong>${escapeHtml(a.className)}</strong><small>${escapeHtml(a.level||'')} · ${escapeHtml(a.subjectName)}${a.subjectCode?' · '+escapeHtml(a.subjectCode):''}</small></div><button type="button" class="remove-assignment" data-index="${i}">Remove</button></div>`).join('');assignmentList.querySelectorAll('.remove-assignment').forEach(b=>b.onclick=()=>{selectedAssignments.splice(Number(b.dataset.index),1);renderAssignments();if(t.email_confirmation_mode)form.querySelectorAll('input[name="email_confirmation_mode"]').forEach(r=>r.checked=r.value===t.email_confirmation_mode)})}
 function slugName(name){return String(name||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9\\s]/g,'').trim().split(/\\s+/).filter(Boolean)}
async function generateSchoolEmail(){
 if(id)return;
 const input=form.elements.school_email, name=form.elements.full_name?.value||'';
 const parts=slugName(name);
 if(!input)return;
 if(parts.length<1){input.value='';input.placeholder='Enter full name first…';return}
 const prefix=(parts.length===1?parts[0]:parts[0]+parts[parts.length-1]).slice(0,28);
 let candidate=prefix+'@laffbritishmontesorrischool.com';
 const {data,error}=await supabase.from('teachers').select('id').eq('school_email',candidate).maybeSingle();
 if(error)throw error;
 if(data){
   for(let i=2;i<=99;i++){
     const x=prefix+i+'@laffbritishmontesorrischool.com';
     const {data:d,error:e}=await supabase.from('teachers').select('id').eq('school_email',x).maybeSingle();
     if(e)throw e;if(!d){candidate=x;break}
   }
 }
 generatedSchoolEmail=candidate;input.value=candidate;input.placeholder='Generating school email…';
}
async function loadOptions(){const [{data:classes,error:ce},{data:subjects,error:se}]=await Promise.all([supabase.from('classes').select('id,name,level').order('name'),supabase.from('subjects').select('id,name,code').eq('is_active',true).order('name')]);if(ce)throw ce;if(se)throw se;classSelect.innerHTML='<option value="">Select class…</option>'+(classes||[]).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.level?' — '+escapeHtml(x.level):''}</option>`).join('');subjectSelect.innerHTML='<option value="">Select subject…</option>'+(subjects||[]).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.code?' — '+escapeHtml(x.code):''}</option>`).join('');}
 async function generateStaffId(){if(id)return;const input=form.elements.staff_id;const help=document.querySelector('#staff-id-help'),badge=document.querySelector('#staff-id-status'),regen=document.querySelector('#regenerate-staff-id');if(!input)return;input.value='';input.placeholder='Generating…';input.disabled=true;if(regen)regen.disabled=true;if(help)help.textContent='Generating a unique staff ID…';if(badge)badge.textContent='Generating…';try{for(let i=0;i<12;i++){const code='TCH-'+String(Math.floor(100000+Math.random()*900000));const {data,error}=await supabase.from('teachers').select('id').eq('staff_id',code).maybeSingle();if(error)throw error;if(!data){generatedStaffId=code;input.value=code;if(help)help.textContent='This staff ID is generated automatically. Tap the regenerate icon to choose another.';if(badge)badge.textContent='Ready';input.disabled=false;if(regen)regen.disabled=false;return}}throw new Error('Could not generate a unique staff ID. Please try again.')}catch(e){input.disabled=false;if(regen)regen.disabled=false;if(badge)badge.textContent='Retry';if(help)help.textContent='Staff ID could not be generated automatically.';throw e}}
 async function loadTeacher(){if(!id)return;const {data:t,error}=await supabase.from('teachers').select('id,staff_id,full_name,email,school_email,secondary_email,email_confirmation_mode,email_confirmed,email_confirmation_expires_at,phone,photo_url,is_active').eq('id',id).maybeSingle();if(error)throw error;if(!t)throw new Error('Teacher record not found.');teacherId=t.id;existingPhoto=t.photo_url||'';for(const k of ['staff_id','full_name','phone'])form.elements[k].value=t[k]||'';form.elements.school_email.value=t.school_email||t.email||'';form.elements.school_email.readOnly=true;form.elements.secondary_email.value=t.secondary_email||'';teacherEmailConfirmed=!!t.email_confirmed;form.querySelectorAll('input[name="is_active"]').forEach(r=>r.checked=r.value===String(t.is_active));preview.textContent=initials(t.full_name);if(existingPhoto){try{const {data}=await supabase.storage.from('teacher-photos').createSignedUrl(existingPhoto,3600);if(data?.signedUrl)preview.innerHTML=`<img src="${escapeHtml(data.signedUrl)}" alt="Teacher photo">`;status.textContent='Existing photo loaded. Upload a new photo to replace it.'}catch{}}const {data:as,error:ae}=await supabase.from('class_subjects').select('id,class_id,subject_id,classes(name,level),subjects(name,code)').eq('teacher_id',id);if(ae)throw ae;selectedAssignments=(as||[]).map(a=>({existingId:a.id,classId:a.class_id,subjectId:a.subject_id,className:a.classes?.name||'Class',level:a.classes?.level||'',subjectName:a.subjects?.name||'Subject',subjectCode:a.subjects?.code||''}));renderAssignments()}
 photoInput.onchange=()=>{const file=photoInput.files?.[0];if(!file)return;if(file.size>5*1024*1024){photoInput.value='';toast('Photo must be 5 MB or smaller.','error');return}if(!file.type.startsWith('image/')){photoInput.value='';toast('Please choose a JPG, PNG or WebP image.','error');return}const url=URL.createObjectURL(file);preview.innerHTML=`<img src="${url}" alt="Teacher photo preview">`;status.textContent='New photo selected. It will be uploaded when you save.'};
 document.querySelector('#add-assignment').onclick=()=>{const c=classSelect.options[classSelect.selectedIndex],s=subjectSelect.options[subjectSelect.selectedIndex];if(!classSelect.value||!subjectSelect.value){toast('Select both a class and subject.','error');return}if(selectedAssignments.some(a=>a.classId===classSelect.value&&a.subjectId===subjectSelect.value)){toast('That class and subject assignment already exists.','error');return}selectedAssignments.push({classId:classSelect.value,subjectId:subjectSelect.value,className:c.text.split(' — ')[0],level:'',subjectName:s.text.split(' — ')[0],subjectCode:s.text.includes(' — ')?s.text.split(' — ').slice(1).join(' — '):''});renderAssignments();classSelect.value='';subjectSelect.value=''};
 async function uploadPhoto(){const file=photoInput.files?.[0];if(!file)return existingPhoto||null;const ext=file.name.split('.').pop().toLowerCase();const path=`${teacherId||crypto.randomUUID()}/${Date.now()}.${ext}`;const {error}=await supabase.storage.from('teacher-photos').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return path}
 function syncOtpControls(){const mode=form.querySelector('input[name="email_confirmation_mode"]:checked')?.value||'AUTO';const isAdminMode=mode==='ADMIN';if(adminOtpPanel)adminOtpPanel.style.display=isAdminMode?'block':'none';if(adminOtpVerify)adminOtpVerify.disabled=!teacherId||!pendingAdminConfirmation;if(adminOtpSend)adminOtpSend.disabled=!teacherId;if(adminOtpStatus&&isAdminMode&&!teacherId)adminOtpStatus.textContent='Save the teacher first. The code will then be sent to the signed-in principal email.';else if(adminOtpStatus&&isAdminMode&&!pendingAdminConfirmation&&teacherId&&!teacherEmailConfirmed)adminOtpStatus.textContent='Ready for principal confirmation. Send the code below.'}
async function getPrincipalEmail(){const {data,error}=await supabase.auth.getUser();if(error)throw error;const email=String(data?.user?.email||'').trim().toLowerCase();if(!email)throw new Error('The signed-in principal account does not have an email address.');return email}
async function sendAdminConfirmationCode(){if(!teacherId)throw new Error('Save the teacher first before requesting principal confirmation.');const email=await getPrincipalEmail();if(adminOtpStatus)adminOtpStatus.textContent='Sending a 6-digit verification code to '+email+'…';if(adminOtpSend)adminOtpSend.disabled=true;try{const {error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)throw error;pendingAdminConfirmation=true;if(adminOtpStatus)adminOtpStatus.textContent='Code sent to '+email+'. Enter it above to confirm this teacher.';if(adminOtpPanel)adminOtpPanel.style.display='block';adminOtpInput?.focus();return true}finally{if(adminOtpSend)adminOtpSend.disabled=false;syncOtpControls()}}
async function verifyAdminConfirmationCode(){if(!teacherId)throw new Error('Save the teacher first.');const code=String(adminOtpInput?.value||'').trim();if(!/^\\d{6}$/.test(code))throw new Error('Enter the 6-digit principal verification code.');const email=await getPrincipalEmail();if(adminOtpVerify)adminOtpVerify.disabled=true;if(adminOtpStatus)adminOtpStatus.textContent='Verifying principal code…';try{const {data:verified,error}=await supabase.auth.verifyOtp({email,token:code,type:'email'});if(error||!verified?.user)throw new Error(error?.message||'That verification code is invalid or expired.');const confirmation=await supabase.functions.invoke('teacher-admin-confirm',{body:{teacher_id:teacherId}});if(confirmation.error||!confirmation.data?.ok)throw new Error(confirmation.data?.error||confirmation.error?.message||'Teacher confirmation could not be completed.');teacherEmailConfirmed=true;pendingAdminConfirmation=false;toast('Teacher confirmed by principal successfully.');location.href=`teacher-details.html?id=${encodeURIComponent(teacherId)}`;return true}finally{if(adminOtpVerify)adminOtpVerify.disabled=false;syncOtpControls()}}
adminOtpSend?.addEventListener('click',async()=>{try{await sendAdminConfirmationCode()}catch(e){console.error(e);toast(e.message||'Could not send the principal verification code.','error')}})
adminOtpVerify?.addEventListener('click',async()=>{try{await verifyAdminConfirmationCode()}catch(e){console.error(e);if(adminOtpStatus)adminOtpStatus.textContent=e.message||'Verification failed.';toast(e.message||'Could not confirm teacher.','error')}})
form.querySelectorAll('input[name="email_confirmation_mode"]').forEach(r=>r.addEventListener('change',()=>{pendingAdminConfirmation=false;syncOtpControls()}))
form.onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#save-teacher');setLoading(btn,true,id?'Saving…':'Registering…');let newPhoto=null;try{const payload={staff_id:form.elements.staff_id.value.trim(),full_name:form.elements.full_name.value.trim(),school_email:form.elements.school_email.value.trim().toLowerCase(),email:form.elements.school_email.value.trim().toLowerCase(),secondary_email:form.elements.secondary_email.value.trim().toLowerCase()||null,email_confirmation_mode:form.querySelector('input[name="email_confirmation_mode"]:checked')?.value||'AUTO',email_confirmed:id?undefined:false,phone:form.elements.phone.value.trim()||null,is_active:form.querySelector('input[name="is_active"]:checked')?.value==='true'};if(!payload.staff_id||!payload.full_name||!payload.school_email)throw new Error('Staff ID, full name and school email are required.'); delete payload.email_confirmed;if(!id)payload.onboarding_status='PENDING';let res;if(teacherId)res=await supabase.from('teachers').update(payload).eq('id',teacherId).select('id').maybeSingle();else res=await supabase.from('teachers').insert(payload).select('id').single();if(res.error)throw res.error;teacherId=res.data?.id||teacherId;const mode=payload.email_confirmation_mode;const provision=await supabase.functions.invoke('teacher-provision-account',{body:{teacher_id:teacherId,email:payload.school_email,mode}});if(provision.error||!provision.data?.ok)throw new Error(provision.data?.error||provision.error?.message||'Teacher account could not be prepared.');if(mode==='ADMIN'){teacherEmailConfirmed=false;pendingAdminConfirmation=true;await sendAdminConfirmationCode();newPhoto=await uploadPhoto();}else{teacherEmailConfirmed=!!provision.data?.confirmed;pendingAdminConfirmation=false;syncOtpControls();newPhoto=await uploadPhoto();}if(newPhoto&&newPhoto!==existingPhoto){const {error:pe}=await supabase.from('teachers').update({photo_url:newPhoto}).eq('id',teacherId);if(pe)throw pe}if(teacherId&&selectedAssignments.length>=0){const {error:de}=await supabase.from('class_subjects').delete().eq('teacher_id',teacherId);if(de)throw de;if(selectedAssignments.length){const rows=selectedAssignments.map(a=>({class_id:a.classId,subject_id:a.subjectId,teacher_id:teacherId}));const {error:ie}=await supabase.from('class_subjects').insert(rows);if(ie)throw ie}}if(mode==='ADMIN'){toast(id?'Teacher updated. Enter the principal verification code above to finish confirmation.':'Teacher registered. Enter the principal verification code above to finish confirmation.');return}toast(id?'Teacher updated and account settings refreshed.':'Teacher registered successfully.');location.href=`teacher-details.html?id=${encodeURIComponent(teacherId)}`;}catch(err){console.error(err);toast(err.message||'Could not save teacher.','error')}finally{setLoading(btn,false)}};
 form.elements.full_name?.addEventListener('input',()=>{clearTimeout(window.__teacherEmailTimer);window.__teacherEmailTimer=setTimeout(()=>generateSchoolEmail().catch(e=>console.error(e)),250)});try{await loadOptions();await loadTeacher();if(!id){await generateStaffId();await generateSchoolEmail()}syncOtpControls()}catch(e){console.error(e);toast(e.message||'Could not load teacher registration data.','error')}
}
