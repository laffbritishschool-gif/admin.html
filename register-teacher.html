<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register Teacher | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.teacher-form-page{animation:rise .45s ease}.teacher-form-hero{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:26px;border-radius:22px;background:linear-gradient(135deg,#123d8f,#0a66c2);color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 45px rgba(18,61,143,.16)}.teacher-form-hero:after{content:'';position:absolute;width:230px;height:230px;border:34px solid rgba(244,196,0,.16);border-radius:50%;right:-80px;top:-120px}.teacher-form-hero h2,.teacher-form-hero p,.teacher-form-hero .section-kicker{position:relative;z-index:1}.teacher-form-hero h2{margin:6px 0}.teacher-form-hero p{margin:0;color:rgba(255,255,255,.78);font-size:12px}.teacher-form-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:16px;margin-top:16px}.teacher-photo-panel{position:sticky;top:16px}..teacher-photo-preview{width:150px;height:150px;margin:4px auto 15px;border-radius:30px;overflow:hidden;background:#eef4ff;border:4px solid #fff;box-shadow:0 12px 28px rgba(19,43,88,.12);display:grid;place-items:center;color:#0b5ed7;font-size:40px;font-weight:800}.teacher-photo-preview img{width:100%;height:100%;object-fit:cover}.upload-box{display:block;border:1px dashed #bfd0ef;background:#f8fbff;border-radius:14px;padding:14px;text-align:center;cursor:pointer}.upload-box:hover{border-color:#0b5ed7;background:#f1f6ff}.upload-box input{display:none}.upload-box strong{display:block;font-size:12px}.upload-box small{display:block;color:var(--muted);margin-top:5px;font-size:10px}.assignment-builder{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end}.assignment-list-form{display:grid;gap:8px;margin-top:12px}.assignment-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border:1px solid #e9edf4;border-radius:12px;background:#fbfcff}.assignment-row strong{font-size:11px}.assignment-row small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.remove-assignment{border:0;background:#fff0f0;color:#c62828;border-radius:8px;padding:6px 9px;cursor:pointer}.form-note{padding:11px 13px;border-radius:12px;background:#fff9df;border:1px solid #f4df83;color:#665400;font-size:10px;line-height:1.5}.teacher-form-actions{display:flex;gap:10px;margin-top:16px}.teacher-form-actions .btn{min-width:130px}.hidden{display:none!important}
@media(max-width:800px){.teacher-form-grid{grid-template-columns:1fr}.teacher-photo-panel{position:static}.assignment-builder{grid-template-columns:1fr}.teacher-form-hero{align-items:flex-start;flex-direction:column}.teacher-form-hero .btn{width:100%;text-align:center}.teacher-form-actions{flex-direction:column}.teacher-form-actions .btn{width:100%}}
</style>
</head>
<body data-title="Register Teacher">
<div id="app-shell" data-content="<div class='teacher-form-page'><div class='loading-inline'>Loading…</div></div>"></div><div id="toast-host"></div>
<script type="module">
import {requireAdmin,mountShell,supabase,escapeHtml,pageLoading,setLoading,toast} from './assets/app.js';
const user=await requireAdmin();
if(user){
 mountShell(user);pageLoading(false);
 const root=document.querySelector('.teacher-form-page');
 const id=new URLSearchParams(location.search).get('id');
 root.innerHTML=`<div class="teacher-form-hero"><div><span class="section-kicker" style="color:#f8d84b">STAFF MANAGEMENT</span><h2>${id?'Edit Teacher':'Register New Teacher'}</h2><p>${id?'Update the teacher profile and teaching assignments.':'Create a complete teacher profile, upload a photo and assign classes and subjects.'}</p></div><a class="btn" style="background:#f4c400;color:#14213d;position:relative;z-index:1" href="teachers.html">← Back to Teachers</a></div><div class="teacher-form-grid"><section class="panel"><div class="panel-head"><div><span class="section-kicker">TEACHER INFORMATION</span><h2>Profile details</h2></div></div><form id="teacher-form" class="form-grid"><label>Staff ID *<input name="staff_id" required placeholder="e.g. TCH-001"></label><label>Full Name *<input name="full_name" required placeholder="Teacher full name"></label><label>Email<input name="email" type="email" placeholder="teacher@school.edu"></label><label>Phone<input name="phone" type="tel" placeholder="080…"></label><label>Status<select name="is_active"><option value="true">Active</option><option value="false">Inactive</option></select></label><div class="form-note" style="grid-column:1/-1">Teacher profile information is saved to the live school staff directory. Class and subject assignments are managed below.</div><div class="panel" style="grid-column:1/-1;margin:0;background:#fbfcff"><div class="panel-head"><div><span class="section-kicker">TEACHING ASSIGNMENTS</span><h2>Classes & subjects</h2></div></div><div class="assignment-builder"><label>Class<select id="assignment-class"><option value="">Select class…</option></select></label><label>Subject<select id="assignment-subject"><option value="">Select subject…</option></select></label><button type="button" class="btn btn-primary" id="add-assignment">Add</button></div><div id="assignment-list" class="assignment-list-form"><div class="teacher-empty">No assignments added yet.</div></div></div><div class="teacher-form-actions" style="grid-column:1/-1"><button class="btn btn-primary" id="save-teacher" type="submit">${id?'Save Changes':'Register Teacher'}</button><a class="btn btn-ghost" href="teachers.html">Cancel</a></div></form></section><aside class="panel teacher-photo-panel"><div class="panel-head"><div><span class="section-kicker">PROFILE PHOTO</span><h2>Teacher Photo</h2></div></div><div id="photo-preview" class="teacher-photo-preview">T</div><label class="upload-box"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><strong>Upload passport photo</strong><small>JPG, PNG or WebP · Maximum 5 MB</small></label><div id="photo-status" class="form-note" style="margin-top:12px">A clear professional photo is recommended.</div></aside></div>`;
 const form=document.querySelector('#teacher-form'),photoInput=document.querySelector('#photo'),preview=document.querySelector('#photo-preview'),status=document.querySelector('#photo-status');
 const classSelect=document.querySelector('#assignment-class'),subjectSelect=document.querySelector('#assignment-subject'),assignmentList=document.querySelector('#assignment-list');
 let teacherId=id,existingPhoto='',selectedAssignments=[];
 function initials(name){return (name||'Teacher').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'T'}
 function renderAssignments(){if(!selectedAssignments.length){assignmentList.innerHTML='<div class="teacher-empty">No assignments added yet.</div>';return}assignmentList.innerHTML=selectedAssignments.map((a,i)=>`<div class="assignment-row"><div><strong>${escapeHtml(a.className)}</strong><small>${escapeHtml(a.level||'')} · ${escapeHtml(a.subjectName)}${a.subjectCode?' · '+escapeHtml(a.subjectCode):''}</small></div><button type="button" class="remove-assignment" data-index="${i}">Remove</button></div>`).join('');assignmentList.querySelectorAll('.remove-assignment').forEach(b=>b.onclick=()=>{selectedAssignments.splice(Number(b.dataset.index),1);renderAssignments()})}
 async function loadOptions(){const [{data:classes,error:ce},{data:subjects,error:se}]=await Promise.all([supabase.from('classes').select('id,name,level').order('name'),supabase.from('subjects').select('id,name,code').eq('is_active',true).order('name')]);if(ce)throw ce;if(se)throw se;classSelect.innerHTML='<option value="">Select class…</option>'+(classes||[]).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.level?' — '+escapeHtml(x.level):''}</option>`).join('');subjectSelect.innerHTML='<option value="">Select subject…</option>'+(subjects||[]).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}${x.code?' — '+escapeHtml(x.code):''}</option>`).join('');}
 async function loadTeacher(){if(!id)return;const {data:t,error}=await supabase.from('teachers').select('id,staff_id,full_name,email,phone,photo_url,is_active').eq('id',id).maybeSingle();if(error)throw error;if(!t)throw new Error('Teacher record not found.');teacherId=t.id;existingPhoto=t.photo_url||'';for(const k of ['staff_id','full_name','email','phone'])form.elements[k].value=t[k]||'';form.elements.is_active.value=String(t.is_active);preview.textContent=initials(t.full_name);if(existingPhoto){try{const {data}=await supabase.storage.from('teacher-photos').createSignedUrl(existingPhoto,3600);if(data?.signedUrl)preview.innerHTML=`<img src="${escapeHtml(data.signedUrl)}" alt="Teacher photo">`;status.textContent='Existing photo loaded. Upload a new photo to replace it.'}catch{}}const {data:as,error:ae}=await supabase.from('class_subjects').select('id,class_id,subject_id,classes(name,level),subjects(name,code)').eq('teacher_id',id);if(ae)throw ae;selectedAssignments=(as||[]).map(a=>({existingId:a.id,classId:a.class_id,subjectId:a.subject_id,className:a.classes?.name||'Class',level:a.classes?.level||'',subjectName:a.subjects?.name||'Subject',subjectCode:a.subjects?.code||''}));renderAssignments()}
 photoInput.onchange=()=>{const file=photoInput.files?.[0];if(!file)return;if(file.size>5*1024*1024){photoInput.value='';toast('Photo must be 5 MB or smaller.','error');return}if(!file.type.startsWith('image/')){photoInput.value='';toast('Please choose a JPG, PNG or WebP image.','error');return}const url=URL.createObjectURL(file);preview.innerHTML=`<img src="${url}" alt="Teacher photo preview">`;status.textContent='New photo selected. It will be uploaded when you save.'};
 document.querySelector('#add-assignment').onclick=()=>{const c=classSelect.options[classSelect.selectedIndex],s=subjectSelect.options[subjectSelect.selectedIndex];if(!classSelect.value||!subjectSelect.value){toast('Select both a class and subject.','error');return}if(selectedAssignments.some(a=>a.classId===classSelect.value&&a.subjectId===subjectSelect.value)){toast('That class and subject assignment already exists.','error');return}selectedAssignments.push({classId:classSelect.value,subjectId:subjectSelect.value,className:c.text.split(' — ')[0],level:'',subjectName:s.text.split(' — ')[0],subjectCode:s.text.includes(' — ')?s.text.split(' — ').slice(1).join(' — '):''});renderAssignments();classSelect.value='';subjectSelect.value=''};
 async function uploadPhoto(){const file=photoInput.files?.[0];if(!file)return existingPhoto||null;const ext=file.name.split('.').pop().toLowerCase();const path=`${teacherId||crypto.randomUUID()}/${Date.now()}.${ext}`;const {error}=await supabase.storage.from('teacher-photos').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return path}
 form.onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#save-teacher');setLoading(btn,true,id?'Saving…':'Registering…');let newPhoto=null;try{const payload={staff_id:form.elements.staff_id.value.trim(),full_name:form.elements.full_name.value.trim(),email:form.elements.email.value.trim()||null,phone:form.elements.phone.value.trim()||null,is_active:form.elements.is_active.value==='true'};if(!payload.staff_id||!payload.full_name)throw new Error('Staff ID and full name are required.');let res;if(teacherId)res=await supabase.from('teachers').update(payload).eq('id',teacherId).select('id').maybeSingle();else res=await supabase.from('teachers').insert(payload).select('id').single();if(res.error)throw res.error;teacherId=res.data?.id||teacherId;newPhoto=await uploadPhoto();if(newPhoto&&newPhoto!==existingPhoto){const {error:pe}=await supabase.from('teachers').update({photo_url:newPhoto}).eq('id',teacherId);if(pe)throw pe}if(teacherId&&selectedAssignments.length>=0){const {error:de}=await supabase.from('class_subjects').delete().eq('teacher_id',teacherId);if(de)throw de;if(selectedAssignments.length){const rows=selectedAssignments.map(a=>({class_id:a.classId,subject_id:a.subjectId,teacher_id:teacherId}));const {error:ie}=await supabase.from('class_subjects').insert(rows);if(ie)throw ie}}toast(id?'Teacher updated successfully.':'Teacher registered successfully.');location.href=`teacher-details.html?id=${encodeURIComponent(teacherId)}`;}catch(err){console.error(err);toast(err.message||'Could not save teacher.','error')}finally{setLoading(btn,false)}};
 try{await loadOptions();await loadTeacher()}catch(e){console.error(e);toast('Could not load teacher registration data.','error')}
}
</script>
</body></html>
