<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Settings | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css?v=8"></head><body data-title="Settings" data-module="settings"><div id="page-loader" class="loader active"><div class="loader-box"><span class="spinner"></span><div>Loading school settings…</div></div></div><div id="app-shell" data-content=""></div><div id="toast-host"></div><script type="module">import{requireAdmin,mountShell,pageLoading,loadSchoolSettings}from'./assets/app.js?v=8';import{renderSettingsPage}from'./assets/settings-pages.js?v=1';const u=await requireAdmin();if(u){mountShell(u);try{await loadSchoolSettings();await renderSettingsPage()}catch(e){console.error(e);document.querySelector('.page-content')?.insertAdjacentHTML('beforeend','<div class="panel empty-state"><h3>Could not load settings</h3><p>Please refresh and try again.</p></div>')}finally{pageLoading(false)}}</script></body></html>
