<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Details | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><style>.teacher-detail{animation:rise .45s ease}.td-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;padding:30px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#123d8f,#0a66c2);box-shadow:0 20px 50px rgba(18,61,143,.2)}.td-hero:after{content:'';position:absolute;width:250px;height:250px;border:38px solid rgba(244,196,0,.17);border-radius:50%;right:-90px;top:-130px}.td-photo{width:118px;height:118px;flex:0 0 auto;border-radius:28px;overflow:hidden;border:4px solid rgba(255,255,255,.7);background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:38px;font-weight:800;position:relative;z-index:1}.td-photo img{width:100%;height:100%;object-fit:cover}.td-identity{position:relative;z-index:1}.td-identity .kicker{font-size:10px;letter-spacing:1.2px;font-weight:800;color:#f8d84b}.td-identity h1{font-size:30px;margin:7px 0}.td-identity p{margin:0;color:rgba(255,255,255,.8);font-size:12px}.td-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.td-pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.13);font-size:10px}.td-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.td-grid .panel{margin:0}.assignment-list{display:grid;gap:10px}.assignment{padding:14px;border:1px solid #edf0f4;background:#fbfcff;border-radius:13px}.assignment b{font-size:13px}.assignment span{display:block;margin-top:5px;color:var(--muted);font-size:10px}.info-list{display:grid;gap:9px}.info-row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #edf0f4}.info-row:last-child{border-bottom:0}.info-row span{font-size:10px;color:var(--muted)}.info-row strong{font-size:11px;text-align:right;word-break:break-word}.td-actions{display:flex;gap:9px;margin-top:16px}.td-actions .btn{display:inline-block}@media(max-width:700px){.td-hero{align-items:flex-start;padding:22px;flex-direction:column}.td-photo{width:90px;height:90px;border-radius:22px}.td-identity h1{font-size:23px}.td-grid{grid-template-columns:1fr}.td-actions .btn{flex:1;text-align:center}}</style></head><body data-title="Teacher Details"><div id="app-shell" data-content=""></div><div id="toast-host"></div><script type="module">import{requireAdmin,mountShell,supabase,escapeHtml,pageLoading,toast}from'./assets/app.js';const u=await requireAdmin();if(u){const id=new URLSearchParams(location.search).get('id');const shell=document.querySelector('#app-shell');shell.dataset.content='<div class="teacher-detail"><div class="loading-inline">Loading teacher details…</div></div>';mountShell(u);pageLoading(false);const root=document.querySelector('.teacher-detail');if(!id){root.innerHTML='<div class="panel empty">Teacher record was not specified.</div>'}else{try{const{data:t,error:te}=await supabase.from('teachers').select('id,staff_id,full_name,email,phone,photo_url,is_active,created_at').eq('id',id).maybeSingle();if(te)throw te;if(!t){root.innerHTML='<div class="panel empty">Teacher record not found.</div>'}else{const[{data:assignments,error:ae},{data:tt,error:tte}]=await Promise.all([supabase.from('class_subjects').select('id,classes(name,level),subjects(name,code)').eq('teacher_id',id),supabase.from('timetables').select('id,day_of_week,start_time,end_time,room,classes(name),subjects(name)').eq('teacher_id',id).order('day_of_week').order('start_time')]);if(ae)throw ae;if(tte)throw tte;let image='';if(t.photo_url){try{const{data}=await supabase.storage.from('teacher-photos').createSignedUrl(t.photo_url,3600);image=data?.signedUrl||''}catch{}}const initials=(t.full_name||'Teacher').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();const days=['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];root.innerHTML=`<div class="detail-topbar"><a class="back-link" href="teachers.html">← Back to teachers</a><div class="td-actions"><a class="btn btn-ghost" href="register-teacher.html?id=${encodeURIComponent(t.id)}">Edit teacher</a></div></div><section class="td-hero"><div class="td-photo">${image?`<img src="${escapeHtml(image)}" alt="${escapeHtml(t.full_name||'Teacher')}">`:escapeHtml(initials)}</div><div class="td-identity"><div class="kicker">TEACHER PROFILE</div><h1>${escapeHtml(t.full_name||'Unnamed teacher')}</h1><p>${escapeHtml(t.staff_id||'No staff ID')} · ${t.is_active?'Active teacher':'Inactive teacher'}</p><div class="td-pills"><span class="td-pill">${escapeHtml(t.email||'No email')}</span><span class="td-pill">${escapeHtml(t.phone||'No phone')}</span></div></div></section><div class="td-grid"><section class="panel"><div class="detail-panel-title"><div><span class="section-kicker">PROFILE</span><h2>Contact information</h2></div></div><div class="info-list"><div class="info-row"><span>Staff ID</span><strong>${escapeHtml(t.staff_id||'—')}</strong></div><div class="info-row"><span>Full name</span><strong>${escapeHtml(t.full_name||'—')}</strong></div><div class="info-row"><span>Email</span><strong>${escapeHtml(t.email||'—')}</strong></div><div class="info-row"><span>Phone</span><strong>${escapeHtml(t.phone||'—')}</strong></div><div class="info-row"><span>Record created</span><strong>${t.created_at?new Date(t.created_at).toLocaleDateString():'—'}</strong></div></div></section><section class="panel"><div class="detail-panel-title"><div><span class="section-kicker">ASSIGNMENTS</span><h2>Classes & subjects</h2></div></div><div class="assignment-list">${assignments?.length?assignments.map(a=>`<div class="assignment"><b>${escapeHtml(a.classes?.name||'Class not set')}</b><span>${escapeHtml(a.classes?.level||'')} · ${escapeHtml(a.subjects?.name||'Subject not set')}${a.subjects?.code?' ('+escapeHtml(a.subjects.code)+')':''}</span></div>`).join(''):'<div class="empty">No class or subject assignments yet.</div>'}</div></section></div><section class="panel" style="margin-top:16px"><div class="detail-panel-title"><div><span class="section-kicker">SCHEDULE</span><h2>Teaching timetable</h2></div></div><div class="table-wrap">${tt?.length?`<table><thead><tr><th>Day</th><th>Time</th><th>Class</th><th>Subject</th><th>Room</th></tr></thead><tbody>${tt.map(x=>`<tr><td>${days[x.day_of_week]||x.day_of_week}</td><td>${escapeHtml((x.start_time||'').slice(0,5))} – ${escapeHtml((x.end_time||'').slice(0,5))}</td><td>${escapeHtml(x.classes?.name||'—')}</td><td>${escapeHtml(x.subjects?.name||'—')}</td><td>${escapeHtml(x.room||'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No timetable entries assigned to this teacher yet.</div>'}</div></section>`}}}catch(e){console.error(e);root.innerHTML='<div class="panel empty">Teacher details could not be loaded.</div>';toast('Could not load teacher details.','error')}}}}</script></body></html>
