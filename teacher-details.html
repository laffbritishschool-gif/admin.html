<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Details | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.teacher-detail-page{animation:rise .45s ease}.teacher-detail-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;padding:30px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#123d8f,#0a66c2);box-shadow:0 20px 50px rgba(18,61,143,.18)}.teacher-detail-hero:after{content:'';position:absolute;width:260px;height:260px;border:38px solid rgba(244,196,0,.16);border-radius:50%;right:-100px;top:-145px}.teacher-detail-photo{width:120px;height:120px;flex:0 0 120px;border-radius:28px;overflow:hidden;border:4px solid rgba(255,255,255,.8);background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:38px;font-weight:800;position:relative;z-index:1}.teacher-detail-photo img{width:100%;height:100%;object-fit:cover}.teacher-detail-identity{position:relative;z-index:1}.teacher-detail-identity .kicker{font-size:10px;letter-spacing:1.3px;font-weight:800;color:#f8d84b}.teacher-detail-identity h1{font-size:30px;margin:7px 0}.teacher-detail-identity p{margin:0;color:rgba(255,255,255,.82);font-size:12px}.teacher-detail-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.teacher-detail-pill{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.13);font-size:10px}.teacher-detail-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.teacher-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.teacher-detail-grid .panel{margin:0}.teacher-info{display:grid;gap:9px}.teacher-info-row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #edf0f4}.teacher-info-row:last-child{border-bottom:0}.teacher-info-row span{font-size:10px;color:var(--muted)}.teacher-info-row strong{text-align:right;font-size:11px;word-break:break-word}.assignment-list{display:grid;gap:10px}.assignment-item{padding:14px;border:1px solid #edf0f4;background:#fbfcff;border-radius:13px}.assignment-item strong{font-size:13px}.assignment-item small{display:block;margin-top:5px;color:var(--muted);font-size:10px}.teacher-detail-actions{display:flex;gap:9px;margin-top:16px}.teacher-detail-actions .btn{display:inline-block}.teacher-empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:700px){.teacher-detail-hero{align-items:flex-start;flex-direction:column;padding:22px}.teacher-detail-photo{width:92px;height:92px;flex-basis:92px}.teacher-detail-identity h1{font-size:23px}.teacher-detail-grid{grid-template-columns:1fr}.teacher-detail-top{align-items:flex-start;gap:10px}.teacher-detail-actions .btn{flex:1;text-align:center}}
</style>
</head>
<body data-title="Teacher Details">
<div id="app-shell" data-content="<div class='teacher-detail-page'><div class='loading-inline'>Loading teacher details…</div></div>"></div><div id="toast-host"></div>
<script type="module">
import {requireAdmin,mountShell,supabase,escapeHtml,pageLoading,toast} from './assets/app.js';
const user=await requireAdmin();
if(user){
 mountShell(user); pageLoading(false);
 const root=document.querySelector('.teacher-detail-page');
 const id=new URLSearchParams(location.search).get('id');
 if(!id){root.innerHTML='<div class="panel teacher-empty">Teacher record was not specified.<div class="teacher-detail-actions"><a class="btn btn-primary" href="teachers.html">Back to Teachers</a></div></div>'}
 else try{
  const {data:t,error:te}=await supabase.from('teachers').select('id,staff_id,full_name,email,phone,photo_url,is_active,created_at').eq('id',id).maybeSingle();
  if(te)throw te;
  if(!t){root.innerHTML='<div class="panel teacher-empty">Teacher record not found.<div class="teacher-detail-actions"><a class="btn btn-primary" href="teachers.html">Back to Teachers</a></div></div>'}
  else{
   const [{data:assignments,error:ae},{data:tt,error:tte}]=await Promise.all([
    supabase.from('class_subjects').select('id,class_id,subject_id,classes(name,level),subjects(name,code)').eq('teacher_id',id),
    supabase.from('timetables').select('id,day_of_week,start_time,end_time,room,classes(name),subjects(name)').eq('teacher_id',id).order('day_of_week').order('start_time')
   ]);
   if(ae)throw ae;if(tte)throw tte;
   let image='';
   if(t.photo_url){const r=await supabase.storage.from('teacher-photos').createSignedUrl(t.photo_url,3600);image=r.data?.signedUrl||'';}
   const initials=(t.full_name||'Teacher').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
   const days=['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
   const assignmentHtml=(assignments||[]).length?(assignments||[]).map(a=>`<div class="assignment-item"><strong>${escapeHtml(a.classes?.name||'Class not assigned')}</strong><small>${escapeHtml(a.classes?.level||'')} · ${escapeHtml(a.subjects?.name||'Subject not assigned')}${a.subjects?.code?' · '+escapeHtml(a.subjects.code):''}</small></div>`).join(''):'<div class="teacher-empty">No class or subject assignments yet.</div>';
   const timetableHtml=(tt||[]).length?`<div class="table-wrap"><table><thead><tr><th>Day</th><th>Time</th><th>Class</th><th>Subject</th><th>Room</th></tr></thead><tbody>${tt.map(x=>`<tr><td>${escapeHtml(days[x.day_of_week]||String(x.day_of_week))}</td><td>${escapeHtml((x.start_time||'').slice(0,5))} – ${escapeHtml((x.end_time||'').slice(0,5))}</td><td>${escapeHtml(x.classes?.name||'—')}</td><td>${escapeHtml(x.subjects?.name||'—')}</td><td>${escapeHtml(x.room||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="teacher-empty">No timetable entries assigned to this teacher yet.</div>';
   root.innerHTML=`<div class="teacher-detail-top"><a class="back-link" href="teachers.html">← Back to Teachers</a><a class="btn btn-ghost" href="register-teacher.html?id=${encodeURIComponent(t.id)}">Edit Teacher</a></div><section class="teacher-detail-hero"><div class="teacher-detail-photo">${image?`<img src="${escapeHtml(image)}" alt="${escapeHtml(t.full_name||'Teacher')}">`:escapeHtml(initials)}</div><div class="teacher-detail-identity"><div class="kicker">TEACHER PROFILE</div><h1>${escapeHtml(t.full_name||'Unnamed Teacher')}</h1><p>${escapeHtml(t.staff_id||'No Staff ID')} · ${t.is_active?'Active Teacher':'Inactive Teacher'}</p><div class="teacher-detail-pills"><span class="teacher-detail-pill">${escapeHtml(t.email||'No email')}</span><span class="teacher-detail-pill">${escapeHtml(t.phone||'No phone')}</span></div></div></section><div class="teacher-detail-grid"><section class="panel"><div class="detail-panel-title"><div><span class="section-kicker">PROFILE</span><h2>Contact Information</h2></div></div><div class="teacher-info"><div class="teacher-info-row"><span>Staff ID</span><strong>${escapeHtml(t.staff_id||'—')}</strong></div><div class="teacher-info-row"><span>Full Name</span><strong>${escapeHtml(t.full_name||'—')}</strong></div><div class="teacher-info-row"><span>Email</span><strong>${escapeHtml(t.email||'—')}</strong></div><div class="teacher-info-row"><span>Phone</span><strong>${escapeHtml(t.phone||'—')}</strong></div><div class="teacher-info-row"><span>Status</span><strong>${t.is_active?'Active':'Inactive'}</strong></div><div class="teacher-info-row"><span>Record Created</span><strong>${t.created_at?new Date(t.created_at).toLocaleDateString():'—'}</strong></div></div></section><section class="panel"><div class="detail-panel-title"><div><span class="section-kicker">ASSIGNMENTS</span><h2>Classes & Subjects</h2></div></div><div class="assignment-list">${assignmentHtml}</div></section></div><section class="panel" style="margin-top:16px"><div class="detail-panel-title"><div><span class="section-kicker">SCHEDULE</span><h2>Teaching Timetable</h2></div></div>${timetableHtml}</section>`;
  }
 }catch(e){console.error(e);root.innerHTML='<div class="panel teacher-empty">Teacher details could not be loaded. Please refresh and try again.<div class="teacher-detail-actions"><a class="btn btn-primary" href="teachers.html">Back to Teachers</a></div></div>';toast('Could not load teacher details.','error')}
}
</script>
</body></html>
