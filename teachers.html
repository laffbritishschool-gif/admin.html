<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teachers | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><style>.teacher-page{animation:rise .45s ease}.teacher-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px;padding:26px;border-radius:22px;background:linear-gradient(135deg,#123d8f,#0a66c2);color:#fff;box-shadow:0 18px 45px rgba(18,61,143,.18);position:relative;overflow:hidden}.teacher-hero:after{content:'';position:absolute;width:220px;height:220px;border:34px solid rgba(244,196,0,.16);border-radius:50%;right:-80px;top:-120px}.teacher-hero h2,.teacher-hero p,.teacher-hero .btn{position:relative;z-index:1}.teacher-hero h2{margin:5px 0 6px;font-size:27px}.teacher-hero p{margin:0;color:rgba(255,255,255,.78);font-size:12px}.teacher-hero .btn{background:#f4c400;color:#14213d}.teacher-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}.teacher-toolbar input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:0}.teacher-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.teacher-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 25px rgba(19,43,88,.06);animation:cardIn .5s ease both;animation-delay:var(--delay);transition:.2s}.teacher-card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(19,43,88,.12)}.teacher-card-cover{height:76px;background:linear-gradient(135deg,#eaf1ff,#f8faff);position:relative}.teacher-photo{width:76px;height:76px;border-radius:22px;overflow:hidden;position:absolute;left:18px;bottom:-38px;border:4px solid #fff;background:#eaf1ff;box-shadow:0 8px 20px rgba(19,43,88,.12);display:grid;place-items:center;color:var(--blue);font-size:25px;font-weight:800}.teacher-photo img{width:100%;height:100%;object-fit:cover}.teacher-card-body{padding:48px 18px 18px}.teacher-card-body h3{margin:0;font-size:17px}.teacher-staff{margin:4px 0 12px;color:var(--blue2);font-size:11px;font-weight:700}.teacher-meta{display:grid;gap:7px}.teacher-meta div{padding:9px 10px;border:1px solid #edf0f4;background:#fbfcff;border-radius:10px}.teacher-meta small,.teacher-meta strong{display:block}.teacher-meta small{font-size:9px;color:var(--muted)}.teacher-meta strong{font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.teacher-card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0f4;margin-top:14px;padding-top:13px}.teacher-card-footer small{font-size:9px;color:var(--muted)}.teacher-view{padding:8px 12px;font-size:11px}.teacher-empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}@media(max-width:1000px){.teacher-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.teacher-hero{align-items:flex-start;flex-direction:column}.teacher-hero .btn{width:100%;text-align:center}.teacher-toolbar{flex-direction:column}.teacher-toolbar input,.teacher-toolbar button{width:100%}.teacher-grid{grid-template-columns:1fr}}</style></head><body data-title="Teachers"><div id="app-shell" data-content=""></div><div id="toast-host"></div><script type="module">import{requireAdmin,mountShell,supabase,escapeHtml,pageLoading,toast}from'./assets/app.js';const u=await requireAdmin();if(u){const shell=document.querySelector('#app-shell');shell.dataset.content=`<div class="teacher-page"><div class="teacher-hero"><div><span class="section-kicker" style="color:#f8d84b">STAFF DIRECTORY</span><h2>Teachers</h2><p>View teaching staff, contact details and their current class and subject assignments.</p></div><a class="btn" href="register-teacher.html">+ Register new teacher</a></div><div class="teacher-toolbar"><input id="teacher-search" placeholder="Search by name, staff ID, email or phone…"><button class="btn btn-ghost" id="teacher-refresh">Refresh</button></div><div id="teacher-list" class="teacher-grid"><div class="teacher-empty">Loading teachers…</div></div></div>`;mountShell(u);pageLoading(false);const list=document.querySelector('#teacher-list');async function photo(path){if(!path)return '';try{const{data}=await supabase.storage.from('teacher-photos').createSignedUrl(path,3600);return data?.signedUrl||''}catch{return ''}}async function load(){list.innerHTML='<div class="teacher-empty">Loading teachers…</div>';try{const search=document.querySelector('#teacher-search').value.trim();let q=supabase.from('teachers').select('id,staff_id,full_name,email,phone,photo_url,is_active,created_at').order('created_at',{ascending:false}).limit(100);if(search)q=q.or(`full_name.ilike.%${search}%,staff_id.ilike.%${search}%,email.ilike.%${search}%,phone.ilike.%${search}%`);const{data,error}=await q;if(error)throw error;const rows=data||[];if(!rows.length){list.innerHTML='<div class="teacher-empty">No teachers found.</div>';return}const cards=await Promise.all(rows.map(async(r,i)=>{const url=await photo(r.photo_url);const initials=(r.full_name||'Teacher').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();return `<article class="teacher-card" style="--delay:${i*55}ms"><div class="teacher-card-cover"><div class="teacher-photo">${url?`<img src="${escapeHtml(url)}" alt="${escapeHtml(r.full_name||'Teacher')}">`:escapeHtml(initials)}</div></div><div class="teacher-card-body"><h3>${escapeHtml(r.full_name||'Unnamed teacher')}</h3><div class="teacher-staff">${escapeHtml(r.staff_id||'No staff ID')}</div><div class="teacher-meta"><div><small>Email</small><strong>${escapeHtml(r.email||'Not provided')}</strong></div><div><small>Phone</small><strong>${escapeHtml(r.phone||'Not provided')}</strong></div></div><div class="teacher-card-footer"><small>${r.is_active?'Active teacher':'Inactive teacher'}</small><a class="btn teacher-view" href="teacher-details.html?id=${encodeURIComponent(r.id)}">View</a></div></div></article>`}));list.innerHTML=cards.join('')}catch(e){console.error(e);list.innerHTML='<div class="teacher-empty">Teachers could not be loaded.</div>';toast('Could not load teachers.','error')}}document.querySelector('#teacher-refresh').onclick=load;document.querySelector('#teacher-search').oninput=load;await load()}</script></body></html>
